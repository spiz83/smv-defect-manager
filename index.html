        // ── PDF FILENAME ────────────────────────────────────────────────────
        // <Who>_<dd.mm>_Items.pdf — e.g. Bayhill_12.06_Items.pdf.
        //
        // Spiro 2026-08-07: "any time a pdf report is created, regardless of
        // whether it is from a JOB screen or a Supplier screen, it is to be
        // renamed and not have jibberish in the filename … abbreviated name of
        // contractor or trade, followed by the date (only dd/mm), + items."
        //
        // <Who> is whatever the report is actually ABOUT, resolved in the order
        // a supervisor would name it out loud: the supplier it is going to,
        // else the trade, else the job, else what it spans. EVERY generated PDF
        // comes through here — job screen 📑, supplier screen 📑, the report
        // builder, ✉️ / 🔗 email — and cloud-sync uploads under this name too,
        // so what the trade taps open is never called `k3j9x2m1.pdf` again.
        //
        // Whatever comes out of here has to survive being a URL path segment
        // and a filename on iOS, Android, Windows and macOS, so: letters,
        // digits, `.`, `-` and `_` only. Nothing else is ever emitted.

        // A name squeezed down to one filename-safe word, each kept word
        // capitalised. Words are taken from the front until there are at least
        // two characters, which is what makes the abbreviation useful on both
        // shapes of trading name:
        //   'BAYHILL PLUMBING PTY LTD'                    → Bayhill
        //   'Downeys Group Aust (VIC) P/L T/A DGA Roofing' → Downeys
        //   'H & K Painting'                               → HK
        function reportNameWord(text, max) {
            // Fold accents first, or 'Bäyhill' splits into 'B' + 'yhill' and the
            // abbreviation comes out as BYhill instead of Bayhill.
            const flat = String(text == null ? '' : text).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            const words = flat.split(/[^a-z0-9]+/i).filter(Boolean);
            let out = '';
            for (const w of words) {
                out += w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
                if (out.length >= 2) break;
            }
            return out.slice(0, max || 18);
        }
        // A job named the way the site names it: lot number + street, no street
        // type. 'Lot 903, 12 Woodlawn Drive' → 903Woodlawn.
        function reportJobWord(addressId) {
            const STREET_TYPES = /\b(rd|road|st|street|ave|avenue|dr|drive|drv|ct|court|cres|crescent|pl|place|blvd|boulevard|ln|lane|tce|terrace|cl|close|pde|parade|cct|circuit|gr|grove|hwy|highway|way|esp|esplanade|sq|square|vista|cir|circle|grn|green|rise|view|walk|prom|promenade)\b/gi;
            const a = db.getAddress(addressId);
            if (!a) return '';
            const lot = String(a.lotNo || (String(a.street || '').match(/lot\s*(\d+)/i) || [])[1] || '').replace(/\D/g, '');
            const raw = (a.streetName || a.street || '').replace(/^\s*\(?\d+[a-z]?\)?[\s,]+/i, '').replace(/,.*$/, '');
            // Stripping the street type off 'The Grove' would leave 'The', so
            // only take the stripped form when something is actually left.
            const stripped = raw.replace(STREET_TYPES, ' ').replace(/[^a-z0-9]/gi, '');
            const nm = reportNameWord(stripped || raw, 16);
            return (lot + nm).slice(0, 20);
        }
        function buildReportFilename(opts) {
            opts = opts || {};
            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const dm = pad(now.getDate()) + '.' + pad(now.getMonth() + 1);   // 12.06

            let who = '';
            // 1 · The supplier it is going to. This is the common case — the
            //     supplier email, and 📑 on a supplier group inside a job.
            if (opts.contractorIds && opts.contractorIds.length === 1) {
                const c = db.getContractor(opts.contractorIds[0]);
                who = reportNameWord(c && c.name);
            }
            // 2 · The trade, when the report covers a whole trade rather than
            //     one sub. An explicitly TICKED trade comes first: the dialog
            //     can be opened on the Plumber screen and narrowed to Painter,
            //     and the file has to say what is in it, not where it started.
            //     The trade screen itself scopes by its SET of contractors, so
            //     its trade name is handed down as tradeName or it is lost.
            if (!who && opts.tradeIds && opts.tradeIds.length === 1) {
                const t = (db.data.trades || []).find(x => x.id === opts.tradeIds[0]);
                who = reportNameWord(t && t.name);
            }
            if (!who && opts.tradeName) who = reportNameWord(opts.tradeName);
            // 3 · The job — a report generated from the job screen.
            if (!who && opts.addressIds && opts.addressIds.length === 1) who = reportJobWord(opts.addressIds[0]);
            // 4 · Nothing single to name it after: say what it spans, rather
            //     than fall back to something that describes nothing.
            if (!who && opts.addressIds && opts.addressIds.length > 1) who = opts.addressIds.length + 'Jobs';
            if (!who && opts.contractorIds && opts.contractorIds.length > 1) who = opts.contractorIds.length + 'Suppliers';
            if (!who) who = 'All';

            return who + '_' + dm + '_Items.pdf';
        }

        async function generateDefectPDF(list, opts) {
            await ensureJsPdf();
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'mm', format: 'a4' });
            const pageW = 210, pageH = 297, M = 11, contentW = pageW - 2 * M;
            const now = new Date();
            const niceDate = now.toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });

            // ── palette ──────────────────────────────────────────────
            const NAVY = [18, 33, 66], NAVY2 = [44, 84, 168];
            const INK = [28, 34, 50], MUTE = [122, 130, 144], LINE = [226, 230, 238];
            const statusColor = { open: [220, 38, 38], pending: [217, 119, 6], completed: [22, 163, 74] };
            const fill = (c) => doc.setFillColor(c[0], c[1], c[2]);
            const stroke = (c) => doc.setDrawColor(c[0], c[1], c[2]);
            const ink = (c) => doc.setTextColor(c[0], c[1], c[2]);

            // ── header band (page 1) ─────────────────────────────────
            fill(NAVY); doc.rect(0, 0, pageW, 34, 'F');
            fill(NAVY2); doc.rect(0, 34, pageW, 1.4, 'F');
            doc.setFont('helvetica', 'bold'); doc.setFontSize(22); ink([255, 255, 255]);
            doc.text('DEFECT REPORT', M, 16.5);
            doc.setFont('helvetica', 'normal'); doc.setFontSize(10); ink([186, 199, 224]);
            doc.text('SMV Defect Manager', M, 23.5);
            doc.setFontSize(9); ink([198, 209, 230]);
            doc.text(niceDate, pageW - M, 14, { align: 'right' });
            doc.setFont('helvetica', 'bold'); doc.setFontSize(12); ink([255, 255, 255]);
            doc.text(list.length + (list.length === 1 ? ' defect' : ' defects'), pageW - M, 22, { align: 'right' });

            let y = 44;

            // ── filter summary line ──────────────────────────────────
            const parts = [];
            if (opts.statuses && opts.statuses.length) parts.push('Status: ' + opts.statuses.join(', '));
            if (opts.addressIds && opts.addressIds.length) parts.push('Address: ' + opts.addressIds.map(id => formatAddress(db.getAddress(id))).join('; '));
            if (opts.contractorIds && opts.contractorIds.length) parts.push('Contractor: ' + opts.contractorIds.map(id => { const c = db.getContractor(id); return c ? c.name : ''; }).filter(Boolean).join('; '));
            if (opts.tradeIds && opts.tradeIds.length) parts.push('Trades: ' + opts.tradeIds.map(id => { const t = db.data.trades.find(x => x.id === id); return t ? t.name : ''; }).filter(Boolean).join(', '));
            if (opts.from || opts.to) parts.push('Dates: ' + (opts.from || '…') + ' → ' + (opts.to || '…'));
            if (parts.length) {
                doc.setFont('helvetica', 'normal'); doc.setFontSize(9); ink(MUTE);
                const ft = doc.splitTextToSize(parts.join('     ·     '), contentW);
                doc.text(ft, M, y); y += ft.length * 4 + 3;
            }

            // ── status summary pills ─────────────────────────────────
            const counts = { open: 0, pending: 0, completed: 0 };
            list.forEach(d => { const s = defectStatusOf(d); if (counts[s] != null) counts[s]++; });
            let px = M;
            [['open', 'OPEN'], ['pending', 'PENDING'], ['completed', 'COMPLETED']].forEach(([key, lbl]) => {
                const txt = counts[key] + '  ' + lbl;
                doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
                const w = doc.getTextWidth(txt) + 8;
                fill(statusColor[key]); doc.roundedRect(px, y, w, 6.5, 1.6, 1.6, 'F');
                ink([255, 255, 255]); doc.text(txt, px + 4, y + 4.4);
                px += w + 4;
            });
            y += 13;

            // Section grouping. Default groups by TRADE (Painter, Plumbing, …) so
            // like items combine (#7). opts.groupBy === 'address' groups by JOB
            // instead — each address is a header with its defects below — which
            // is what per-contractor / per-job reports use so a supplier reads
            // their items laid out job-by-job.
            const byAddress = opts.groupBy === 'address';
            const groups = {};
            list.forEach(d => { const k = byAddress ? String(d.addressId) : defectTradeKey(d); (groups[k] = groups[k] || []).push(d); });
            const groupKeys = byAddress
                ? Object.keys(groups).sort((a, b) => formatAddress(db.getAddress(parseInt(a))).localeCompare(formatAddress(db.getAddress(parseInt(b)))))
                : Object.keys(groups).sort((a, b) => a === 'Unassigned' ? 1 : b === 'Unassigned' ? -1 : a.localeCompare(b));
            const groupLabel = (gk) => byAddress ? formatAddress(db.getAddress(parseInt(gk))) : gk;
            const ensureSpace = (h) => { if (y + h > pageH - 18) { doc.addPage(); y = M + 4; } };

            // Two-column "table" of photo cards — DENSE: big, wide photos with a
            // tight 2-line description and minimal margins so ~6 defects fit a page.
            const gap = 3;
            const colW = (contentW - gap) / 2;   // ≈ 91mm per column
            const innerW = colW - 3;             // photo/text span almost the full card
            const PAD = 2;                       // inner padding (small = little margin)

            const photosFor = async (d) => {
                if (!opts.photos || !window.CloudPhotos) return [];
                try { return await window.CloudPhotos.getForPdf(d.id); } catch (e) { return []; }
            };
            // Photo layout for a card: a single big photo, or a 2-column grid
            // when a defect has several. EVERY photo is shown (nothing is dropped)
            // — the grid flows down as many rows as needed. Returns the grid
            // geometry + total block height so cards can be measured before drawing.
            const cellGap = 1.5;
            const photoBlock = (imgs) => {
                const n = (imgs || []).length;
                if (!n) return { n: 0, cols: 0, rows: 0, cellW: 0, cellH: 0, totalH: 0 };
                const cols = n === 1 ? 1 : 2;
                const rows = Math.ceil(n / cols);
                const cellW = (innerW - (cols - 1) * cellGap) / cols;
                // Single photo can be tall; grid cells are shorter so several fit.
                let cellH = Math.min(cellW * 0.72, n === 1 ? 64 : 33);
                let totalH = rows * cellH + (rows - 1) * cellGap;
                // Safety: a defect with lots of photos would overflow the page, so
                // shrink the cells until the whole grid fits one page — every photo
                // still appears, just smaller, rather than being cut off.
                const maxGridH = 230;
                if (totalH > maxGridH) {
                    cellH = Math.max(10, (maxGridH - (rows - 1) * cellGap) / rows);
                    totalH = rows * cellH + (rows - 1) * cellGap;
                }
                return { n, cols, rows, cellW, cellH, totalH };
            };
            // Draw one image "contained" (whole photo visible, aspect kept) and
            // centred inside a cell.
            const drawContained = (img, cx, cy, cw, ch) => {
                if (!img) return;
                let iw = cw, ih = ch;
                if (img.w && img.h) {
                    const ar = img.w / img.h;
                    if (cw / ch > ar) { ih = ch; iw = ch * ar; } else { iw = cw; ih = cw / ar; }
                }
                const ox = cx + (cw - iw) / 2, oy = cy + (ch - ih) / 2;
                try { doc.addImage(img.dataUrl, 'JPEG', ox, oy, iw, ih); } catch (e) {}
            };
            // Truncate a wrapped block to N lines with an ellipsis (keeps text area
            // small so the photo dominates — the user asked to cut words, not wrap).
            const clampLines = (lines, n) => {
                if (lines.length <= n) return lines;
                const out = lines.slice(0, n);
                out[n - 1] = out[n - 1].replace(/\s*\S*$/, '') + '…';
                return out;
            };
            const cardMetaLines = (d) => {
                const c = db.getContractor(d.contractorId);
                const a = db.getAddress(d.addressId);
                // When grouped by address the job is already the section header, so
                // drop it from the card meta to avoid repeating it on every item.
                const bits = (byAddress
                    ? [c ? c.name : 'Unassigned', d.bookingAt ? ('Attend: ' + fmtDateNice(d.bookingAt)) : '']
                    : [a ? formatAddress(a) : '', c ? c.name : 'Unassigned', d.bookingAt ? ('Attend: ' + fmtDateNice(d.bookingAt)) : '']
                ).filter(Boolean);
                doc.setFontSize(7);
                return clampLines(doc.splitTextToSize(bits.join('  ·  '), innerW), 1);
            };
            const descLinesFor = (d) => {
                doc.setFontSize(8.5);
                const descTxt = formatDefectEmailLine(d) || '(no description)';
                return clampLines(doc.splitTextToSize(descTxt, innerW), 2);
            };
            const measureCard = (d, imgs) => {
                const dl = descLinesFor(d).length, ml = cardMetaLines(d).length;
                const { totalH } = photoBlock(imgs);
                return 4.6 + 4 + dl * 3.3 + 1 + ml * 2.9 + 0.8 + (totalH ? totalH : 0) + 2;
            };
            const drawCard = (x, y0, boxH, d, num, imgs) => {
                const st = defectStatusOf(d);
                fill([250, 251, 253]); stroke(LINE);
                doc.roundedRect(x, y0, colW, boxH, 1.6, 1.6, 'FD');
                const px = x + PAD; let cy = y0 + 4.6;
                // number + status badge (one line)
                doc.setFont('helvetica', 'bold'); doc.setFontSize(9); ink(INK);
                doc.text('#' + num, px, cy);
                const col = statusColor[st] || [120, 120, 120];
                const blab = st.toUpperCase();
                doc.setFontSize(6.6); const bw = doc.getTextWidth(blab) + 5;
                fill(col); doc.roundedRect(x + colW - PAD - bw, cy - 3.4, bw, 4.8, 1.2, 1.2, 'F');
                ink([255, 255, 255]); doc.setFont('helvetica', 'bold');
                doc.text(blab, x + colW - PAD - bw / 2, cy - 0.1, { align: 'center' });
                cy += 4;
                // description (compact, max 2 lines)
                doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); ink(INK);
                const dl = descLinesFor(d);
                doc.text(dl, px, cy); cy += dl.length * 3.3 + 1;
                // meta (address · contractor · attend) — one line
                doc.setFontSize(7); ink(MUTE);
                const ml = cardMetaLines(d);
                doc.text(ml, px, cy); cy += ml.length * 2.9 + 0.8;
                // photos — one big, or ALL of them in a 2-column grid that flows
                // down as many rows as the defect needs
                const pb = photoBlock(imgs);
                if (pb.n) {
                    for (let k = 0; k < pb.n; k++) {
                        const r = Math.floor(k / pb.cols), c = k % pb.cols;
                        const cx = px + c * (pb.cellW + cellGap);
                        const cyy = cy + r * (pb.cellH + cellGap);
                        drawContained(imgs[k], cx, cyy, pb.cellW, pb.cellH);
                    }
                    cy += pb.totalH;
                }
            };

            let itemNo = 0;
            const bookingDates = new Set();
            for (const gk of groupKeys) {
                const gdefects = groups[gk];
                ensureSpace(16);
                // section bar — trade name, or job address when grouped by address
                fill([241, 244, 250]); doc.roundedRect(M, y, contentW, 8.5, 1.6, 1.6, 'F');
                fill(NAVY); doc.rect(M, y, 1.8, 8.5, 'F');
                doc.setFont('helvetica', 'bold'); doc.setFontSize(11); ink(NAVY);
                doc.text(doc.splitTextToSize(groupLabel(gk), contentW - 30)[0], M + 5, y + 5.7);
                doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); ink(MUTE);
                doc.text(gdefects.length + (gdefects.length === 1 ? ' item' : ' items'), pageW - M - 4, y + 5.7, { align: 'right' });
                y += 12;

                // Photos up front — needed to measure card heights before drawing.
                const imgsByIdx = [];
                for (const d of gdefects) { imgsByIdx.push(await photosFor(d)); if (d.bookingAt) bookingDates.add(fmtDateNice(d.bookingAt)); }

                for (let i = 0; i < gdefects.length; i += 2) {
                    const lD = gdefects[i], rD = gdefects[i + 1];
                    const lImgs = imgsByIdx[i], rImgs = rD ? imgsByIdx[i + 1] : [];
                    const rowH = Math.max(measureCard(lD, lImgs), rD ? measureCard(rD, rImgs) : 0);
                    if (y + rowH > pageH - 18) { doc.addPage(); y = M + 4; }
                    drawCard(M, y, rowH, lD, ++itemNo, lImgs);
                    if (rD) drawCard(M + colW + gap, y, rowH, rD, ++itemNo, rImgs);
                    y += rowH + gap;
                }
                y += 3;
            }

            // ── booking confirmation note ────────────────────────────
            if (bookingDates.size) {
                ensureSpace(14);
                const note = bookingDates.size === 1
                    ? 'Please confirm booking date of ' + [...bookingDates][0] + '.'
                    : 'Please confirm the booking dates noted above.';
                fill([255, 247, 224]); stroke([240, 196, 120]);
                doc.roundedRect(M, y, contentW, 10, 2, 2, 'FD');
                doc.setFont('helvetica', 'bold'); doc.setFontSize(10); ink([146, 100, 20]);
                doc.text(note, M + 5, y + 6.4);
                y += 14;
            }

            // ── footer on every page ─────────────────────────────────
            const pages = doc.internal.getNumberOfPages();
            for (let p = 1; p <= pages; p++) {
                doc.setPage(p);
                stroke(LINE); doc.line(M, pageH - 12, pageW - M, pageH - 12);
                doc.setFont('helvetica', 'normal'); doc.setFontSize(8); ink(MUTE);
                doc.text('SMV Defect Manager  ·  Defect Report', M, pageH - 7.5);
                doc.text('Page ' + p + ' of ' + pages, pageW - M, pageH - 7.5, { align: 'right' });
            }

            // asFile: hand the PDF back as a File (for attaching to an email)
            // instead of triggering a download.
            const fname = buildReportFilename(opts);
            if (opts.asFile) return new File([doc.output('blob')], fname, { type: 'application/pdf' });
            const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
                || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            // CONFIRMED on-device: iOS attaches the PDF's blob: object URL to the
            // message body on EVERY file share — even files-only — for both Mail
            // and Messages. It's an Apple Web-Share bug with no web-side fix. So
            // we never share the File. Host it at an https URL and share THAT as a
            // proper link (via the `url` field, so iOS renders a tidy tappable
            // card, not a raw URL). Desktop still downloads.
            if (iOS) {
                let url = null;
                try { if (window.CloudShare) url = await window.CloudShare.uploadTempPdf(new File([doc.output('blob')], fname, { type: 'application/pdf' }), fname); }
                catch (e) { console.error('report link upload', e); }
                if (url && navigator.share) {
                    try { await navigator.share({ title: 'Defects Report', url }); return; }
                    catch (e) { if (e && e.name === 'AbortError') return; /* fall through */ }
                }
                if (url) { window.location.href = url; return; }   // no share API → open the hosted PDF
                // Hosting unavailable (offline) — fall through to a plain save.
            }
            doc.save(fname);
        }

        // One-tap PDF for the screen you're on — per job (address) or per supplier (contractor)
        // Context PDF (the 📑 icon on an address or contractor). Opens a small
        // dialog: pick statuses (default Open) and trades (all ticked by
        // default), then generate a PDF scoped to that address/contractor.
        // 'trade' or 'contractor' — which filter list drives the context report.
        let _crMode = 'trade';
        // Distinct job addresses where THIS contractor currently has open or
        // pending (non-completed) defects — i.e. the jobs they're actively
        // nominated on right now. Powers the report builder's per-job picker so
        // a report can be scoped to specific jobs for one contractor.
        // Jobs a contractor — or a whole SET of contractors, which is how a trade
        // report is scoped — has open/pending work on. (Spiro 2026-08-02)
        function contractorJobAddresses(contractorId, contractorIds) {
            const want = (contractorIds && contractorIds.length)
                ? new Set(contractorIds)
                : (contractorId != null ? new Set([contractorId]) : null);
            const seen = new Map();
            (db.data.defects || []).forEach(d => {
                if (want && !want.has(d.contractorId)) return;
                const s = defectStatusOf(d);
                if (s !== 'open' && s !== 'pending') return;
                if (!seen.has(d.addressId)) {
                    const a = db.getAddress(d.addressId);
                    if (!a) return;
                    seen.set(d.addressId, { id: d.addressId, label: formatAddress(a), count: 0 });
                }
                const rec = seen.get(d.addressId);
                if (rec) rec.count++;
            });
            return Array.from(seen.values()).sort((a, b) => a.label.localeCompare(b.label));
        }
        function crToggleJobs(on) {
            document.querySelectorAll('.cr-job').forEach(cb => { cb.checked = on; });
        }
        function crFilterJobs(q) {
            q = (q || '').toLowerCase().trim();
            document.querySelectorAll('#cr-job-list .rb-opt').forEach(el => {
                el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        }
        function generateContextReport(ctx) {
            ctx = ctx || {};
            // A TRADE report (and the multi-contractor screen) arrives as a SET of
            // contractors — the very same list the screen behind it is showing —
            // rather than a single one. Scoping the PDF by that list, not by trade
            // links, is what guarantees the report contains exactly what the
            // supervisor is looking at: a sub with no trade link is on screen but
            // would be dropped by a tradeIds filter. (Spiro 2026-08-02)
            const ctxContractorIds = (ctx.contractorIds || []).filter(id => id != null);
            _crMode = ctxContractorIds.length ? 'contractor' : 'trade';
            const tradeRows = db.data.trades.slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''))
                .map(t => `<label class="rb-opt" style="display:flex;align-items:center;gap:8px;padding:5px 6px;font-size:14px;cursor:pointer"><input type="checkbox" class="cr-trade" value="${t.id}" checked style="width:auto"> ${t.name}</label>`).join('');
            // A trade report pre-ticks the trade's own subs, so "generate" straight
            // away gives you the screen you came from. Trade placeholders are kept
            // in the list here (they're excluded from the general picker) because
            // on a trade screen they ARE the thing being reported on.
            const preTicked = new Set(ctxContractorIds);
            const contrRows = db.getContractors()
                .filter(c => !c.isTradePlaceholder || preTicked.has(c.id))
                .slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''))
                .map(c => `<label class="rb-opt" style="display:flex;align-items:center;gap:8px;padding:5px 6px;font-size:14px;cursor:pointer"><input type="checkbox" class="cr-contr" value="${c.id}" ${preTicked.has(c.id) ? 'checked' : ''} style="width:auto"> ${c.name}${c.trades && c.trades !== 'No Trade Assigned' ? ' — ' + c.trades.split(',')[0] : ''}</label>`).join('');
            const ctxLabel = ctx.addressId ? formatAddress(db.getAddress(ctx.addressId))
                : (ctx.contractorId ? ((db.getContractor(ctx.contractorId) || {}).name || '')
                : (ctx.label || (ctxContractorIds.length ? ctxContractorIds.length + ' contractors' : 'All defects')));
            // Per-job picker: whenever the report is scoped to a contractor or a
            // set of them. Lists every job they have open/pending defects on, all
            // ticked by default, so the report can be narrowed to chosen jobs.
            const jobs = (ctx.contractorId || ctxContractorIds.length)
                ? contractorJobAddresses(ctx.contractorId, ctxContractorIds) : [];
            const jobRows = jobs.map(j =>
                `<label class="rb-opt" style="display:flex;align-items:center;gap:8px;padding:5px 6px;font-size:14px;cursor:pointer"><input type="checkbox" class="cr-job" value="${j.id}" checked style="width:auto"> <span style="flex:1">${j.label}</span><span style="color:var(--text-secondary,#888);font-size:12px">${j.count}</span></label>`).join('');
            const jobField = jobs.length ? `
                    <div class="imp-field">
                        <label>Jobs to include</label>
                        <div style="font-size:12px;color:var(--text-secondary,#888);margin-bottom:4px">Only jobs ${ctxLabel} is on with open/pending defects. Untick to leave a job out.</div>
                        ${jobs.length > 6 ? `<input type="text" id="cr-job-search" placeholder="Search jobs…" oninput="crFilterJobs(this.value)" style="width:100%;margin-bottom:4px">` : ''}
                        <div style="display:flex;gap:10px;margin-bottom:4px">
                            <button type="button" class="imp-btn" style="padding:4px 10px;font-size:12px" onclick="crToggleJobs(true)">Select all</button>
                            <button type="button" class="imp-btn" style="padding:4px 10px;font-size:12px" onclick="crToggleJobs(false)">None</button>
                        </div>
                        <div id="cr-job-list" style="max-height:180px;overflow:auto;border:1px solid var(--brd,#ccc);border-radius:10px;padding:4px">${jobRows || '<div style="padding:8px;color:var(--text-secondary,#888);font-size:13px">No open or pending jobs for this contractor.</div>'}</div>
                    </div>` : '';
            const onSty = 'background:var(--blue,#2563eb);color:#fff';
            const offSty = 'background:transparent;color:var(--text-secondary,#888)';
            impOverlay(`
                <div id="imp-head"><strong>📑 Generate Report</strong><button id="imp-close">✕</button></div>
                <div id="imp-body">
                    <div class="imp-field"><label>For</label><div style="font-size:15px;font-weight:600">${ctxLabel}</div></div>
                    ${jobField}
                    <div class="imp-field"><label>Statuses to include</label>
                        <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:14px;padding:4px 0">
                            <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="cr-st-open" checked style="width:auto"> Open</label>
                            <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="cr-st-pending" checked style="width:auto"> Pending</label>
                            <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="cr-st-completed" style="width:auto"> Completed</label>
                        </div></div>
                    <div class="imp-field">
                        <label style="display:flex;align-items:center;justify-content:space-between;gap:8px">
                            <span>Filter by</span>
                            <span style="display:inline-flex;border:1px solid var(--border-color,#ccc);border-radius:8px;overflow:hidden;font-size:12px">
                                <button type="button" id="cr-mode-trade" onclick="crSetFilterMode('trade')" style="border:none;padding:5px 12px;cursor:pointer;font-weight:600;${onSty}">Trade</button>
                                <button type="button" id="cr-mode-contr" onclick="crSetFilterMode('contractor')" style="border:none;padding:5px 12px;cursor:pointer;font-weight:600;${offSty}">Contractor</button>
                            </span>
                        </label>
                        <div id="cr-trade-wrap">
                            <input type="text" id="cr-trade-search" placeholder="Search trades…" oninput="crFilterList('trade', this.value)" style="width:100%;margin-bottom:4px">
                            <div style="display:flex;gap:10px;margin-bottom:4px">
                                <button type="button" class="imp-btn" style="padding:4px 10px;font-size:12px" onclick="crToggleList('trade', true)">Select all</button>
                                <button type="button" class="imp-btn" style="padding:4px 10px;font-size:12px" onclick="crToggleList('trade', false)">None</button>
                            </div>
                            <div id="cr-trade-list" style="max-height:150px;overflow:auto;border:1px solid var(--brd,#ccc);border-radius:10px;padding:4px">${tradeRows}</div>
                        </div>
                        <div id="cr-contr-wrap" style="display:none">
                            <input type="text" id="cr-contr-search" placeholder="Search contractors…" oninput="crFilterList('contr', this.value)" style="width:100%;margin-bottom:4px">
                            <div style="display:flex;gap:10px;margin-bottom:4px">
                                <button type="button" class="imp-btn" style="padding:4px 10px;font-size:12px" onclick="crToggleList('contr', true)">Select all</button>
                                <button type="button" class="imp-btn" style="padding:4px 10px;font-size:12px" onclick="crToggleList('contr', false)">None</button>
                            </div>
                            <div style="font-size:12px;color:var(--text-secondary,#888);margin-bottom:4px">Tick the contractor(s) to include — none ticked = all.</div>
                            <div id="cr-contr-list" style="max-height:150px;overflow:auto;border:1px solid var(--brd,#ccc);border-radius:10px;padding:4px">${contrRows}</div>
                        </div>
                    </div>
                    <label style="display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0 4px"><input type="checkbox" id="cr-photos" checked style="width:auto"> Include photos</label>
                    <button class="imp-btn" id="cr-go">Generate PDF →</button>
                </div>`);
            // The markup above hard-codes Trade as the selected tab. Setting
            // _crMode alone changes the variable, not the screen — push it into
            // the DOM so a trade report actually OPENS on its pre-ticked subs.
            crSetFilterMode(_crMode);
            document.getElementById('cr-go').onclick = () => runContextReport(ctx);
        }
        function crSetFilterMode(mode) {
            _crMode = mode;
            const tw = document.getElementById('cr-trade-wrap'), cw = document.getElementById('cr-contr-wrap');
            if (tw) tw.style.display = mode === 'trade' ? '' : 'none';
            if (cw) cw.style.display = mode === 'contractor' ? '' : 'none';
            const on = 'background:var(--blue,#2563eb);color:#fff', off = 'background:transparent;color:var(--text-secondary,#888)';
            const tb = document.getElementById('cr-mode-trade'), cb = document.getElementById('cr-mode-contr');
            const base = 'border:none;padding:5px 12px;cursor:pointer;font-weight:600;';
            if (tb) tb.style.cssText = base + (mode === 'trade' ? on : off);
            if (cb) cb.style.cssText = base + (mode === 'contractor' ? on : off);
        }
        function crFilterList(which, q) {
            q = (q || '').toLowerCase().trim();
            document.querySelectorAll('#cr-' + which + '-list .rb-opt').forEach(el => {
                el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        }
        function crToggleList(which, on) {
            document.querySelectorAll(which === 'trade' ? '.cr-trade' : '.cr-contr').forEach(cb => { cb.checked = on; });
        }
        async function runContextReport(ctx) {
            const statuses = ['open', 'pending', 'completed'].filter(s => document.getElementById('cr-st-' + s).checked);
            if (!statuses.length) { showToast('Tick at least one status', true); return; }
            const ctxContractorIds = (ctx.contractorIds || []).filter(id => id != null);
            const o = {
                addressIds: ctx.addressId ? [ctx.addressId] : [],
                contractorIds: ctx.contractorId ? [ctx.contractorId] : ctxContractorIds.slice(),
                statuses, tradeIds: null,
                photos: document.getElementById('cr-photos').checked,
                groupBy: 'address',   // job-first layout: each address is a header
                // A trade report is scoped by the trade's SET of subs, so the
                // trade's own name would otherwise be lost by the time the file
                // is named. Carried for buildReportFilename only.
                tradeName: ctx.tradeName || '',
            };
            // Per-job scope (contractor reports only): honour the ticked jobs.
            // All ticked → whole-contractor report (o.addressIds stays empty).
            // Some unticked → scope to just the ticked jobs. None ticked → block.
            const jobBoxes = document.querySelectorAll('.cr-job');
            if (jobBoxes.length) {
                const selJobs = Array.from(document.querySelectorAll('.cr-job:checked')).map(x => parseInt(x.value)).filter(Boolean);
                if (!selJobs.length) { showToast('Tick at least one job', true); return; }
                if (selJobs.length < jobBoxes.length) o.addressIds = selJobs;
            }
            if (_crMode === 'contractor') {
                // Explicit contractor pick — always reliable (unlike trade links,
                // which are blank on many subs and used to silently drop them).
                const selC = Array.from(document.querySelectorAll('.cr-contr:checked')).map(x => parseInt(x.value)).filter(Boolean);
                if (selC.length) o.contractorIds = selC;
            } else {
                const allTrades = db.data.trades.length;
                const selT = Array.from(document.querySelectorAll('.cr-trade:checked')).map(x => parseInt(x.value)).filter(Boolean);
                // All (or none) ticked = no trade filter, so defects without a
                // matching trade aren't silently dropped. Partial = filter to it.
                o.tradeIds = (selT.length && selT.length < allTrades) ? selT : null;
            }
            let list = reportFilteredDefects(o);
            // NOTHING LEAVES A REPORT SILENTLY (Spiro 2026-08-04).
            //
            // A trade filter resolves a defect's trade through its CONTRACTOR'S
            // trade links (dm_contractor_trades). Plenty of real subs have none —
            // the sync hands them tradeIds: [] and trades: 'No Trade Assigned' —
            // and a defect with no supplier at all has nothing to resolve either.
            // Both were dropped without a word: the PDF simply came out short, or
            // the dialog claimed "No defects match those filters" about defects
            // that plainly did match. That is how a waterhammer item raised
            // against COSTAS PLUMBING went missing from a Plumber report.
            //
            // The filter itself is unchanged — a report asked for Plumber should
            // not quietly fill up with everyone else's work. What changes is that
            // the supervisor is told what is being left out, by supplier, and
            // gets to decide.
            if (o.tradeIds && o.tradeIds.length) {
                const inScope = reportFilteredDefects({ ...o, tradeIds: null });
                const kept = new Set(list.map(d => d.id));
                // Only the ones the filter could say NOTHING about: no supplier at
                // all, or a supplier carrying no trade links. A sub linked to a
                // DIFFERENT trade was excluded on purpose and must stay out —
                // otherwise a Plumber report quietly fills up with the painter's
                // work, which is a worse bug than the one being fixed.
                const missed = inScope.filter(d => {
                    if (kept.has(d.id)) return false;
                    const c = db.getContractor(d.contractorId);
                    if (!c) return true;
                    return !c.isTradePlaceholder && !(c.tradeIds || []).length;
                });
                if (missed.length) {
                    const who = [...new Set(missed.map(d =>
                        (db.getContractor(d.contractorId) || {}).name || 'Unassigned'))].sort();
                    const ok = confirm(
                        `${missed.length} defect(s) would be left out of this report.\n\n` +
                        `These suppliers have no trade assigned, so they match no trade:\n` +
                        who.map(n => '• ' + n).join('\n') +
                        `\n\nInclude their defects anyway?`);
                    if (ok) list = list.concat(missed);
                }
            }
            if (!list.length) { showToast('No defects match those filters', true); return; }
            impSetBusy('Generating PDF… (' + list.length + ' defect' + (list.length > 1 ? 's' : '') + ')' + (o.photos ? ' with photos' : ''));
            try { await generateDefectPDF(list, o); impClose(); showToast('PDF report ready'); }
            catch (e) { console.error(e); impOverlayMessage('Could not generate PDF: ' + (e.message || e)); }
        }

        // True while the user is actively entering data we must NOT destroy with
        // a background re-render or an auto-update reload. Covers: a focused text
        // field, the add-defects forms, and any open overlay/modal (e.g. the
        // report import + defect-entry overlay). Exposed for cloud-sync.js too.
        function isBusyEditing() {
            try {
                const ae = document.activeElement;
                if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) return true;
                const v = (typeof state !== 'undefined') && state ? state.currentView : '';
                if (v === 'add-defects-address' || v === 'add-defects-contractor') return true;
                if (document.querySelector('#imp-ov, .modal.active, #cs-overlay')) return true;
            } catch (e) {}
            return false;
        }
        window.isBusyEditing = isBusyEditing;

        // Build stamp — keep in step with the sw.js CACHE string on every deploy.
        const APP_VERSION = '2026-08-15i';

        // Floating "refresh / get latest version" button — a manual escape hatch
        // to force the newest deploy (cache-busts the URL) if the auto-update
        // hasn't kicked in yet.
        function mountRefreshButton() {
            if (document.getElementById('app-refresh')) return;
            const b = document.createElement('button');
            b.id = 'app-refresh';
            b.innerHTML = '↻';
            b.title = 'Refresh — load the latest version';
            b.setAttribute('aria-label', 'Refresh app');
            b.onclick = async function () {
                // Pull-WINS recovery for a phone that's showing out-of-date items.
                // Crucially we do NOT push the local copy first — a stale push can
                // revert a completion done in the CH Tracker / on another phone.
                // We just drop the local sync baseline so the reload does a clean
                // pull and ADOPTS the cloud truth. Unsynced local-only edits are
                // replaced by the server's version, so confirm before doing it.
                if (!confirm('Reload the latest defects from the server?\n\nUse this if items look out of date or keep reappearing. Any changes on THIS phone that haven’t uploaded yet will be replaced by the server’s version.')) return;
                b.disabled = true; b.style.opacity = '0.5';
                try {
                    localStorage.setItem('cs_dirty', '0');
                    localStorage.removeItem('cs_snapshot');
                    localStorage.removeItem('cs_idmap');
                } catch (e) {}
                // Force the NEWEST code, not just the newest data. The service
                // worker serves a cached shell within 3.5s in poor reception /
                // Low-Power-Mode, so a plain reload can keep booting old code.
                // Nuke every cache + unregister the SW so the reload fetches a
                // fresh index.html straight from the network.
                try { if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } } catch (e) {}
                try { if (navigator.serviceWorker) { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.unregister())); } } catch (e) {}
                const u = new URL(window.location.href);
                u.searchParams.set('_r', Date.now().toString());
                window.location.replace(u.toString());
            };
            b.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:99999;width:42px;height:42px;border-radius:50%;border:1px solid var(--brd,#bbb);background:var(--sur,#fff);color:var(--t1,#111);font-size:20px;line-height:1;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;';
            document.body.appendChild(b);
            // Tiny build stamp under the refresh button so it's obvious at a
            // glance which version this phone is actually running — turns "is it
            // updated?" into a fact you can read.
            const ver = document.createElement('div');
            ver.textContent = 'v' + APP_VERSION;
            ver.title = 'App version loaded on this device';
            ver.style.cssText = 'position:fixed;left:8px;bottom:56px;z-index:99999;font-size:9px;color:var(--t3,#999);background:var(--sur,#fff);opacity:.75;padding:1px 4px;border-radius:4px;pointer-events:none;font-family:monospace;';
            document.body.appendChild(ver);
        }

        // Initialize app
        loadTheme();
        loadClubTheme();
        loadDesign();
        render();
        mountRefreshButton();
    </script>

    <!-- Service worker: precaches the app shell so the app OPENS with no signal,
         and auto-applies new versions (reload once when a new worker takes over). -->
    <script>
      if ('serviceWorker' in navigator) {
        let swReloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (swReloaded) return;
          // NEVER reload out from under someone entering data — that loses their
          // input. Wait until they're idle (not typing, not in a form/overlay),
          // then apply the update. Falls back to the next launch / manual ↻.
          const applyWhenIdle = () => {
            if (swReloaded) return;
            if (window.isBusyEditing && window.isBusyEditing()) { setTimeout(applyWhenIdle, 4000); return; }
            swReloaded = true;
            window.location.reload();
          };
          applyWhenIdle();
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').then((reg) => {
            reg.update();
            // Re-check for a new version whenever the app is brought back to front.
            document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); });
          }).catch((e) => console.warn('[SW] register failed', e));
        });
      }
    </script>
