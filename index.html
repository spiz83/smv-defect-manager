                        <div class="empty-state">
                            <div class="empty-state-icon">🛒</div>
                            <p>Nothing to order${scoped ? ' for this job' : ''} yet.<br>
                            Tap a defect to open it, then tap 🛒 to add the part or materials here.</p>
                        </div>
                    ` : `
                        <div class="shop-count">${total} item${total === 1 ? '' : 's'} to pick up${groups.length > 1 ? ` · ${groups.length} jobs` : ''}</div>
                        ${groups.map(g => `
                            <div class="contractor-section">
                                <div class="contractor-name shop-addr" onclick="viewDefectsForAddress(${g.address.id})">
                                    <span class="supplier-name"><span class="supplier-name-txt">${formatAddress(g.address)}</span><span class="supplier-chev">›</span></span>
                                    <span class="shop-addr-n">${g.defects.length}</span>
                                </div>
                                ${g.defects.map(row).join('')}
                            </div>
                        `).join('')}

        }

        // Same shape as the on-screen list, for pasting into a message or a note.
        function copyShoppingList(addressId) {
            const items = shoppingItems(addressId == null ? null : addressId);
            const visible = new Set(scopeAddressesToUser(db.getAddresses() || []).map(a => a.id));
            const list = addressId != null ? items : items.filter(d => visible.has(d.addressId));
            if (!list.length) { showToast('Nothing on the shopping list', true); return; }
            const byAddress = new Map();
            for (const d of list) {
                const arr = byAddress.get(d.addressId);
                if (arr) arr.push(d); else byAddress.set(d.addressId, [d]);
            }
            const lines = ['SHOPPING LIST', ''];
            for (const [aid, defects] of byAddress) {
                lines.push(formatAddress(db.getAddress(aid)));
                defects.forEach((d, i) => {
                    const s = orderStatusOf(d) || 'needed';
                    const c = d.contractorId != null ? db.getContractor(d.contractorId) : null;
                    const tail = [d.location || '', (c && c.name) || ''].filter(Boolean).join(' · ');
                    lines.push('  ' + (i + 1) + '. [' + ORDER_META[s].label + '] '
                        + splitReportRef(d.description).body + (tail ? '  (' + tail + ')' : ''));
                });
                lines.push('');
            }
            writeToClipboard(lines.join('\n').trim(),
                '📋 ' + list.length + ' item' + (list.length === 1 ? '' : 's') + ' copied');

        // One card. Photo slot is left empty and filled in after render by
        // fillPreviewPhotos() — a card must never wait on the network to appear.
        function previewCard(defect) {
            const st = defectStatusOf(defect);
            const done = st === 'completed';
            const ref = splitReportRef(defect.description);
            const body = ref.body;
            // The card shows "BPI #7 · p.3", not the saved "BPI #7 (p.3)".
            const refLbl = ref.label.replace(/\s*\(p\.(\d+)\)/, ' · p.$1');

                <span class="pv-tab status-${st}"></span>

                    <div class="pv-desc">${_pvEsc(body)}</div>
                    ${n > 0 ? `<div class="pv-photo" data-pvphoto="${defect.id}" onclick="event.stopPropagation(); CloudPhotos.openGallery(${defect.id})">
                        <div class="pv-ph-wait">loading photo…</div>

                    <div class="pv-act">

                            <button class="pv-mini" onclick="event.stopPropagation(); openLocationPicker(${defect.id})" title="Location">📍</button>

        // 🛒 on a preview card. Same flag, same toggle as the list row — Preview
        // is a different way of looking at the same defects, so anything you can
        // do to one you should be able to do to the other. Walking the house is
        // exactly when you notice a part is needed, so this is arguably the more
        // important of the two places. (Spiro 2026-08-02)
        function pvOrderBtn(defect) {
            const s = orderStatusOf(defect);
            const title = s
                ? ORDER_META[s].label + ' — tap to take it off the shopping list'
                : 'Order a part or materials for this item — puts it on the job shopping list';
            return `<button class="pv-mini pv-order ${s ? 'on' : ''}" title="${title}"
                        onclick="event.stopPropagation(); pvToggleOrder(${defect.id})">${s ? ORDER_META[s].icon : '🛒'}</button>`;
        }
        // Updates the card IN PLACE rather than re-rendering, for the same reason
        // pvToggleDone does: a full render throws you back to the top of the list,
        // and you're half-way down a job with a phone in one hand.
        function pvToggleOrder(id) {
            const d = db.data.defects.find(x => x.id === id); if (!d) return;
            const was = orderStatusOf(d);
            db.setDefectOrder(id, was ? '' : 'needed');
            flushStatus();
            const card = document.querySelector(`.pv-card[data-pv="${id}"]`);
            const btn = card && card.querySelector('.pv-order');
            if (btn) {
                const s = orderStatusOf(d);
                btn.classList.toggle('on', !!s);
                btn.textContent = s ? ORDER_META[s].icon : '🛒';
                btn.title = s
                    ? ORDER_META[s].label + ' — tap to take it off the shopping list'
                    : 'Order a part or materials for this item — puts it on the job shopping list';
            }
            pvUpdateCartBadge();
            showToast(was ? 'Taken off the shopping list' : '🛒 Added to the shopping list');
        }
        // The toolbar count has to keep up without a re-render.
        function pvUpdateCartBadge() {
            const btn = document.querySelector('.toolbar .cart-btn');
            if (!btn) return;
            const aid = state.filters && state.filters.addressId;
            const n = shoppingItems(aid == null ? null : aid).length;
            const old = btn.querySelector('.cart-n');
            if (old) old.remove();
            if (n) {
                const s = document.createElement('span');
                s.className = 'cart-n';
                s.textContent = n > 99 ? '99+' : String(n);
                btn.appendChild(s);
            }
        }
        function _pvEsc(x) { return String(x == null ? '' : x).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m])); }
        // Tap-to-complete. Deliberately does NOT re-render: the card stays put,
        // greyed, so a mis-tap is one tap back and you keep your scroll position
        // half-way down a job. It drops out of the list on the next load, the
        // same way the tracker's row does.
        function pvToggleDone(id) {
            const d = db.data.defects.find(x => x.id === id); if (!d) return;
            const next = defectStatusOf(d) === 'completed' ? 'open' : 'completed';
            // Confirm before COMPLETING, the same as the status tab in list mode
            // (Spiro 2026-08-02). Preview is walked one-handed with a phone at
            // arm's length and the button is the biggest target on the card, so
            // it's the easiest thing in the app to hit by accident — and the item
            // then drops off the list on the next render, which reads as "it
            // vanished". Un-completing is the undo and needs no prompt.
            if (next === 'completed' &&
                !confirm('Mark this item as completed? It will be removed from the active list.')) return;
            db.setDefectStatus(id, next);
            flushStatus();
            const card = document.querySelector(`.pv-card[data-pv="${id}"]`);
            if (card) {
                card.classList.toggle('pv-done', next === 'completed');
                const tab = card.querySelector('.pv-tab');
                if (tab) tab.className = 'pv-tab status-' + next;
                const btn = card.querySelector('.pv-tick');
                if (btn) {
                    btn.className = 'pv-tick ' + (next === 'completed' ? 'pv-t-done' : 'pv-t-open');
                    btn.textContent = next === 'completed' ? '✓ Done' : '◯ Mark done';
                }
            }
            pvUpdateCounts();
        }
        function pvUpdateCounts() {
            document.querySelectorAll('[data-pvcount]').forEach(el => {
                const ids = String(el.getAttribute('data-pvcount') || '').split(',').filter(Boolean).map(Number);
                const left = ids.filter(id => {
                    const d = db.data.defects.find(x => x.id === id);
                    return d && defectStatusOf(d) !== 'completed';
                }).length;
                el.textContent = left + ' of ' + ids.length + ' outstanding';
            });
        }
        // Fill every visible card's photo in ONE batch, after the list is on
        // screen. Cards render instantly; photos arrive when they arrive.
        // ===========================================================================
        //  PREVIEW PHOTOS — all of them, paged on the card (Spiro 2026-08-02)
        //  One card used to show ONE photo (the report shot) and there was no way
        //  to add another without leaving preview. An item routinely needs three
        //  or four: the defect, the context, the fix. So the card now pages
        //  through every photo the defect has, says how many there are, and can
        //  take a new one from the camera or the gallery without leaving.
        // ===========================================================================
        let _pvPhotos = {};        // legacyId -> [url]
        let _pvBlobUrls = [];      // object URLs for not-yet-uploaded photos
        function _pvRevokeBlobUrls() {
            _pvBlobUrls.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) {} });
            _pvBlobUrls = [];
        }
        // Photos still on THIS phone, not yet uploaded. Appended last (they're the
        // newest), so a photo taken in a black spot is on the card immediately
        // instead of looking like it didn't save.
        async function _pvPendingUrls(id) {
            const cp = window.CloudPhotos;
            if (!cp || !cp.pendingPhotos || !cp.pendingCount || !cp.pendingCount(id)) return [];
            try {
                const items = await cp.pendingPhotos(id);
                return (items || []).map(it => {
                    const u = URL.createObjectURL(it.blob);
                    _pvBlobUrls.push(u);
                    return u;
                });
            } catch (e) { return []; }
        }
        async function fillPreviewPhotos() {
            if (!previewMode()) return;
            const slots = [...document.querySelectorAll('[data-pvphoto]')];
            const cp = window.CloudPhotos;
            if (!slots.length || !cp || !(cp.thumbsAll || cp.thumbs)) return;
            const ids = slots.map(el => Number(el.getAttribute('data-pvphoto')));
            _pvRevokeBlobUrls();
            const cloud = cp.thumbsAll
                ? await cp.thumbsAll(ids)
                // Older cached cloud-sync.js: one url per defect. Still works.
                : Object.fromEntries(Object.entries(await cp.thumbs(ids)).map(([k, v]) => [k, [v]]));
            for (const el of slots) {
                const id = Number(el.getAttribute('data-pvphoto'));
                _pvPhotos[id] = (cloud[id] || []).concat(await _pvPendingUrls(id));
                pvRenderPhoto(el, id, 0);
            }
        }
        // Draw ONE photo plus its controls. Index is kept on the slot, so paging
        // never touches the rest of the card or the scroll position.
        function pvRenderPhoto(slot, id, index) {
            const urls = _pvPhotos[id] || [];
            if (!urls.length) {
                slot.innerHTML = '<div class="pv-ph-wait">photo unavailable offline</div>';
                return;
            }
            const i = Math.max(0, Math.min(index, urls.length - 1));
            slot.setAttribute('data-pvindex', String(i));
            const many = urls.length > 1;
            slot.innerHTML =
                `<img src="${urls[i]}" loading="lazy" alt="defect photo">`
                + (many ? `<button class="pv-nav pv-prev" aria-label="Previous photo"
                        onclick="event.stopPropagation(); pvStepPhoto(${id}, -1)">‹</button>
                    <button class="pv-nav pv-next" aria-label="Next photo"
                        onclick="event.stopPropagation(); pvStepPhoto(${id}, 1)">›</button>
                    <span class="pv-pcount">${i + 1}/${urls.length}</span>` : '');
        }
        // Wraps at both ends — with three or four photos, hunting for the arrow
        // that isn't greyed out is worse than just looping.
        function pvStepPhoto(id, delta) {
            const slot = document.querySelector(`[data-pvphoto="${id}"]`);
            const urls = _pvPhotos[id] || [];
            if (!slot || urls.length < 2) return;
            const cur = Number(slot.getAttribute('data-pvindex') || 0);
            pvRenderPhoto(slot, id, (cur + delta + urls.length) % urls.length);
        }
        // 📷 on the card. accept="image/*" is what gives iOS the Camera / Photo
        // Library / Files sheet, so "take one" and "pick one" are the same button.
        function pvPhotoBtn(defect) {
            return `<label class="pv-mini pv-addphoto" title="Add a photo — camera or gallery">📷<input
                type="file" accept="image/*" multiple onchange="pvAddPhoto(event, ${defect.id})"
                style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0"></label>`;
        }
        async function pvAddPhoto(ev, id) {
            const files = Array.from(ev.target.files || []);
            ev.target.value = '';                       // allow re-picking the same file
            if (!files.length) return;
            const cp = window.CloudPhotos;
            if (!cp || !cp.savePhoto) { showToast('Log in to use photos', true); return; }
            // Mark-up editor for a single photo, same as the gallery; a multi-pick
            // uploads as-is because editing each one is tedious.
            for (const f of files) {
                let img = f;
                if (files.length === 1 && cp.editPhoto) {
                    img = await cp.editPhoto(f);
                    if (!img) return;                   // cancelled in the editor
                }
                await cp.savePhoto(id, img);
            }
            showToast(files.length === 1 ? '📸 Photo added' : `📸 ${files.length} photos added`);
            await pvRefreshPhotos(id);
        }
        // Re-read ONE defect's photos and redraw its card in place — a full
        // render would throw you back to the top of the job.
        async function pvRefreshPhotos(id) {
            const cp = window.CloudPhotos;
            if (cp && cp.refreshCounts) cp.refreshCounts();
            let slot = document.querySelector(`[data-pvphoto="${id}"]`);
            if (!slot) {
                // The card had no photo, so it was rendered without a slot. Give
                // it one rather than re-rendering the whole list.
                const card = document.querySelector(`.pv-card[data-pv="${id}"]`);
                const act = card && card.querySelector('.pv-act');
                if (!act) { render(); return; }
                slot = document.createElement('div');
                slot.className = 'pv-photo';
                slot.setAttribute('data-pvphoto', String(id));
                slot.onclick = (e) => { e.stopPropagation(); if (window.CloudPhotos) window.CloudPhotos.openGallery(id); };
                act.parentNode.insertBefore(slot, act);
            }
            const cloud = (cp && cp.thumbsAll) ? await cp.thumbsAll([id]) : {};
            _pvPhotos[id] = (cloud[id] || []).concat(await _pvPendingUrls(id));
            // Land on the photo just added, not back at the first one.
            pvRenderPhoto(slot, id, Math.max(0, _pvPhotos[id].length - 1));
        }

        // Unified function to generate defect text for clipboard/export/email

            } else if (state.currentView === 'view-defects-trade' && state.filters) {

                const { tradeName, contractorIds } = state.filters;
                const defects = db.getDefects().filter(d => contractorIds.includes(d.contractorId));
                
                // Group by address first, then by contractor
                const byAddress = {};
                defects.forEach(d => {
                    const address = db.getAddress(d.addressId);
                    const contractor = db.getContractor(d.contractorId);
                    if (!address || !contractor) return;
                    
                    const addressKey = formatAddress(address);
                    if (!byAddress[addressKey]) {

                    Object.keys(byAddress[addressKey].contractors).sort().forEach(contractorName => {
                        const ds = byAddress[addressKey].contractors[contractorName];
                        const bk = ds[0] ? db.getContractorBooking(ds[0].contractorId, ds[0].addressId) : '';
                        if (bk) bookingDates.add(fmtDateNice(bk));
                        textContent += `\n${contractorName}${bk ? '  —  Attend: ' + fmtDateNice(bk) : ''}\n`;
                        ds.forEach(defect => {
                            textContent += `• ${formatDefectEmailLine(defect)}\n`;

            } else if (state.currentView === 'view-multiple-contractors' && state.filters.contractorIds) {
                // Multiple contractors view - group by address then contractor
                const defects = db.getDefects().filter(d => state.filters.contractorIds.includes(d.contractorId));
                
                const byAddress = {};
                defects.forEach(d => {
                    const address = db.getAddress(d.addressId);
                    const contractor = db.getContractor(d.contractorId);
                    if (!address || !contractor) return;
                    
                    const addressKey = formatAddress(address);
                    if (!byAddress[addressKey]) {
                        byAddress[addressKey] = { contractors: {} };
                    }
                    if (!byAddress[addressKey].contractors[contractor.name]) {
                        byAddress[addressKey].contractors[contractor.name] = [];
                    }
                    byAddress[addressKey].contractors[contractor.name].push(d);
                });
                
                Object.keys(byAddress).sort().forEach(addressKey => {
                    textContent += `${addressKey}\n`;
                    Object.keys(byAddress[addressKey].contractors).sort().forEach(contractorName => {
                        const ds = byAddress[addressKey].contractors[contractorName];
                        const bk = ds[0] ? db.getContractorBooking(ds[0].contractorId, ds[0].addressId) : '';
                        if (bk) bookingDates.add(fmtDateNice(bk));
                        textContent += `\n${contractorName}${bk ? '  —  Attend: ' + fmtDateNice(bk) : ''}\n`;
                        ds.forEach(defect => {
                            textContent += `• ${formatDefectEmailLine(defect)}\n`;

                    });
                    textContent += '\n';
                });
                
            } else {

            return textContent;
        }

        function copyDefectsToClipboard() {
            writeToClipboard(generateDefectText(), '📋 Copied to clipboard');
        }

        // One clipboard path for the whole app: the async API where it exists,
        // the textarea trick where it doesn't (older iOS, any non-secure
        // context). Both report the same way, so a supervisor always knows it
        // landed.
        function writeToClipboard(text, okMsg) {
            const done = () => showToast(okMsg || '📋 Copied to clipboard');
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done)
                    .catch(() => fallbackCopyToClipboard(text, okMsg));
            } else {
                fallbackCopyToClipboard(text, okMsg);
            }
        }

        // 📋 on an address row in the top search — the whole address on one
        // line, ready to paste into a text message or a job sheet:
        //   "Lot 1023, Coollegrean Road, Wollert - 306725"
        // The search row shows it split over two lines (street, then suburb ·
        // job number) because that is what reads fastest when picking a job,
        // but it is the joined-up form that gets sent to people. Retyping it
        // off the screen is how a job number ends up one digit out.
        //
        // formatAddress() is the string, unchanged — the same one on every
        // screen heading and every report — so what is pasted matches what the
        // supervisor is looking at. (Spiro 2026-08-12)
        function copyAddressToClipboard(addressId) {
            const a = db.getAddress(addressId);
            if (!a) { showToast('Address not found', true); return; }
            writeToClipboard(formatAddress(a), '📋 Address copied');
        }
        // The same 📋, on the job address in the frozen View Defects header —
        // where a supervisor already IS when someone asks which job they're on.
        // stopPropagation because the whole title is a tap target for Add
        // Defects; without it, copying the address opens the entry screen.
        function lotCopyBtn(addressId) {
            return `<button class="lot-copy" onclick="event.stopPropagation(); copyAddressToClipboard(${addressId})"
                        title="Copy this address" aria-label="Copy this address">📋</button>`;
        }

        // Copy ONE supplier's outstanding items for ONE job, formatted the same
        // way their email is (Spiro 2026-08-02). It belongs beside the other
        // three export routes, not only as a whole-screen copy — half of these
        // lists get sent as a text message, not an email.
        function copySupplierDefects(contractorId, addressId) {
            const c = db.getContractor(contractorId);
            const addr = formatAddress(db.getAddress(addressId));
            const items = (db.data.defects || []).filter(d =>
                d.addressId === addressId && d.contractorId === contractorId && !d.completed);
            if (!items.length) { showToast('No open items for this supplier', true); return; }
            const lines = [(c && c.name) || 'Unassigned', addr, ''];
            items.forEach((d, i) => lines.push((i + 1) + '. ' + formatDefectEmailLine(d)));
            const bk = db.getContractorBooking(contractorId, addressId);
            if (bk) lines.push('', 'Attending: ' + fmtDateNice(bk));
            writeToClipboard(lines.join('\n'),
                '📋 ' + items.length + ' item' + (items.length === 1 ? '' : 's') + ' copied');
        }

        function fallbackCopyToClipboard(text, okMsg) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showToast(okMsg || '📋 Copied to clipboard');
            } catch (err) {
                showToast('Failed to copy to clipboard', true);
            }
            
            document.body.removeChild(textarea);
        }

        // One defect → a text line ordered "BPI #N (p.P) — Location — item"
        // ("Item #N" for a private report). The saved description already starts
        // with that reference, so we peel it off, slot the location in after it,
        // then the item text. Typed defects carry no ref and fall back to
        // "Location — item".
        //
        // Despite the name this is now EVERY text rendering of a defect — the
        // supplier email, both Copy to Clipboard paths, the export, and the PDF
        // card. On screen defectLineHtml() builds the same order with the
        // location abbreviated to fit a phone row; here there is no width limit,
        // so the location is written out in full. Keeping one order across all
        // of them is the point: what the supervisor reads is what the trade
        // receives. (Spiro 2026-08-12)
        function formatDefectEmailLine(d) {
            const desc = (d.description || '').trim();
            const loc = (d.location || '').trim();
            const ref = splitReportRef(desc);
            return [ref.label, loc, ref.body.trim()].filter(Boolean).join(' — ');
        }
        // Email ONE supplier their open items (with photo links) for this address.
        async function emailSupplier(contractorId, addressId, asLink = false) {
            const c = db.getContractor(contractorId);
            const addr = formatAddress(db.getAddress(addressId));
            const defects = (db.data.defects || []).filter(d =>
                d.addressId === addressId && d.contractorId === contractorId && !d.completed);
            if (!defects.length) { showToast('No open items for this supplier', true); return; }
            if (!c) { showToast('Supplier not found', true); return; }
            // No email on file? Ask for it, validate, save so we don't ask again.
            if (!c.email) {
                const entered = prompt('No email on file for ' + c.name + '.\n\nEnter their email address — it will be saved for next time:', '');
                if (entered === null) return;                       // cancelled
                const email = entered.trim();
                if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showToast('That doesn’t look like a valid email', true); return; }
                c.email = email; db.save();                          // persists locally + syncs to cloud
                showToast('Email saved for ' + c.name);
            }
            showToast('Building PDF…');
            const booking = db.getContractorBooking(contractorId, addressId);
            const subject = 'Defects - ' + addr;

            // Attach ONE PDF (photos embedded) scoped to THIS contractor's open +
            // pending items at this address, instead of loose photos. Outlook lifts
            // the "Defects - <address>" first body line into the Subject AND keeps
            // the PDF (both); Apple Mail keeps the PDF (subject stays in the body —
            // iOS won't set a Subject alongside any attachment). `defects` above is
            // already this contractor's open + pending items.
            // NOTE (Spiro 2026-07-30): there used to be a `files` array here that
            // collected the PDF in "attach mode" and was then never used — nothing
            // ever called navigator.share with it. That is why ✉️ and 🔗 behaved
            // identically: both fall through to the mailto + hosted link below.
            // Removed rather than wired up, because on iOS a Web-Share file
            // attachment is broken at the platform level (see the note in
            // generateDefectPDF: Apple injects the blob: URL into the body on every
            // file share, and a Subject cannot be set alongside an attachment).
            // The hosted https link is the mechanism that actually works.
            let scopedPdf = null;
            try {
                scopedPdf = await generateDefectPDF(defects, { photos: true, asFile: true, statuses: ['open', 'pending'], addressIds: [addressId], contractorIds: [contractorId], groupBy: 'address' });
            } catch (e) { console.error('supplier email PDF', e); }

            // Once the email is sent, move every item we just emailed from
            // 'open' (red) to 'pending' (amber) — they're now ordered/booked
            // with the trade. Only flips items still open; leaves pending ones.
            const markEmailedPending = () => {
                let changed = 0;
                for (const d of defects) if (defectStatusOf(d) === 'open') { db.setDefectStatus(d.id, 'pending'); changed++; }
                if (changed) { render(); flushStatus(); showToast(changed + ' item' + (changed === 1 ? '' : 's') + ' marked pending'); }
            };

            // ATTACH MODE (📎) — hand Mail the actual file.
            //
            // This is tried BEFORE the server route now. The server route uploads
            // the PDF first, and every second spent awaiting that pushed the
            // share() call further outside iOS's activation window — so the
            // "better" path was quietly destroying the one that works. It moves
            // below, and only runs if sharing isn't possible at all.
            if (!asLink && scopedPdf) {
                const shared = await sharePdfOnTap(
                    scopedPdf,
                    'Attach to email',
                    `Tap below, then pick <b>Mail</b>. The PDF attaches to the message.<br><br>`
                    + `<span style="opacity:.75">You'll need to add <b>${String(c.email || 'the supplier').replace(/&/g, '&amp;').replace(/</g, '&lt;')}</b> and the subject yourself — `
                    + `iOS won't accept a subject line alongside an attachment. Use ✉️ instead for a ready-to-send `
                    + `email with a link.</span>`,
                );
                if (shared) { markEmailedPending(); return; }
            }

            // SERVER SEND — a real attachment AND a filled-in subject, on any
            // device. Needs the email-supplier-defects Edge Function deployed and
            // RESEND_API_KEY set, plus a verified Resend domain; until then this
            // errors and we fall through to the link, so nothing regresses.
            // Hoisted so the link path below reuses this upload instead of
            // sending the same PDF up a second time on mobile data.
            let hosted = null;
            if (!asLink && scopedPdf && window.CloudMail && window.CloudShare) {
                hosted = await window.CloudShare.uploadTempPdf(scopedPdf, scopedPdf.name).catch(() => null);
                const pdfKey = window.CloudShare.lastKey && window.CloudShare.lastKey();
                if (hosted && pdfKey) {
                    const bl = booking
                        ? 'Please see attached Defects list and booking for ' + fmtDateNice(booking) + '.'
                        : 'Please see attached Defects list.';
                    const sent = await window.CloudMail.sendSupplierDefects({
                        to: c.email, subject,
                        bodyText: 'RE: ' + addr + '\n\n' + bl + '\n\nPlease confirm booking.\n',
                        pdfKey, filename: scopedPdf.name,
                    });
                    if (sent && sent.ok) {
                        // ownerOnly: Resend's shared onboarding sender only ever
                        // delivers to the account owner, so say so rather than
                        // let it look like the supplier got it.
                        showToast(sent.ownerOnly
                            ? 'Sent — but the server has no verified sending domain, so only YOU will receive it'
                            : 'Emailed ' + c.name + ' with the PDF attached', !!sent.ownerOnly);
                        markEmailedPending();
                        return;
                    }
                    console.warn('[email] server send unavailable, falling back to link:', sent && sent.error);
                }
            }


            // LINK MODE (🔗), and iOS's only working route. mailto gets a REAL
            // Subject + body — the only way iOS fills the Subject field — and the
            // defect list + photos ride as a tap-to-open hosted PDF link, so
            // nothing is attached (= no blob, subject stays).
            let url = hosted;
            try { if (!url && scopedPdf && window.CloudShare) url = await window.CloudShare.uploadTempPdf(scopedPdf, scopedPdf.name); }
            catch (e) { console.error('supplier PDF link', e); }

            const bookingLine = booking
                ? 'Please see attached Defects list and booking for ' + fmtDateNice(booking) + '.'
                : 'Please see attached Defects list.';
            let body = 'RE: ' + addr + '\n\n'
                + bookingLine + '\n\n'
                + 'Please confirm booking.\n';
            if (url) body += '\nDefects list + photos — tap to open:\n' + url + '\n';
            else showToast('Could not build the PDF link — sending text only', true);

            window.location.href = 'mailto:' + encodeURIComponent(c.email) +
                '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
            markEmailedPending();   // mail client opened → items are now ordered
        }

        // 📑 in a contractor group: build + download a PDF of THIS contractor's
        // open + pending items for THIS job (address). No email — just the report.
        async function generateContractorJobPdf(contractorId, addressId) {
            const defects = (db.data.defects || []).filter(d =>
                d.addressId === addressId && d.contractorId === contractorId && !d.completed);
            if (!defects.length) { showToast('No open items for this supplier', true); return; }
            // OPENED, not downloaded (Spiro 2026-07-30 — "the pdf should generate
            // and open"). This used to call generateDefectPDF without asFile, which
            // on iOS ends in navigator.share — a share SHEET, not the document —
            // and then said "PDF downloaded" regardless of what actually happened.
            //
            // The tab is opened here, synchronously, BEFORE any await: iOS blocks
            // window.open once the click gesture has been handed back, so opening
            // it after the upload would be swallowed by the popup blocker.
            const tab = window.open('', '_blank');
            showToast('Building PDF…');
            try {
                const file = await generateDefectPDF(defects, {
                    photos: true, asFile: true, statuses: ['open', 'pending'],
                    addressIds: [addressId], contractorIds: [contractorId], groupBy: 'address',
                });
                if (!file) throw new Error('PDF builder returned nothing');
                let url = null;
                try { if (window.CloudShare) url = await window.CloudShare.uploadTempPdf(file, file.name); }
                catch (e) { console.error('contractor job PDF host', e); }
                if (url) {
                    if (tab) tab.location.href = url; else window.location.href = url;
                    showToast('PDF opened');
                    return;
                }
                // Hosting unavailable (offline) — hand the file over locally rather
                // than leaving a blank tab sitting there.
                if (tab) tab.close();
                const blobUrl = URL.createObjectURL(file);
                const a = document.createElement('a');
                a.href = blobUrl; a.download = file.name; a.rel = 'noopener';
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(blobUrl), 30000);
                showToast('PDF saved — could not reach the server to open it', true);
            } catch (e) {
                if (tab) tab.close();
                console.error('contractor job PDF', e);
                showToast('Could not build the PDF', true);
            }
        }

        // Defects currently in view — matches what generateDefectText() lists, so
        // we attach exactly those defects' photos to the emailed list.
        function currentViewDefects() {
            const v = state.currentView, f = state.filters || {};
            if (v === 'view-defects-contractor' && f.contractorId) return db.getDefects({ contractorId: f.contractorId });
            if (v === 'view-defects-address' && f.addressId) return db.getDefects({ addressId: f.addressId });
            if ((v === 'view-defects-trade' || v === 'view-multiple-contractors') && f.contractorIds)
                return db.getDefects().filter(d => f.contractorIds.includes(d.contractorId));
            return db.getDefects();
        }

        // Always shares with photos + report. On the share sheet: Outlook pulls the
        // first body line ("Defects - <address>") up as the Subject AND attaches the
        // files — so it gets BOTH; Apple Mail attaches the files and shows that line
        // at the top of the body (iOS won't let it set a Subject with attachments).
        // withPhotos is kept as a param for the mailto fallback path only.
        async function emailDefectList(withPhotos = true, asLink = false) {
            const textContent = generateDefectText();
            let subject = 'Defect List';
            let recipient = '';
            let singleAddressId = null;
            let scoped = true;   // only gather photos for a scoped view, never "all defects"

            // Set subject and recipient based on current view
            if (state.currentView === 'view-defects-contractor' && state.filters.contractorId) {
                const contractor = db.getContractor(state.filters.contractorId);
                subject = `Defects - ${contractor ? contractor.name : 'Contractor'}`;
                if (contractor && contractor.email) recipient = contractor.email;
            } else if (state.currentView === 'view-defects-address' && state.filters.addressId) {
                const address = db.getAddress(state.filters.addressId);
                subject = `Defects - ${formatAddress(address)}`;
                singleAddressId = state.filters.addressId;
                // Collect all contractor emails for this address
                const defects = db.getDefects({ addressId: state.filters.addressId });
                const seenContractors = new Set();
                const contractorEmails = [];
                defects.forEach(d => {
                    if (!seenContractors.has(d.contractorId)) {
                        seenContractors.add(d.contractorId);
                        const contractor = db.getContractor(d.contractorId);
                        if (contractor && contractor.email && contractor.email.trim()) contractorEmails.push(contractor.email.trim());
                    }
                });
                recipient = contractorEmails.join(',');
            } else if (state.currentView === 'view-defects-trade' && state.filters) {
                subject = `Defects - ${state.filters.tradeName}`;
            } else if (state.currentView === 'view-multiple-contractors' && state.filters.contractorIds) {
                subject = 'Defects - Multiple Contractors';
            } else {
                subject = 'Defects - All';
                scoped = false;
            }

            // Build the trade-scoped PDF (open + pending, photos embedded) for this
            // view. Used by BOTH the attach mode and the link mode.
            // currentViewDefects() is already open+pending (getDefects drops completed).
            const buildScopedPdf = async () => {
                const list = currentViewDefects();
                if (!list.length) return null;
                const pdfOpts = { photos: true, asFile: true, statuses: ['open', 'pending'], groupBy: 'address' };
                if (singleAddressId != null) pdfOpts.addressIds = [singleAddressId];
                else if (state.currentView === 'view-defects-contractor' && state.filters.contractorId) pdfOpts.contractorIds = [state.filters.contractorId];
                else if (state.filters && state.filters.contractorIds) pdfOpts.contractorIds = state.filters.contractorIds;
                // So a trade list emailed from the trade screen is named after
                // the trade rather than counted as "5Suppliers".
                if (state.currentView === 'view-defects-trade' && state.filters && state.filters.tradeName) pdfOpts.tradeName = state.filters.tradeName;
                return await generateDefectPDF(list, pdfOpts);
            };

            // Open the Mail app via mailto so it gets a REAL Subject + body — the
            // only reliable way on iOS (a share-sheet attachment never sets the
            // Subject, and pairing text with a file leaks a blob: link). The
            // defect list + photos ride as a tap-to-open PDF link hosted in the
            // cloud, so nothing is attached (= no blob, and the Subject sticks).
            showToast('Building email…');
            let url = null;
            try { const pdf = scoped ? await buildScopedPdf() : null; if (pdf && window.CloudShare) url = await window.CloudShare.uploadTempPdf(pdf, pdf.name); }
            catch (e) { console.error('email PDF link', e); }
            const reTarget = subject.replace(/^Defects - /, '');
            let body = 'RE: ' + reTarget + '\n\n'
                + 'Please see attached Defects list.\n\n'
                + 'Please confirm booking.\n';
            if (url) body += '\nDefects list + photos — tap to open:\n' + url + '\n';
            else showToast('Could not build the PDF link — sending text only', true);
            window.location.href = (recipient ? `mailto:${recipient}` : 'mailto:') +
                `?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            showToast('📧 Opening email…');
        }

        function handleAddressAutocomplete(input, groupIndex) {
            const value = input.value.toLowerCase();
            const dropdown = document.getElementById(`address-dropdown-${groupIndex}`);
            
            if (!dropdown) return;
            
            const isNumeric = /^\d/.test(value);
            
            const addresses = scopeAddressesToUser(db.getAddresses()).filter(a => {
                const lotNumber = a.propertyNumber ? a.propertyNumber.toLowerCase() : '';
                if (isNumeric) {
                    return lotNumber.startsWith(value) ||
                           searchWords(a.street).some(word => word.startsWith(value));
                }
                return matchesSearch([a.street, a.suburb], value);
            }).sort((a, b) => {
                if (isNumeric) {
                    const aLotMatch = a.propertyNumber && a.propertyNumber.toLowerCase().startsWith(value);
                    const bLotMatch = b.propertyNumber && b.propertyNumber.toLowerCase().startsWith(value);
                    if (aLotMatch && !bLotMatch) return -1;
                    if (!aLotMatch && bLotMatch) return 1;
                    
                    const aStreetFirst = a.street.toLowerCase().split(' ')[0];
                    const bStreetFirst = b.street.toLowerCase().split(' ')[0];
                    const aStreetMatch = aStreetFirst.startsWith(value);
                    const bStreetMatch = bStreetFirst.startsWith(value);
                    if (aStreetMatch && !bStreetMatch) return -1;
                    if (!aStreetMatch && bStreetMatch) return 1;
                } else {
                    const aStreetWords = a.street.toLowerCase().split(' ');
                    const bStreetWords = b.street.toLowerCase().split(' ');
                    
                    const aStreetMatch = aStreetWords.some(word => word.startsWith(value));
                    const bStreetMatch = bStreetWords.some(word => word.startsWith(value));
                    
                    if (aStreetMatch && !bStreetMatch) return -1;
                    if (!aStreetMatch && bStreetMatch) return 1;
                    
                    if (aStreetMatch && bStreetMatch) {
                        const aFirstWord = aStreetWords[0].startsWith(value);
                        const bFirstWord = bStreetWords[0].startsWith(value);
                        if (aFirstWord && !bFirstWord) return -1;
                        if (!aFirstWord && bFirstWord) return 1;
                    }
                }
                return a.street.localeCompare(b.street);
            });
            
            if (addresses.length === 0 || value === '') {
                dropdown.classList.remove('active');
                return;
            }
            
            dropdown.innerHTML = addresses.slice(0, 5).map(a => `
                <div class="autocomplete-item" onclick="selectAddressForGroup(${groupIndex}, ${a.id}, '${a.street.replace(/'/g, "\\'")}')">
                    ${a.street}, ${a.suburb}${a.propertyNumber ? ' - ' + a.propertyNumber : ''}
                </div>
            `).join('');
            
            dropdown.classList.add('active');
        }

        function applyBulkTradeAssignment() {
            // Get selected contractors
            const contractorCheckboxes = document.querySelectorAll('[id^="bulk-contractor-"]:checked');
            const selectedContractorIds = Array.from(contractorCheckboxes).map(cb => parseInt(cb.value));

            // Get selected trades
            const tradeCheckboxes = document.querySelectorAll('[id^="bulk-trade-"]:checked');
            const selectedTradeIds = Array.from(tradeCheckboxes).map(cb => parseInt(cb.value));

            if (selectedContractorIds.length === 0) {
                showToast('Please select at least one contractor', true);
                return;
            }

            if (selectedTradeIds.length === 0) {
                showToast('Please select at least one trade', true);
                return;
            }

            // Apply trades to contractors
            let updatedCount = 0;
            selectedContractorIds.forEach(contractorId => {
                const contractor = db.getContractor(contractorId);
                if (contractor) {
                    // Merge new trades with existing ones (no duplicates)
                    const existingTradeIds = contractor.tradeIds || [];
                    const mergedTradeIds = [...new Set([...existingTradeIds, ...selectedTradeIds])];
                    
                    // Update contractor
                    contractor.tradeIds = mergedTradeIds;
                    
                    // Build trades string
                    const trades = db.getTrades()
                        .filter(t => mergedTradeIds.includes(t.id))
                        .map(t => t.name)
                        .join(', ');
                    contractor.trades = trades;
                    
                    updatedCount++;
                }
            });

            // Save to database
            db.save();

            closeModal('bulk-assign-trades-modal');
            showToast(`✓ Assigned trades to ${updatedCount} contractor(s)`);
            render();
        }

        // Main render function
        // The defects header is frozen directly beneath the blue app header,
        // which is itself frozen beneath the cloud-sync status bar. Neither
        // height is a constant — the design theme changes the app header's
        // padding and font, and the status bar grows by the notch inset — so
        // both are MEASURED after every render rather than hard-coded. (The CSS
        // fallbacks only have to be close enough for the first paint; and
        // cloud-sync.js injects its own #cs-statusbar rules at runtime, which
        // land after this stylesheet, so guessing that bar's height is wrong.)
        // The variables go on <body> because body.cs-authed also declares
        // --cs-bar-h; an inline style there is what beats it.
        function syncStickyHeader() {
            const s = document.body.style;
            const bar = document.getElementById('cs-statusbar');
            const head = document.querySelector('.defects-container > .app-header');
            if (bar) s.setProperty('--cs-bar-h', bar.offsetHeight + 'px');
            else s.removeProperty('--cs-bar-h');
            s.setProperty('--app-header-h', (head ? head.offsetHeight : 0) + 'px');
            fitLotTitle();
        }
        // Keep the address on ONE line without clipping it. It has the full width
        // now, so the only addresses that need anything are the very longest, and
        // stepping down a point or two beats either wrapping to a second line or
        // eating the end of the street name (Spiro 2026-08-02). CSS can't fit text
        // to a box, hence the loop. Floor is 14px — below that it stops reading as
        // the heading of the screen, and anything still over clips as before.
        function fitLotTitle() {
            document.querySelectorAll('.defects-header.hdr-inline .lot-title').forEach(t => {
                const addr = t.querySelector('.lot-addr');
                if (!addr) return;
                let px = 17;
                t.style.fontSize = px + 'px';
                while (px > 14 && addr.scrollWidth > addr.clientWidth + 1) {
                    px -= 0.5;
                    t.style.fontSize = px + 'px';
                }
            });
        }
        window.addEventListener('resize', syncStickyHeader);
        window.addEventListener('orientationchange', syncStickyHeader);
        // The status bar is appended by cloud-sync.js once sign-in resolves,
        // which may be long after the last render. Catch that one arrival.
        if (window.MutationObserver && document.body) {
            const mo = new MutationObserver(() => {
                if (!document.getElementById('cs-statusbar')) return;
                mo.disconnect();
                syncStickyHeader();
            });
            mo.observe(document.body, { childList: true });
        }

        function render() {
            const app = document.getElementById('app');

            let content = '';
            // Safety net: a single malformed record must never blank the whole
            // app (which reads as "tapping does nothing"). If a view throws while
            // building its HTML, fall back to a recoverable error card instead of
            // leaving the screen frozen on the previous render.
            try {
                switch(state.currentView) {
                    case 'home':
                        content = renderHomeView();
                        break;
                    case 'view-defects-address':
                        content = renderViewDefectsAddress(state.filters.addressId);
                        break;
                    case 'view-defects-contractor':
                        content = renderViewDefectsContractor(state.filters.contractorId);
                        break;
                    case 'view-defects-trade':
                        content = renderViewDefectsTrade(state.filters);
                        break;
                    case 'add-defects-address':
                        content = renderAddDefectsAddress(state.filters.addressId);
                        break;
                    case 'add-defects-contractor':
                        content = renderAddDefectsContractor(state.filters.contractorId);
                        break;
                    case 'view-multiple-contractors':
                        content = renderMultipleContractorsView(state.filters.contractorIds);
                        break;
                    case 'view-all-defects':
                        content = renderAllDefectsView();
                        break;
                    case 'shopping':
                        content = renderShoppingView(state.filters.shoppingAddressId);
                        break;
                    case 'manage':
                        content = renderManageScreen();
                        break;
                }
            } catch (err) {
                console.error('[render] view "' + state.currentView + '" failed:', err);
                content = `
                    <div class="defects-container">
                        <div class="app-header">
                            <a href="#" class="back-link" onclick="event.preventDefault(); showHomeView()">Back</a>
                            <div class="header-title">Something went wrong</div>
                            <div style="width:60px;"></div>
                        </div>
                        <div class="empty-state">
                            <div class="empty-state-icon">⚠️</div>
                            <p>This screen couldn't be displayed.</p>
                            <p style="font-size:12px;color:var(--text-secondary,#888);max-width:300px;margin:6px auto 0;">It's been logged. Your data is safe — tap Back to return home, or pull to refresh.</p>
                            <button onclick="showHomeView()" style="margin-top:14px;padding:10px 18px;border:1px solid var(--border-color,#ccc);border-radius:10px;background:var(--bg-secondary);color:var(--text-primary);font-weight:600;cursor:pointer;">Back to home</button>
                        </div>
                    </div>`;
            }

            app.innerHTML = `
                ${content}
                ${createModals()}
            `;

            if (state.currentView === 'home') {
                // No need for multi-select rendering in new design
            }

            // Any screen that lists defects shows the 📷 badge; refresh the per-
            // defect photo counts (debounced) so the number is consistent on every
            // view, not just the one that happened to be open after the last pull.
            const showsDefects = ['view-defects-address','view-defects-contractor',
                'view-defects-trade','view-multiple-contractors','view-all-defects'];
            if (showsDefects.includes(state.currentView) &&
                window.CloudPhotos && window.CloudPhotos.refreshCounts) {
                window.CloudPhotos.refreshCounts();
            }
            // Preview cards render with an empty photo slot so the list appears
            // instantly; the images are fetched in one batch straight after.
            if (typeof previewMode === 'function' && previewMode()) void fillPreviewPhotos();

            // Re-measure the frozen header stack for the screen just drawn.
            syncStickyHeader();
        }

        function resetDatabase() {
            if (!confirm('⚠️ WARNING: This will delete ALL data (addresses, contractors, defects, trades) and reload the 105 construction trades. Are you sure?')) {
                return;
            }
            
            if (!confirm('This action cannot be undone. Continue?')) {
                return;

        // "My Jobs" — the jobs allocated to the logged-in supervisor (matched by

        function renderMyJobsSection() {

            // Show ONLY jobs currently in construction (lifecycle status
            // 'active') — never pre-planner / admin (pre-site) / completed /
            // handed-over. Safety net: if NO job has a status yet (data still
            // loading), show all rather than a false-empty list — but the moment
            // any status is present, filter strictly.
            let list = db.getAddresses();
            if (list.some(a => a.jobStatus)) list = list.filter(a => a.jobStatus === 'active');
            // Supervisors see only their own jobs; managers see all. Identity
            // resolves from the persisted cs_identity on reload, so the filter
            // applies from the FIRST frame — no flash of other supervisors'
            // jobs during an app update. If identity is genuinely unknown
            // (first-ever boot / just signed out) show NOTHING rather than
            // everyone's jobs; the loading message covers that state.
            const supDataLoaded = list.some(a => a.supervisorId);
            if (!isMgr) {
                if (!uid) list = [];
                else if (supDataLoaded) list = list.filter(a => a.supervisorId === uid);
            }
            // Sort alphabetically by street name, then by lot number. Prefer the
            // clean fields from the data layer; fall back to parsing the combined
            // "Lot N, [house] Street" for any not-yet-resynced cached rows.
            const streetKey = (a) => (a.streetName != null ? a.streetName
                : ((a.street || '').includes(',')
                    ? a.street.slice(a.street.indexOf(',') + 1).replace(/[()]/g, '').replace(/^\s*\d+[a-zA-Z]?\s+/, '')

            list = [...list].sort((a, b) => streetKey(a).localeCompare(streetKey(b)) || (lotKey(a) - lotKey(b)));
            // Built from <div>s (not <button>s): iOS Safari mishandles buttons as
            // flex items and was stacking the icons under the address. Icons live
            // in a fixed-width group so they always sit BESIDE the address.
            // Outstanding (not-completed) defect count per job, for the markers.
            const markersOn = showDefectMarkers();
            const outstanding = {};

            const body = list.length ? rows : `<div style="padding:16px;opacity:.7;font-size:13px;">${emptyMsg}</div>`;
            return `

                   </label>`;

        // Android Chrome only: open the real phone contacts list and pull one in.
        async function pickPhoneContact() {
            try {
                if (!('contacts' in navigator) || !navigator.contacts.select) {
                    showToast('Your phone can’t open contacts here — use a contact file or type it'); return;
                }
                const sel = await navigator.contacts.select(['name', 'tel', 'email'], { multiple: false });
                if (!sel || !sel.length) return;
                const c = sel[0];
                const set = (id, v) => { const el = document.getElementById(id); if (el && v) el.value = v; };
                set('ac-name', (c.name && c.name[0]) || '');
                set('ac-phone', (c.tel && c.tel[0]) || '');
                set('ac-email', (c.email && c.email[0]) || '');
                showToast('Contact loaded — check the details and save');
            } catch (e) { /* user cancelled / denied — no-op */ }
        }
        function importVcardToContractor(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                const text = String(reader.result || '');
                const grab = (re) => { const m = text.match(re); return m ? m[1].trim() : ''; };
                const fn = grab(/^FN[^:\n]*:(.+)$/im) || grab(/^N[^:\n]*:(.+)$/im);
                const tel = grab(/^TEL[^:\n]*:(.+)$/im);
                const email = grab(/^EMAIL[^:\n]*:(.+)$/im);
                const set = (id, v) => { const el = document.getElementById(id); if (el && v) el.value = v; };
                set('ac-name', fn); set('ac-phone', tel); set('ac-email', email);
                showToast('Contact loaded — check the details and save');
            };
            reader.onerror = () => showToast('Could not read that contact file');
            reader.readAsText(file);
        }
        function saveNewContractor() {
            const val = (id) => (document.getElementById(id) || {}).value || '';
            const name = val('ac-name').trim();
            if (!name) { showToast('Enter a contractor name'); return; }
            const newTrade = val('ac-trade-new').trim();
            const existingTradeId = val('ac-trade-existing');
            let tradeIds = [];
            if (newTrade) { const t = db.addTrade({ name: newTrade }); if (t) tradeIds = [t.id]; }
            else if (existingTradeId) { tradeIds = [parseInt(existingTradeId, 10)]; }
            const phone = val('ac-phone').trim(), email = val('ac-email').trim();
            if (_editingContractorId != null) {
                // Edit existing (manager cleanup) — keep its sharing state.
                const c = db.getContractor(_editingContractorId);
                if (c) {
                    c.name = name; c.phone = phone; c.email = email;
                    if (tradeIds.length) { c.tradeIds = tradeIds; c.trades = tradeIds.map(id => (db.data.trades.find(t => t.id === id) || {}).name).filter(Boolean).join(', ') || 'No Trade Assigned'; }
                    db.save();
                }
                _editingContractorId = null;
                impClose(); render(); showToast('Contractor updated');
                return;
            }
            if (!tradeIds.length) { showToast('Choose a trade, or type a new one, for this contractor'); return; }
            const isMgr = !!(window.CloudJobs && window.CloudJobs.isManager && window.CloudJobs.isManager());
            const uid = (window.CloudJobs && window.CloudJobs.currentUserId) ? window.CloudJobs.currentUserId() : null;
            db.addContractor({ name, phone, email, tradeIds, isShared: isMgr, addedBy: isMgr ? null : uid });
            impClose();
            // No render() — keep any in-progress add-defects form intact; the new
            // contractor is in db.data and shows in the autocomplete immediately.
            showToast(isMgr ? 'Contractor added' : 'Contractor added — private to you for now');
        }
        // Manager action: promote a private supervisor-added contractor to the team.
        // Share waits for the CLOUD to confirm before it says so. The background
        // diff engine swallows a refused write on purpose (one bad row must not
        // freeze the push), which meant a manager could tap Share, be told it
        // worked, and watch the contractor reappear on the next pull. On failure
        // the local change is rolled back so the screen matches the database.
        // (Spiro 2026-08-02)
        async function shareContractor(legacyId) {
            const c = db.getContractor(legacyId);
            if (!c) return;
            const prev = { isShared: c.isShared, addedBy: c.addedBy };
            c.isShared = true; c.addedBy = null;
            db.save();
            render();
            const cs = window.CloudSync;
            if (cs && cs.commitContractor) {
                const res = await cs.commitContractor(legacyId);
                if (!res || !res.ok) {
                    c.isShared = prev.isShared; c.addedBy = prev.addedBy;
                    db.save();
                    render();
                    showToast('Could not share — ' + ((res && res.error) || 'the database refused the change'), true);
                    return;
                }
            }
            showToast('Contractor shared with the team');
        }

        // Share a File from a FRESH tap.
        //
        // navigator.share() only works inside a live user gesture. Building the
        // PDF (and embedding its photos) takes far longer than iOS's activation
        // window, so calling share() after that await throws NotAllowedError —
        // which is why every attempt at "attach the PDF" fell through to the
        // mailto fallback and Spiro kept seeing a link instead of a file
        // (2026-07-30). No amount of reordering fixes it: the file cannot exist
        // before the tap that asks for it.
        //
        // So the work happens first, then this asks for one more tap, and THAT
        // tap calls share() with the gesture still alive. Resolves true if the
        // sheet opened, false if it couldn't be used at all (caller falls back).
        function sharePdfOnTap(file, headline, note) {
            return new Promise((resolve) => {
                // canShare() only shipped in Safari 16.4. Requiring it meant that on
                // an older iPhone the check failed, this returned false, no overlay
                // ever appeared and the caller silently fell back to the mailto
                // link — indistinguishable from the bug it was meant to fix
                // (Spiro 2026-07-30, 5th report). So: if canShare exists, trust it;
                // if it doesn't, try share() anyway and let it tell us.
                const canFiles = navigator.canShare
                    ? navigator.canShare({ files: [file] })
                    : typeof navigator.share === 'function';
                if (!canFiles) {
                    // Say so rather than fall through quietly, so a failure here is
                    // never mistaken for "the attachment didn't work".
                    showToast('This device can\u2019t attach files from the browser \u2014 sending a link instead', true);
                    resolve(false); return;
                }
                impOverlay(`
                    <div id="imp-head"><strong>📎 ${headline}</strong><button id="imp-close">✕</button></div>
                    <div id="imp-body">
                        <div style="font-size:14px;line-height:1.5;margin-bottom:14px">${note}</div>
                        <button class="imp-btn" id="sh-go" style="width:100%">📎 Attach ${file.name}</button>
                    </div>`);
                let done = false;
                const finish = (v) => { if (done) return; done = true; impClose(); resolve(v); };
                const x = document.getElementById('imp-close');
                if (x) x.onclick = () => finish(false);
                document.getElementById('sh-go').onclick = async () => {
                    try { await navigator.share({ files: [file] }); finish(true); }
                    catch (e) {
                        if (e && e.name === 'AbortError') { finish(true); return; }  // user closed the sheet
                        console.error('sharePdfOnTap', e);
                        // Name the failure on screen. Four silent fall-throughs to
                        // the mailto link made every cause look identical from the
                        // outside; if this fails again the toast says why.
                        showToast('Attach failed: ' + ((e && (e.name + (e.message ? ' \u2014 ' + e.message : ''))) || 'unknown')
                            + ' \u2014 sending a link instead', true);
                        finish(false);
                    }
                };
            });
        }

                if (_review) return;
                impClose();
