                // Every toggle has to be read BEFORE impSetBusy — it replaces the
                // dialog body, so #imp-ai / #imp-deep are gone by the time the
                // import routes.
                const reportType = (document.getElementById('imp-type') || {}).value || 'BPI';
                const useAI = !!((document.getElementById('imp-ai') || {}).checked && window.CloudAI);
                const isPdf = (f.name || '').toLowerCase().endsWith('.pdf') || f.type === 'application/pdf';
                const deep = isPdf && reportType !== 'BPI' && deepReadAllowed()
                    && !!((document.getElementById('imp-deep') || {}).checked);
                impSetBusy('Reading ' + f.name + '…');
                try {
                    // BPI reports: ALWAYS use structured extraction (location, page, trade)
                    // + job match — the AI path drops the structured columns, so we don't
                    // route BPI through it even when the AI toggle is on.
                    if (reportType === 'BPI' && isPdf) {
                        const paged = await extractReportTextPaged(f);
                        const items = parseBpiDefects(paged);
                        if (!items.length) { impOverlayMessage('No defects were found in that report.'); return; }
                        startReportReview(items, f.name, reportType, matchAddressFromText(paged, f.name), f);
                        return;
                    }
                    // Text is still pulled locally even on the deep path — it costs
                    // nothing, matches the property from the report header, and is
                    // the fallback if the deep read doesn't come back.
                    const text = await extractReportText(f);
                    await extractAndReview(text, f.name, reportType, useAI, f, deep);
                } catch (err) {
                    console.error(err);
                    impOverlayMessage('Could not read that file: ' + (err.message || err));
                }
            };
            document.getElementById('imp-extract').onclick = async () => {
                const text = document.getElementById('imp-paste').value;
                if (!text.trim()) { showToast('Paste some text or choose a file', true); return; }
                const reportType = (document.getElementById('imp-type') || {}).value || 'BPI';
                const useAI = !!((document.getElementById('imp-ai') || {}).checked && window.CloudAI);
                if (reportType === 'BPI') {
                    const items = parseBpiDefects(text);
                    if (!items.length) { impOverlayMessage('No defects were found in that text.'); return; }
                    startReportReview(items, 'Pasted report', reportType, matchAddressFromText(text));
                    return;
                }
                await extractAndReview(text, 'Pasted report', reportType, useAI);
            };
        }

        // ===========================================================================
        //  DEEP READ — third-party private inspection reports (Spiro 2026-08-02)
        //  Manager-only. See the note on the extract-defects edge function for why
        //  it exists: private reports carry their structure in the LAYOUT, and the
        //  flat path throws the layout away before Claude sees it.
        // ===========================================================================
        // Cost lever. Deep read pays ~2,300 tokens a page against ~350 as text, so
        // a fat report is the one thing that can make this expensive. Every private
        // inspection report we've seen is well under this; anything bigger falls
        // back to the flat read rather than quietly spending the money.
        const DEEP_MAX_PAGES = 60;
        // 32 MB is the API's request ceiling and base64 inflates by ~4/3, so the
        // real PDF has to stay well under. The edge function enforces its own cap;
        // this one just gives a better message before the upload.
        const DEEP_MAX_BYTES = 11 * 1024 * 1024;

        function deepReadAllowed() {
            return !!(window.CloudAI && window.CloudAI.deepAvailable && window.CloudAI.deepAvailable());
        }
        function fileToBase64(file) {
            return new Promise((res, rej) => {
                const fr = new FileReader();
                fr.onload = () => { const s = String(fr.result || ''); res(s.slice(s.indexOf(',') + 1)); };
                fr.onerror = () => rej(fr.error || new Error('Could not read the file'));
                fr.readAsDataURL(file);
            });
        }
        async function pdfPageCount(file) {
            if (!window.pdfjsLib) return 0;
            try {
                const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
                return pdf.numPages || 0;
            } catch (e) { return 0; }
        }
        // Resolves { items, layout } on success, or null to fall through to the
        // flat path. Never throws — a deep read that fails must not cost the
        // supervisor their import.
        async function deepReadReport(reportFile) {
            if (!reportFile) return null;
            if (reportFile.size > DEEP_MAX_BYTES) {
                showToast('That PDF is too big for deep read — using standard AI', true);
                return null;
            }
            const pages = await pdfPageCount(reportFile);
            if (pages > DEEP_MAX_PAGES) {
                showToast(pages + ' pages is too long for deep read — using standard AI', true);
                return null;
            }
            impSetBusy('🔬 Deep reading the report…'
                + '<div style="font-size:13px;margin-top:10px;line-height:1.5">Claude is reading every page — headings, layout and photos.'
                + (pages ? '<br>' + pages + ' page' + (pages === 1 ? '' : 's') + '.' : '')
                + '<br>This takes longer than a normal import.</div>');
            try {
                const res = await window.CloudAI.extractDeep(
                    await fileToBase64(reportFile), Object.keys(CALLUP_TRADE_KEYWORDS));
                if (!res || !res.items.length) return null;
                // The photo pairer keys off itemNo the same way it does for a BPI
                // Tag. A private report has no numbering of its own, so the list
                // position becomes the number — and the supervisor sees the same
                // "1 of 24" review either way.
                res.items.forEach((it, i) => { it.itemNo = i + 1; });
                return res;
            } catch (err) {
                console.error('[deep read]', err);
                showToast('Deep read failed — using standard AI extraction', true);
                return null;
            }
        }

        // Decide between deep read, AI extraction and the built-in parser, then review.
        async function extractAndReview(rawText, sourceName, reportType, useAI, reportFile, deep) {
            let items = [], opts = {};
            if (deep && deepReadAllowed()) {
                const res = await deepReadReport(reportFile);
                if (res) { items = res.items; opts = { layout: res.layout, photoMode: 'anchor' }; }
            }
            if (!items.length && useAI) {
                impSetBusy('🤖 Reading the report with AI…');
                try {
                    items = await window.CloudAI.extract(rawText);
                } catch (err) {
                    console.error('[AI extract]', err);
                    showToast('AI extraction failed — using basic parser', true);
                    items = parseReportDefects(rawText);
                }
            } else if (!items.length) {
                items = parseReportDefects(rawText);
            }
            if (!items.length) { impOverlayMessage('No defects were found in that report.'); return; }
            // Match the property from the report header even on the AI path, so the
            // address is pre-selected regardless of which extractor ran. The source
            // file name doubles as a match input (BPI names embed lot + street).
            startReportReview(items, sourceName, reportType, matchAddressFromText(rawText, sourceName), reportFile, opts);
        }

        function impSetBusy(msg) {
            const body = document.getElementById('imp-body');
            if (body) body.innerHTML = `<div style="padding:30px;text-align:center;color:var(--text-secondary,#888)">${msg}</div>`;
        }
        function impOverlayMessage(msg) {
            const body = document.getElementById('imp-body');
            if (body) body.innerHTML = `<div style="padding:24px;text-align:center">${msg}</div>
                <button class="imp-btn secondary" onclick="openReportImport()">Try again</button>`;
        }

        // ---- Text extraction ----
        // The PDF reader is fetched from a CDN on first use. Both URLs are also
        // precached by the service worker (sw.js EXTRA) so a report can be
        // imported in a dead spot once the app has been opened online at least
        // once.
        const PDFJS_SRC    = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        let _pdfjsReady = null;
        function ensurePdfJs() {
            if (window.pdfjsLib) return Promise.resolve();
            if (_pdfjsReady) return _pdfjsReady;
            _pdfjsReady = new Promise((res, rej) => {
                const s = document.createElement('script');
                s.src = PDFJS_SRC;
                let settled = false;
                const finish = (fn, arg) => { if (settled) return; settled = true; clearTimeout(timer); fn(arg); };
                // A stalled request never fires onerror, so without this the whole
                // import hung forever on a weak connection with nothing on screen.
                const timer = setTimeout(() => {
                    try { s.remove(); } catch (e) {}
                    finish(rej, new Error('The PDF reader is taking too long to download — check your signal and try again.'));
                }, 20000);
                s.onload = () => {
                    try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; } catch (e) {}
                    finish(res);
                };
                s.onerror = () => {
                    try { s.remove(); } catch (e) {}
                    finish(rej, new Error('Could not load the PDF reader — check your signal and try again.'));
                };
                document.head.appendChild(s);
            });
            // NEVER keep a rejected promise here. Caching the failure meant that
            // once an import failed in a dead spot, EVERY later attempt returned
            // that same stale rejection — so walking into good signal and trying
            // again still failed, until the app was fully force-closed. Dropping
            // the handle on failure makes the next attempt a real one.
            _pdfjsReady = _pdfjsReady.catch((e) => { _pdfjsReady = null; throw e; });
            return _pdfjsReady;
        }
        async function extractReportText(file) {
            const name = (file.name || '').toLowerCase();
            if (name.endsWith('.pdf') || file.type === 'application/pdf') {
                await ensurePdfJs();
                const buf = await file.arrayBuffer();
                const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
                let text = '';
                for (let p = 1; p <= pdf.numPages; p++) {
                    const page = await pdf.getPage(p);
                    const content = await page.getTextContent();
                    let lastY = null, line = '', out = [];
                    for (const it of content.items) {
                        const y = it.transform[5];
                        if (lastY !== null && Math.abs(y - lastY) > 3) { out.push(line); line = ''; }
                        line += (line && !line.endsWith(' ') ? ' ' : '') + it.str;
                        lastY = y;
                    }
                    if (line) out.push(line);
                    text += out.join('\n') + '\n';
                }
                return text;
            }
            return await file.text();
        }

        // ---- Heuristic parser: text -> defect line items ----
        function parseReportDefects(text) {
            if (!text) return [];
            const clean = (s) => (s || '').replace(/\s+/g, ' ').trim();
            const looksLikeDefect = (s) => s && s.length >= 4 && s.length <= 300
                && /[a-zA-Z]/.test(s) && !/^\d+$/.test(s) && !/^page\s+\d+/i.test(s);
            const bulletRe = /^\s*(?:[-*•·▪◦‣]|\(?\d+[\.\):]|\(?[a-zA-Z][\.\)])\s+/;
            const lines = text.replace(/\r/g, '').split('\n');
            const items = [];
            let buf = '';
            const flush = () => { const s = clean(buf); if (looksLikeDefect(s)) items.push(s); buf = ''; };
            for (const raw of lines) {
                const line = raw.trim();
                if (!line) { flush(); continue; }
                if (bulletRe.test(raw)) { flush(); buf = line.replace(bulletRe, ''); }
                else if (buf) { buf += ' ' + line; }
                else { buf = line; }
            }
            flush();
            // Fallback: if almost nothing detected, split into sentences
            if (items.length < 2) {
                const sentences = clean(text).split(/(?<=[.;])\s+/).map(clean).filter(looksLikeDefect);
                if (sentences.length > items.length) return dedupe(sentences);
            }
            return dedupe(items);
            function dedupe(arr) { const seen = new Set(); return arr.filter(x => { const k = x.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }); }
        }

        // ===========================================================================
        //  BPI360 smart import — structured defects (location, page, trade) so the
        //  supervisor reviews + allocates instead of typing. (Spiro 2026-06-09)
        // ===========================================================================
        // Every defect imported from a report is saved with its report reference in
        // front of the description ("BPI #7 (p.3) — ..."), so a supplier's list
        // points straight back at the page. Deep-read private reports get the same
        // treatment under "Item #N", since they have no numbering of their own.
        // ONE regex for the whole app: the label is written in two places and
        // stripped in four, and they must never drift apart. (Spiro 2026-08-02)
        const REPORT_REF_RE = /^(?:BPI|Item) #(\d+)(?:\s*\(p\.(\d+)\))?\s*—\s*/;
        const reportRefWord = reportType => (reportType === 'BPI' || !reportType) ? 'BPI' : 'Item';
        const stripReportRef = s => String(s || '').replace(REPORT_REF_RE, '');
        // Split a saved description into its report reference and the defect text.
        // { label: 'BPI #7 (p.3)' | '', body: 'the defect' } — label is '' when the
        // defect was typed rather than imported.
        function splitReportRef(desc) {
            const s = String(desc || '');
            const m = s.match(REPORT_REF_RE);
            return m
                ? { label: m[0].replace(/\s*—\s*$/, '').trim(), body: s.slice(m[0].length), page: m[2] || '' }
                : { label: '', body: s, page: '' };
        }
        // Trade inference learned from the defect language in BPI final reports.
        const BPI_TRADE_RULES = [
            ['Painter',      /\bpaint|repaint|raw timber|hinge knuckle|touch ?up|overspray|paint runs?\b/i],
            ['Renderer',     /\brender|acrylic render/i],
            ['Brick Cleaner', /\bacid ?wash|brick ?clean|mortar (stain|smear|residue)/i],
            ['Site Cleaner', /\bsite (clean|rubbish|cage)|building (rubbish|waste)|debris|rubbish|builders?'?\s*material|spoil removal|grade back/i],
            ['Bricklayer',   /\bbrick|mortar|mortal|perpend|\bpier\b|weep ?hole|articulation joint|lintel/i],
            ['Plasterer',    /\bcornice|plaster|nail pop|patch (hole|the)|crack(ing|ed)? to (wall|ceiling)|set joint|sheet join|\bdip\b|bulkhead/i],
            ['Electrician',  /\bexhaust fan|light switch|power ?point|\bgpo\b|down ?light|wiring|switchboard|\btimer\b|sensor|smoke alarm|data point|\blight\b/i],
            ['Roof Plumber', /\bdownpipe|fascia|barge|gutter|fc sheet|\broof|flashing|ridge|valley/i],
            ['Drainer',      /\bsewer|storm ?water|silt pit|\bagi\b|drainage pit|stormwater pit/i],
            ['Plumber',      /\btap\b|basin|sink|toilet|\bwc\b|drain|waste|plumb|trough|grommet|\bmixer\b|spout|cistern|hand ?held shower|shower bracket|overflow pipe|\briser|grate cover|pipe penetration|no water to|garden tap/i],
            ['Tiler',        /\btile|grout|tiling/i],
            ['Waterproofer', /\bwaterproof|shower (base|fall)|puddle flange/i],
            ['Flooring',     /\bcarpet|spikes (can be )?felt|floating floor|laminate floor|vinyl plank/i],
            ['Carpenter',    /\bgripper catch|margin|architrave|skirting|\bdoor|\bgate|cabinet|cupboard|hinge|latch|handle|shelf|robe|\block\b|towel rail|towel ring|\bquads?\b|drawer|\bdraw\b|slider|flooring|manhole|screw cap|twisted|cushion stop|porch post|\bbolts?\b|chipped|vanity/i],
            ['Shower Screen', /\bshower screen|robe door|wardrobe door|sliding robe|\bmirror\b/i],
            ['Glazier',      /\bglass|glazing|window/i],
            ['Paving',       /\bpav(ing|ers?)\b/i],
            ['Concreter',    /\bdriveway|concrete|\bslab|\bpath\b|crossover/i],
            ['Caulker',      /\bcaulk|silicone|seal gap|sealant|gap between|bath hob/i],
            ['Cleaner',      /\bclean|\bsweep\b|\bvacuum\b/i],
        ];
        function classifyBpiTrade(text) {
            for (const [trade, re] of BPI_TRADE_RULES) if (re.test(text)) return trade;
            return '';
        }
        // Trade label → keywords to find a matching contractor (by its trades/name).
        const BPI_TRADE_KEYWORDS = {
            Painter:['paint'], Renderer:['render','acrylic'], Bricklayer:['brick','mason'], Plasterer:['plaster','cornice','gyprock'],
            Electrician:['electric','elec'], 'Roof Plumber':['roof','gutter','plumb'], Plumber:['plumb'], Drainer:['drain','sewer','stormwater'],
            Tiler:['tile','tiling'], Waterproofer:['waterproof'], Flooring:['floor','carpet','vinyl','laminate'],
            Carpenter:['carpen','fixing','door','cabinet','joinery','lock'],
            Glazier:['glaz','glass','window'], Concreter:['concret'], Caulker:['caulk','silicone','seal'], Cleaner:['clean'],
            'Site Cleaner':['site clean','earthmov','enviro'], 'Brick Cleaner':['brick clean','acid'],
            Insulation:['insulat','sisal','sarking','wrap','foil'],
        };
        function suggestContractorForTrade(trade) {
            const kws = BPI_TRADE_KEYWORDS[trade]; if (!kws) return null;
            const hit = db.getContractors().find(c => {
                const hay = ((c.trades || '') + ' ' + (c.name || '')).toLowerCase();
                return kws.some(k => hay.includes(k));
            });
            return hit ? hit.id : null;
        }
        // ── Framework call-up: who was actually engaged for a trade on THIS job ──
        // The Order Profile (uploaded in CH Tracker, exposed via CloudCallups)
        // lists, per job, the supplier engaged for each cost centre. We match
        // those supplier names to our contractor list and, for a given BPI trade,
        // pick the engaged contractor whose trades best fit — so the suggestion is
        // the real sub on this job, not a global keyword guess.
        function normCompanyName(s) {
            return String(s || '').toLowerCase()
                .replace(/\bt\/a\b.*$/, '')                                  // drop "t/a Trading Name" tails
                .replace(/\bpty\b|\bltd\b|\bp\/l\b|\bpl\b|\binc\b|\bco\b/g, '')
                .replace(/[^a-z0-9 ]/g, ' ')
                .replace(/\s+/g, ' ').trim();
        }
        // Bulk material suppliers / retailers. They appear as real call-up rows but
        // never rectify a defect, and their broad material catalogues keyword-match
        // many trades (e.g. Bunnings → "Carpenter") — so exclude them from
        // contractor suggestions. Extend freely; matched on the normalised name.
        const CALLUP_MATERIAL_SUPPLIERS = new Set([
            'bunnings', 'bunnings frame truss order', 'bunnings timber hardware',
            'bowens', 'bowens timber hardware', 'dahlsens', 'dahlsens building centres',
            'austral bricks', 'boral', 'boral csr bricks', 'beaumont tiles',
            'e s trading', 'e s trading discounts', 'corinthian', 'corinthian industries australia',
            'dabsand dabaco sand supply', 'css victoria the trustee for css victoria',
            'reece plumbing centres', 'hardings hardware', 'national tiles co', 'volare concepts',
            'fowles auctions', 'arc australian reinforcing company', 'hy tec industries victoria'
        ].map(normCompanyName));
        // Contractors engaged on this job (call-up supplier_name → our contractor).
        function callupContractorsForAddress(addressLid) {
            if (addressLid == null || !window.CloudCallups) return [];
            const rows = window.CloudCallups.rowsForAddress(addressLid) || [];
            if (!rows.length) return [];
            const contractors = db.getContractors();
            const byNorm = new Map();
            contractors.forEach(c => { const n = normCompanyName(c.name); if (n) byNorm.set(n, c); });
            const out = [], seen = new Set();
            for (const r of rows) {
                const n = normCompanyName(r.supplier_name || '');
                if (!n || n === 'supervisor to select') continue;            // placeholder, not a real sub
                let c = byNorm.get(n);
                if (!c) c = contractors.find(x => { const cn = normCompanyName(x.name); return cn && (cn.includes(n) || n.includes(cn)); });
                if (!c || seen.has(c.id)) continue;
                if (CALLUP_MATERIAL_SUPPLIERS.has(normCompanyName(c.name))) continue;   // supplier, not a rectifier
                seen.add(c.id); out.push({ contractor: c, costCentre: r.cost_centre || '' });
            }
            return out;
        }
        // Trade → tokens that appear in our contractors' structured CH trade
        // names. Deliberately tighter than the text classifier's keywords: matched
        // against the trade vocabulary, not loose English, so a window sub won't
        // catch a "Carpenter" defect on the word "door", nor a roofer steal a
        // "Tiler" on "Roof Tiles". Scoring breaks ties (roofer beats plumber on a
        // gutter defect via 'roof'+'gutter').
        const CALLUP_TRADE_KEYWORDS = {
            Painter: ['painter', 'painting', 'paint'],
            Renderer: ['render'],
            Bricklayer: ['bricklayer', 'brick lay'],
            Plasterer: ['plaster', 'cornice'],
            Electrician: ['electrical', 'electrician'],
            'Roof Plumber': ['roof', 'gutter', 'fascia', 'flashing', 'capping', 'downpipe'],
            // Plumber must NOT carry drainage words — they made the drainage sub
            // (TechFlow, "Sewerage & Stormwater Drains") outscore the actual
            // plumber on Plumber defects. Drainage is its own CH trade.
            Plumber: ['plumber', 'plumbing', 'gas fit', 'hot water'],
            Drainer: ['sewer', 'stormwater', 'storm water', 'drainage', 'drains', 'agi'],
            Tiler: ['floor tile', 'wall tile', 'tiles labour', 'tiling', 'tile'],
            Waterproofer: ['waterproof'],
            Flooring: ['carpet', 'floor covering', 'vinyl', 'laminate', 'timber floor'],
            Carpenter: ['carpenter', 'carpentry'],
            Glazier: ['window', 'entry frame', 'glazing', 'glazier', 'mirror', 'splashback'],
            Concreter: ['concrete', 'concretor', 'driveway'],
            Caulker: ['caulk', 'joint sealing'],
            // Cleaner = INTERIOR detailing (Kalad-style). Site Cleaner = bulk
            // site cleanup (DFO/Jumbocorp/Enviro Waste). 'clean' alone is too
            // broad (matches "Site Cleaner - OH&S Clean" too) so Cleaner needs
            // the 'site' exclude below AND Site Cleaner needs a vocabulary
            // strong enough to outscore it (Spiro 2026-07-14).
            Cleaner: ['internal clean', 'interior clean', 'int. cleaner', 'settlement clean', 'appliance clean', 'house clean', 'final clean', 'cleaner', 'cleaning', 'clean'],
            'Site Cleaner': ['site clean', 'site cage', 'site grade', 'oh&s clean', 'grade back', 'spoil removal', 'cut & fill', 'bobcat', 'waste management', 'rubbish'],
            'Brick Cleaner': ['brick clean', 'acid'],
            Insulation: ['insulation', 'sisalation', 'sarking', 'wall wrap', 'foil'],
            'Cabinet Maker': ['kitchen', 'cabinet', 'joinery'],
            'Garage Door': ['garage door'],
            Landscaper: ['landscap', 'retaining wall'],
            Supervisor: ['supervisor'],
            'Shower Screen': ['shower screen', 'robe', 'wardrobe', 'mirror'],
            Paving: ['paving', 'paver'],
            Fencing: ['fence', 'fencing'],
        };
        // Disqualifiers: matching one of these means the text can NEVER represent
        // the trade — fixes the roofing sub ("Roof Tiles") suggested as the TILER.
        const CALLUP_TRADE_EXCLUDES = { Tiler: ['roof'], Flooring: ['roof'], Cleaner: ['brick clean', 'site'],
            'Roof Plumber': ['truss', 'frame'],   // frame carpenters ("Wall Frame & Roof Trusses") are not roofers
            Concreter: ['temporary', 'silt fence'] };
        // Word-boundary prefix match: "roof" hits "Roof Clean" but NOT
        // "waterproofing" (substring matching mis-suggested the waterproofer for
        // roof-plumbing defects); "render" still hits "rendering".
        function kwMatch(hay, kw) {
            return new RegExp('\\b' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(hay);
        }
        // Keyword score for `hay` representing `trade` — 0 when a disqualifier hits.
        function tradeHayScore(hay, trade) {
            const kws = CALLUP_TRADE_KEYWORDS[trade]; if (!kws) return 0;
            const ex = CALLUP_TRADE_EXCLUDES[trade];
            if (ex && ex.some(k => kwMatch(hay, k))) return 0;
            return kws.reduce((n, k) => n + (kwMatch(hay, k) ? 1 : 0), 0);
        }
        // Suggest the called-up contractor for `trade` on the job at `addressLid`.
        // Returns null when the job has no profile or no engaged sub fits the trade
        // (a clean miss → caller falls back to learned history / the static rule).
        function suggestCallupForTrade(trade, addressLid) {
            const kws = CALLUP_TRADE_KEYWORDS[trade]; if (!kws) return null;
            const engaged = callupContractorsForAddress(addressLid);
            if (!engaged.length) return null;
            let best = null, bestScore = 0;
            for (const e of engaged) {
                const hay = ((e.contractor.trades || '') + ' ' + (e.contractor.name || '')).toLowerCase();
                const score = tradeHayScore(hay, trade);
                if (score > bestScore) { bestScore = score; best = e; }
            }
            return best ? { contractorId: best.contractor.id, costCentre: best.costCentre } : null;
        }
        // ── Called For: who ACTUALLY carried out this trade's activities here ──
        // The daily Framework Called For report names the supplier on every
        // activity line (job_called_for_archive, permanent), so it beats the
        // Order Profile — which skews to PO/material suppliers and misses many
        // supervisor-selected trades. The TRADE is matched against the ACTIVITY
        // text ("Paint Touch Ups", "Downpipe Install"), never the supplier's

            // No column gap: peel a leading location. Numbered bedrooms first
            // (any number), then the LONGEST matching known room name so specific
            // labels (e.g. "Garage Internal PA Door") win over "Garage".
            const bm = rest.match(/^((?:Master\s+)?Bedroom(?:\s*\d+)?)\b\s*/i);
            if (bm) return { location: bm[1].replace(/\s+/g, ' ').trim(), observation: rest.slice(bm[0].length).trim() };
            const low = rest.toLowerCase();
            const hit = BPI_LOCATIONS.slice().sort((a, b) => b.length - a.length).find(l => low.startsWith(l.toLowerCase()));
            if (hit) return { location: hit, observation: rest.slice(hit.length).trim() };
            return { location: '', observation: rest.trim() };
        }
        // pdf.js text per page, with column gaps preserved (big x-jump → 3 spaces)
        // and page breaks (\f) so we can record each defect's page number.
        async function extractReportTextPaged(file) {
            await ensurePdfJs();
            const buf = await file.arrayBuffer();
            const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
            let text = '';
            for (let p = 1; p <= pdf.numPages; p++) {
                const page = await pdf.getPage(p);
                const content = await page.getTextContent();
                let lastY = null, lastEndX = null, line = '', out = [];
                for (const it of content.items) {
                    const x = it.transform[4], y = it.transform[5];
                    if (lastY !== null && Math.abs(y - lastY) > 3) { out.push(line); line = ''; lastEndX = null; }
                    if (line) line += (lastEndX !== null && (x - lastEndX) > 28) ? '   ' : (line.endsWith(' ') ? '' : ' ');
                    line += it.str;
                    lastY = y; lastEndX = x + (it.width || 0);
                }
                if (line) out.push(line);
                text += out.join('\n') + '\f';
            }
            return text;
        }
        // Parse the "Report With Supporting Photos" section into structured defects.
        // Every BPI report ends with a fixed management / handover checklist:
        // "as requested by Management…", "Items not to pick:", "Materials to be
        // left on site", "Minimum of N ridge tiles", "Is this House/Unit ready for
        // Practical Completion". None of it is a defect — but it is UNNUMBERED,
        // and the parser below appends any unnumbered line to the current item, so
        // the entire block was swallowed into whichever defect happened to be last.
        // That is why the final item of every imported report carried a wall of
        // boilerplate. Fragments inside it ("12 roof tiles") can also match the
        // item pattern and fabricate phantom defects, so the parse stops dead at
        // the first marker rather than trying to filter the block line by line.
        const BPI_TAIL = /as requested by management|items not to pick|materials to be left on site|ready for a?\s*practical completion|is this (house|unit)\s*\/?\s*(house|unit)?\s*ready|minimum of \d+\s*(ridge|roof|flooring)\s*tiles|barrel code to key locks|grout samples? in plastic|caulking\s*\/?\s*gapping to shelves|marked with blue tape|touch up paint one of each colour/i;

        function parseBpiDefects(pagedText) {
            const pages = (pagedText || '').split('\f');
            const raw = [];
            let inPhotos = false;
            let tailReached = false;
            pages.forEach((pageText, pi) => {
                if (tailReached) return;                 // everything after the checklist is boilerplate
                const pageNo = pi + 1;
                if (/Report With Supporting Photos/i.test(pageText)) inPhotos = true;
                if (!inPhotos) return;
                let cur = null;
                for (const lineRaw of pageText.split('\n')) {
                    const line = lineRaw.replace(/\s+$/, '');
                    if (!line.trim()) continue;
                    // The checklist can begin part-way through a line. Keep whatever
                    // real defect text precedes it, then stop.
                    const tailAt = line.search(BPI_TAIL);
                    if (tailAt >= 0) {
                        const keep = line.slice(0, tailAt).trim();
                        if (keep && cur) cur.observation += ' ' + keep;
                        tailReached = true;
                        break;
                    }
                    if (/Email:|bookings@|www\.|Id\s+Location|Report With Supporting|^\s*Rectified\s*$/i.test(line)) continue;
                    const m = line.match(/^\s*(\d{1,3})\s+(.+)$/);
                    if (m) { if (cur) raw.push(cur); const s = splitLocObs(m[2]); cur = { id: +m[1], location: s.location, observation: s.observation, page: pageNo }; }
                    else if (cur) { cur.observation += ' ' + line.trim(); }
                }
                if (cur) raw.push(cur);
            });
            const seen = new Set(), items = [];
            for (const d of raw) {
                if (seen.has(d.id)) continue; seen.add(d.id);
                let obs = (d.observation || '').replace(/\s+/g, ' ').trim();
                // Second line of defence: if a checklist phrase still reached an
                // observation (pdf.js can reflow the block onto a defect's line),
                // truncate there rather than shipping it to the supplier.
                const cut = obs.search(BPI_TAIL);
                if (cut >= 0) obs = obs.slice(0, cut).trim();
                if (!obs || obs.length < 3) continue;
                items.push({ description: obs, location: d.location || '', page: d.page, itemNo: d.id, trade: classifyBpiTrade((d.location || '') + ' ' + obs) });
            }
            // Fallback to the generic parser if the structured pass found nothing.
            if (!items.length) return parseReportDefects(pagedText).map(s => ({ description: s, location: '', page: null, trade: classifyBpiTrade(s) }));
            return items;
        }

        // ===== BPI supporting-photo extraction =======================================
        // Port of CH Tracker's src/lib/bpiPhotos.ts (Spiro 2026-07-30) — the phone
        // and desktop imports must behave the same, so a report dropped here gets
        // its photos attached exactly as it would on the tracker.
        //
        // Every defect in the "Report With Supporting Photos" section has its photo
        // printed beside it, already inside the PDF being imported. We cut them out
        // locally: no AI call, no extra upload, nothing leaves the phone that wasn't
        // going to Supabase anyway.
        //
        // Layout in a real report (12 defects, 204/9 Grass Tree Rd): four defects
        // per page, each Tag line at y with its photo to the RIGHT, ~66pt below the
        // baseline. Photos are 600x450 natively, so the page is rendered just fine
        // enough to hit that and no finer.
        const BPI_PHOTO_TARGET_PX = 620;   // native width of a BPI report photo
        const BPI_PHOTO_MIN_PT = 40;       // smaller than this is an icon, not a photo
        // How long an extracted BPI photo is kept (Spiro 2026-07-30). Longer
        // than the 42-day default for site photos — this one is the defect's
        // evidence — but bounded. CH Tracker uses the same 60, so a report is
        // retained identically whichever app imported it.
        const BPI_PHOTO_DAYS = 60;

        // A photo belongs to the nearest Tag line at or ABOVE its vertical centre —
        // the report's reading order. Ascending sort matters: sorted the other way,
        // find() returns the TOPMOST tag and every photo on the page piles onto the
        // first defect.
        function bpiPairPhotosToTags(tags, photos) {
            const out = new Map();
            if (!tags.length) return out;
            const byY = tags.slice().sort((a, b) => a.y - b.y);
            for (const p of photos.slice().sort((a, b) => b.yBottom - a.yBottom)) {
                const centre = p.yBottom + p.h / 2;
                const owner = byY.find(t => t.y >= centre);
                if (!owner) continue;
                const arr = out.get(owner.itemNo);
                if (arr) arr.push(p); else out.set(owner.itemNo, [p]);
            }
            return out;
        }

        // ---- Anchor positions (deep read) ----------------------------------------
        // A private report has no Tag numbers, so there's nothing on the page that
        // says "defect 7 starts here". Deep read asks Claude for a verbatim snippet
        // (`anchor`) off the line each defect begins on; finding that snippet in the
        // page's text layer gives us the same {itemNo, y} the BPI Tag finder
        // produces, so ONE pairing routine serves both. (Spiro 2026-08-02)

        // How many pages past its own a defect can still claim photos. Covers
        // "photos sit under the paragraph and spill onto the next page" without
        // letting a photo appendix 15 pages later pile onto the last defect.
        const ANCHOR_CARRY_PAGES = 2;
        const anchorNorm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

        // Page text as {y, text} lines, top of the page first.
        function pageLines(items) {
            const byY = new Map();
            for (const it of items) {
                const y = Math.round(it.transform[5]);
                const row = byY.get(y);
                if (row) row.push({ x: it.transform[4], s: it.str });
                else byY.set(y, [{ x: it.transform[4], s: it.str }]);
            }
            const out = [];
            for (const [y, arr] of byY) {
                out.push({ y, text: arr.sort((a, b) => a.x - b.x).map(o => o.s).join(' ').replace(/\s+/g, ' ').trim() });
            }
            return out.sort((a, b) => b.y - a.y);   // PDF y counts UP, so descending = reading order
        }

        // Locate `wanted` ({itemNo, anchor}) on one page. Anchors come back from
        // the model as prose, so matching is forgiving: punctuation and case are
        // stripped, and a snippet that wrapped mid-line still matches on its first
        // few words. Each line is claimed once, so two similarly-worded defects
        // can't land on the same line.
        function anchorPositions(items, wanted) {
            const lines = pageLines(items).map(l => ({ y: l.y, norm: anchorNorm(l.text), taken: false }));
            const out = [];
            for (const w of wanted) {
                const full = anchorNorm(w.anchor);
                if (!full) continue;
                const words = full.split(' ');
                let hit = null;
                // Whole snippet first, then shorter prefixes down to three words.
                for (let n = words.length; n >= 3 && !hit; n--) {
                    const probe = words.slice(0, n).join(' ');
                    if (probe.length < 10) break;
                    hit = lines.find(l => !l.taken && l.norm.includes(probe));
                }
                if (hit) { hit.taken = true; out.push({ itemNo: w.itemNo, y: hit.y }); }
            }
            // A page whose text layer defeated every anchor, but which holds exactly
            // one defect, can only mean one thing — put it at the top so the photos
            // below it still attach. With two or more we'd be guessing, so we don't.
            if (!out.length && wanted.length === 1 && lines.length) {
                out.push({ itemNo: wanted[0].itemNo, y: lines[0].y });
            }
            return out;
        }

        // Tag lines on one page. Mirrors parseBpiDefects's `<Id> <rest>` line rule
        // so the two agree on what counts as a Tag.
        function bpiTagPositions(items) {
            const byY = new Map();
            for (const it of items) {
                const y = Math.round(it.transform[5]);
                const row = byY.get(y);
                if (row) row.push({ x: it.transform[4], s: it.str });
                else byY.set(y, [{ x: it.transform[4], s: it.str }]);
            }
            const out = [];
            for (const [y, arr] of byY) {
                const line = arr.sort((a, b) => a.x - b.x).map(o => o.s).join(' ').replace(/\s+/g, ' ').trim();
                const m = line.match(/^(\d{1,3})\s+\S/);
                if (m) out.push({ itemNo: +m[1], y });
            }
            return out;
        }

        // Image placements from the operator list. pdf.js gives placements as a
        // running transform, so the CTM has to be tracked through save/restore.
        function bpiPhotoRects(ops, OPS) {
            const mul = (a, b) => [
                a[0] * b[0] + a[2] * b[1], a[1] * b[0] + a[3] * b[1],
                a[0] * b[2] + a[2] * b[3], a[1] * b[2] + a[3] * b[3],
                a[0] * b[4] + a[2] * b[5] + a[4], a[1] * b[4] + a[3] * b[5] + a[5],
            ];
            let ctm = [1, 0, 0, 1, 0, 0];
            const stack = [], out = [];
            for (let i = 0; i < ops.fnArray.length; i++) {
                const fn = ops.fnArray[i];
                if (fn === OPS.save) stack.push(ctm.slice());
                else if (fn === OPS.restore) ctm = stack.pop() || [1, 0, 0, 1, 0, 0];
                else if (fn === OPS.transform) ctm = mul(ctm, ops.argsArray[i]);
                else if (fn === OPS.paintImageXObject || fn === OPS.paintJpegXObject || fn === OPS.paintInlineImageXObject) {
                    const w = Math.abs(ctm[0]), h = Math.abs(ctm[3]);
                    if (w >= BPI_PHOTO_MIN_PT && h >= BPI_PHOTO_MIN_PT) out.push({ x: ctm[4], yBottom: ctm[5], w: w, h: h });
                }
            }
            return out;
        }

        // Cut every supporting photo out of the report, keyed by item number.
        // Resolves to Map<itemNo, [Blob]>.
        //
        // BPI mode: only pages the parser placed a defect on are considered, and
        // the anchor is the Tag number printed beside the photo — so the cover logo
        // can't produce a stray match.
        //
        // Anchor mode (deep read, private reports): the anchor is a verbatim
        // snippet located in the page text. Every page from the first defect
        // onwards is scanned, because a private report routinely prints a cluster
        // of photos below a paragraph and lets them run onto the next page — those
        // photos carry back to the last defect above them (bounded by
        // ANCHOR_CARRY_PAGES so a late photo appendix can't pile onto one item).
        async function extractReportPhotos(file, defects, onProgress, mode) {
            const out = new Map();
            if (!window.pdfjsLib) return out;
            const anchored = mode === 'anchor';
            const OPS = window.pdfjsLib.OPS;
            const wantByPage = new Map();
            for (const d of defects) {
                if (!d || d.page == null || d.itemNo == null) continue;
                if (anchored && !d.anchor) continue;
                const s = wantByPage.get(d.page);
                if (s) s.push(d); else wantByPage.set(d.page, [d]);
            }
            if (!wantByPage.size) return out;
            const firstPage = Math.min.apply(null, [...wantByPage.keys()]);
            const lastPage = Math.max.apply(null, [...wantByPage.keys()]) + ANCHOR_CARRY_PAGES;
            const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
            let carried = null;         // last resolved anchor, for photos on a later page
            let carriedPage = 0;
            for (let p = 1; p <= pdf.numPages; p++) {
                if (onProgress) { try { onProgress(p, pdf.numPages); } catch (e) {} }
                const want = wantByPage.get(p);
                if (anchored ? (p < firstPage || p > lastPage) : (!want || !want.length)) continue;
                const page = await pdf.getPage(p);
                const textItems = (await page.getTextContent()).items;
                let tags;
                if (anchored) {
                    tags = anchorPositions(textItems, want || []);
                    // Photos above the first anchor on this page (or on a page with
                    // no anchors at all) belong to the last defect seen — the
                    // report ran its photo cluster past a page break. Sitting it
                    // above the page gives it every photo up to the next anchor.
                    if (carried && p - carriedPage <= ANCHOR_CARRY_PAGES) {
                        tags = tags.concat([{ itemNo: carried, y: Infinity }]);
                    }
                    // Carry the BOTTOM-most anchor on this page (smallest y —
                    // PDF y counts up), i.e. the last defect in reading order.
                    const own = tags.filter(t => t.y !== Infinity).sort((a, b) => a.y - b.y);
                    if (own.length) { carried = own[0].itemNo; carriedPage = p; }
                } else {
                    const ids = new Set((want || []).map(d => d.itemNo));
                    tags = bpiTagPositions(textItems).filter(t => ids.has(t.itemNo));
                }
                if (!tags.length) continue;
                const rects = bpiPhotoRects(await page.getOperatorList(), OPS);
                if (!rects.length) continue;
                const pairs = bpiPairPhotosToTags(tags, rects);
                if (!pairs.size) continue;
                const widest = Math.max.apply(null, rects.map(r => r.w));
                const scale = Math.min(6, Math.max(1.5, BPI_PHOTO_TARGET_PX / widest));
                const viewport = page.getViewport({ scale: scale });
                const canvas = document.createElement('canvas');
                canvas.width = Math.ceil(viewport.width);
                canvas.height = Math.ceil(viewport.height);
                const ctx = canvas.getContext('2d');
                if (!ctx) continue;
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                for (const [itemNo, list] of pairs) {
                    for (const r of list) {
                        // PDF y counts up from the bottom; canvas y counts down.
                        const sx = Math.max(0, Math.round(r.x * scale));
                        const sy = Math.max(0, Math.round((viewport.height / scale - (r.yBottom + r.h)) * scale));
                        const sw = Math.min(canvas.width - sx, Math.round(r.w * scale));
                        const sh = Math.min(canvas.height - sy, Math.round(r.h * scale));
                        if (sw < 8 || sh < 8) continue;
                        const crop = document.createElement('canvas');
                        crop.width = sw; crop.height = sh;
                        crop.getContext('2d').drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
                        const blob = await new Promise(res => crop.toBlob(res, 'image/jpeg', 0.82));
                        if (!blob) continue;
                        const arr = out.get(itemNo);
                        if (arr) arr.push(blob); else out.set(itemNo, [blob]);
                    }
                }
                canvas.width = 0; canvas.height = 0;   // release before the next page
            }
            return out;
        }
        // Find the matching property from the report header "Lot N - Street Suburb"
        // and/or the PDF filename (BPI names embed lot + street, e.g.
        // "(1st_Inspection)_1403_20_Kobi_Street_Tarneit.pdf"), which survives even
        // when pdf.js fragments the extracted text.
        let _amftDbg = '';   // TEMP diagnostic, shown in the review meta line
        function matchAddressFromText(text, fileName) {
            const addrs = db.getAddresses();
            const norm = s => (s || '').toLowerCase().replace(/[_\-]+/g, ' ').replace(/\s+/g, ' ');
            const low = norm((fileName || '') + ' ' + (text || ''));
            const squish = low.replace(/[^a-z0-9]+/g, '');   // tolerant of "L ot 14 03"-style fragmentation
            let result = null, via = '';
            // 1) Explicit "Lot NNNN" anywhere (incl. fragmented).
            const lotM = low.match(/\blot\s*(\d+[a-z]?)\b/) || squish.match(/lot(\d{2,5}[a-z]?)/);
            if (lotM) {
                const lot = lotM[1];
                const hit = addrs.find(a => { const s = norm(a.street); return s.includes('lot ' + lot) || s.split(/[\s,()]+/).includes(lot); });
                if (hit) { result = hit.id; via = 'lot'; }
            }
            // 2) Score every address on its lot number / street name / house number
            //    appearing as tokens in filename+text — needs no "Lot" keyword at all.
            if (result == null) {
                const toks = new Set(low.split(/[^a-z0-9]+/).filter(Boolean));
                let best = null, ties = 0;
                for (const a of addrs) {
                    const s = norm(a.street);                                           // e.g. "lot 1403, (20) kobi st"
                    if (!s) continue;
                    const lotA = (s.match(/^lot\s*(\d+[a-z]?)\b/) || [])[1];            // "1403"
                    const rest = s.replace(/^lot\s*\w+,?\s*/, '').trim();               // "(20) kobi st"
                    const houseNum = (rest.match(/\d+/) || [])[0];                      // "20"
                    const nameTok = rest.replace(/^[()\d\s]+/, '').split(/\s+/)[0];     // "kobi"
                    let score = 0;
                    if (nameTok && nameTok.length >= 4 && (toks.has(nameTok) || squish.includes(nameTok))) score += 2;
                    if (lotA && (toks.has(lotA) || squish.includes('lot' + lotA))) score += 2;
                    if (houseNum && toks.has(houseNum)) score += 1;
                    if (score < 2) continue;
                    if (!best || score > best.score) { best = { id: a.id, score }; ties = 1; }
                    else if (score === best.score) ties++;
                }
                // A tie (e.g. 10 jobs on the same street, name-only match) is
                // ambiguous — leave unmatched rather than pick the wrong job.
                if (best && ties === 1) { result = best.id; via = 'score'; }
            }
            const matchedStreet = result != null ? ((db.getAddress(result) || {}).street || '?') : '—';
            _amftDbg = 'addrs=' + addrs.length + ' fn=' + (fileName ? 'Y' : 'N') + ' lot=' + (lotM ? lotM[1] : 'NONE') + ' match=' + (result != null ? (via + ':' + matchedStreet) : 'NULL');
            return result;
        }

        // ---- Step 2: review & assign each item ----
        let _review = null;
        function startReportReview(items, reportName, reportType, matchedAddressId, reportFile, opts) {
            const o = opts || {};
            _review = { items, index: 0, saved: 0, reportName, reportType: reportType || 'BPI', lastAddressId: matchedAddressId || null, reportFile: reportFile || null, photos: new Map(), photoNote: '', layout: o.layout || '', photoMode: o.photoMode || 'bpi' };
            buildBpiLearning();   // learn from assignment history before suggesting
            renderReviewItem();
            // Pull each defect's supporting photo out of the report in the
            // background — the review is usable immediately and photos appear as
            // they land. Best-effort: a report we can't read photos from still
            // imports its defects (Spiro 2026-07-30, parity with CH Tracker).
            if (reportFile) {
                const forReview = _review;
                (async () => {
                    try {
                        forReview.photoNote = 'reading photos…';
                        if (_review === forReview) renderReviewItem();
                        const map = await extractReportPhotos(reportFile, items, (p, of) => {
                            forReview.photoNote = 'reading photos… page ' + p + '/' + of;
                            if (_review === forReview && !_rvIsBusyEditing()) renderReviewItem();
                        }, forReview.photoMode);
                        forReview.photos = map;
                        let n = 0; for (const [, v] of map) n += v.length;
                        forReview.photoNote = n ? (n + ' report photo' + (n === 1 ? '' : 's') + ' found') : '';
                        if (_review === forReview && !_rvIsBusyEditing()) renderReviewItem();
                    } catch (e) {
                        forReview.photoNote = '';
                        console.warn('[BPI] photo extraction failed', e);
                    }
                })();
            }
        }
        // Re-rendering the review screen mid-edit would blow away whatever is
        // half-typed in the description / contractor boxes, so the photo pass
        // holds off while a field has focus. The final render still lands when
        // the item is saved and the next one is drawn.
        function _rvIsBusyEditing() {
            const a = document.activeElement;
            return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT'));
        }
        // Blob URLs for the review screen's photo previews. A long report
        // re-renders per item, so each pass releases the previous item's URLs
        // rather than leaking one per defect.
        let _rvPhotoUrls = [];
        function _rvRevokePhotoUrls() {
            for (const u of _rvPhotoUrls) { try { URL.revokeObjectURL(u); } catch (e) {} }
            _rvPhotoUrls = [];
        }
        // Searchable combobox for the review screen's Address / Contractor pickers.
        // Writes the chosen id into the hidden #rv-<kind> input that save reads.
        // Manager: purge ALL defects (cloud + this phone) — for clearing test
        // data. Local-first means a cloud-only delete is undone by this phone
        // re-uploading; CloudDefects.purgeAll wipes both so it sticks.
        async function clearAllDefects() {
            if (!window.CloudDefects) { showToast('Log in first', true); return; }
            if (!confirm('⚠️ Delete ALL defects from EVERY job — both the cloud and this phone?\n\nThis is for clearing test data. A recoverable copy is archived.')) return;
            if (!confirm('This removes every defect everywhere. Continue?')) return;
            showToast('Clearing all defects…');
            const r = await window.CloudDefects.purgeAll();
            if (r && r.ok) { showToast('All defects cleared'); render(); }
            else showToast('Clear failed: ' + ((r && r.error) || 'unknown'), true);
        }
        // Collapse/expand the Assignable Trades list in Settings.
        function toggleTradesExpanded() { state.tradesExpanded = !state.tradesExpanded; render(); }
        // Manager toggles a trade option on/off (Settings → Assignable Trades).
        async function toggleTradeActive(legacyId, active) {
            if (!window.CloudContractors) { showToast('Log in to change this', true); return; }
            const ok = await window.CloudContractors.setTradeActive(legacyId, active);
            if (ok) { render(); showToast(active ? 'Trade enabled' : 'Trade disabled'); }
            else showToast('Could not update — try again', true);
        }
        // Flip the BPI-review contractor picker between real contractors and the
        // trade placeholders, preserving any in-progress description/location edit.
        function setAssignMode(trade) {
            state.assignByTrade = !!trade;
            if (_review) {
                const cur = _review.items[_review.index];
                if (cur && typeof cur === 'object') {
                    const dEl = document.getElementById('rv-desc'), lEl = document.getElementById('rv-location');
                    if (dEl) cur.description = dEl.value;
                    if (lEl) cur.location = lEl.value;
                }
                renderReviewItem();
            }
        }
        function rvCombo(kind) {
            const input = document.getElementById('rv-' + kind + '-input');
            const hidden = document.getElementById('rv-' + kind);
            const list = document.getElementById('rv-' + kind + '-list');

                if (t.dup) lines.push(`• ${t.dup} already on the list, left as ${t.dup === 1 ? 'it is' : 'they are'}`);
                if (!t.added) lines.push('', 'Nothing new was added — every item was already on this job.');
                alert(lines.join('\n'));
            } else {
                showToast(r.saved > 0 ? `Imported ${r.saved} defect(s) from the report` : 'No defects saved');
            }
            render();
            _review = null;
        }

        function reportFilteredDefects(o) {
            let list = db.data.defects.slice();
            if (o.addressIds && o.addressIds.length) list = list.filter(d => o.addressIds.includes(d.addressId));
            if (o.contractorIds && o.contractorIds.length) list = list.filter(d => o.contractorIds.includes(d.contractorId));
            if (o.tradeIds && o.tradeIds.length) {
                // Match a defect's contractor to the wanted trades via its trade
                // links OR — for a "Trade" placeholder contractor — by name, so a
                // sub with no trade link isn't silently dropped from a trade report.
                const wantNames = new Set(o.tradeIds.map(id => (db.data.trades.find(t => t.id === id) || {}).name).filter(Boolean));
                list = list.filter(d => {
                    const c = db.getContractor(d.contractorId);
                    if (!c) return false;
                    if ((c.tradeIds || []).some(tid => o.tradeIds.includes(tid))) return true;
                    if (c.isTradePlaceholder && wantNames.has(c.name)) return true;
                    return false;
                });
            }
            if (o.statuses && o.statuses.length) list = list.filter(d => o.statuses.includes(defectStatusOf(d)));
            if (o.from) list = list.filter(d => d.createdAt && d.createdAt.slice(0, 10) >= o.from);
            if (o.to) list = list.filter(d => d.createdAt && d.createdAt.slice(0, 10) <= o.to);
            return list;
        }

        // Trade bucket a defect belongs to, for grouping the PDF report. A trade
        // placeholder IS the trade; a real sub uses its primary linked trade name;
        // otherwise it falls back to the sub's own name (so it still groups), or
        // "Unassigned". This is what makes Painter/Plumbing/Electrical items sit
        // together and combine in the report (#7).
        function defectTradeKey(d) {
            const c = db.getContractor(d.contractorId);
            if (!c) return 'Unassigned';
            if (c.isTradePlaceholder) return c.name;
            if (c.trades && c.trades !== 'No Trade Assigned') return c.trades.split(',')[0].trim();
            return c.name || 'Unassigned';
        }
