        .defect-item.row-open .photo-btn,
        .defect-item.row-open .order-btn,
        .defect-item.row-open .edit-btn { font-size: 19px !important; padding: 4px 6px !important; }
        .defect-item.row-open .loc-btn { opacity: 1; }
        .defect-item.row-open .photo-count { font-size: 11px !important; }
        /* 🛒 Order — the fourth control on an open row. Dimmed until it's on the
           shopping list, the same tell 📍 uses for "no location set", so the
           strip reads at a glance without a label. Four icons at 22px gap still
           fit a 320px phone; the strip is full width, not competing with text. */
        .order-btn { opacity: .45; }
        .order-btn.is-needed, .order-btn.is-ordered, .order-btn.is-done { opacity: 1; }
        /* ── SHOPPING LIST (Spiro 2026-08-02) ────────────────────────────────
           Read in a hardware store, one-handed, often in poor light. So: a big
           tap target that BOTH shows the state and advances it, the item's own
           wording at full size, and the job/supplier underneath in small text.
           Nothing here is an icon-only control — the supervisor is not looking
           at the screen while they're looking at a shelf. */
        .shop-count { padding: 10px 20px 2px; font-size: 13px; color: var(--text-secondary); }
        .shop-addr {
            display: flex; align-items: center; gap: 8px;
            cursor: pointer;
        }
        .shop-addr-n {
            flex-shrink: 0; min-width: 22px; padding: 1px 7px;
            border-radius: 10px; background: var(--bg-secondary);
            color: var(--text-secondary); font-size: 12px; font-weight: 700; text-align: center;
        }
        .shop-item {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 9px 8px 9px 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .shop-item:last-child { border-bottom: none; }
        .shop-state {
            flex: 0 0 auto; width: 76px;
            display: flex; flex-direction: column; align-items: center; gap: 1px;
            padding: 6px 2px; border: 1px solid var(--border-color); border-radius: 10px;
            background: var(--bg-secondary); color: var(--text-secondary);
            font-size: 11px; line-height: 1.2; cursor: pointer;
        }
        .shop-item.is-ordered .shop-state { border-color: var(--blue); color: var(--blue); font-weight: 700; }
        .shop-ico { font-size: 17px; line-height: 1; }
        .shop-body { flex: 1 1 auto; min-width: 0; padding-top: 2px; }
        .shop-desc { font-size: 15px; line-height: 1.35; word-break: break-word; }
        .shop-sub { margin-top: 3px; font-size: 12px; color: var(--text-secondary); }
        .shop-x {
            flex: 0 0 auto; background: none; border: none; cursor: pointer;
            padding: 4px 6px; font-size: 12px; color: var(--text-secondary); opacity: .5;
        }
        /* Home-screen entry point, matching the Reports links it sits above. */
        .shop-home {
            display: flex; align-items: center; gap: 10px;
            width: 100%; box-sizing: border-box;
            padding: 13px 14px; margin-bottom: 18px;
            border: 1px solid var(--brd, rgba(128,128,128,.25)); border-radius: 10px;
            background: var(--bg-primary); color: var(--text-primary);
            font-size: 15px; text-align: left; cursor: pointer;
        }
        .shop-home .shop-home-n {
            margin-left: auto; flex-shrink: 0;
            min-width: 22px; padding: 1px 8px; border-radius: 10px;
            background: #FF4D4F; color: #fff; font-size: 12px; font-weight: 700; text-align: center;
        }
        .shop-home .shop-home-n.zero { background: var(--bg-secondary); color: var(--text-secondary); }

        /* Location picker grid */
        .loc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .loc-opt { padding: 11px 10px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-secondary); color: var(--text-primary); font-size: 14px; cursor: pointer; text-align: left; }
        .loc-opt.sel { border-color: var(--blue); color: var(--blue); font-weight: 700; }
        /* Title left-aligned so the F1 theme picker doesn't cover it */
        .app-header .header-title { flex: 1; text-align: left; }
        /* floating F1 picker removed — no reserved header space needed */

        /* Location pin + camera share the top line; the description gets the
           full width on its own line below — maximises text room. */
        .row-loc-btn {
            order: 1; flex: 0 0 auto;
            border: none; background: transparent; cursor: pointer;
            font-size: 12px; line-height: 1.2; padding: 0 2px;

        .row-loc-btn.has-loc { opacity: 1; }
        .row-loc-ph { color: var(--text-secondary); font-weight: 600; }
        .row-loc-lbl { font-size: 12px; color: var(--blue); font-weight: 700; }

                    this.data = JSON.parse(stored);
                }
                this.raiseDefectIdWatermark();
            }

            // Push the id high-water mark up to the highest defect id we currently
            // hold. Called on load and on every save, so the mark is already ahead
            // of a defect BEFORE it can be deleted — otherwise deleting the highest
            // one lets max(existing)+1 hand its id straight to the next new defect.
            raiseDefectIdWatermark() {
                try {
                    const maxId = (this.data.defects || []).reduce(
                        (m, d) => (Number(d.id) > m ? Number(d.id) : m), 0);
                    const hw = Number(localStorage.getItem('dm_defect_id_hw')) || 0;
                    if (maxId > hw) localStorage.setItem('dm_defect_id_hw', String(maxId));
                } catch (e) { /* storage unavailable — fall back to max+1 */ }
            }

            save() {
                this.raiseDefectIdWatermark();

                    localStorage.setItem('defectTrackerDB', JSON.stringify(this.data));

                    // well succeed, but it will NOT survive a reload — so say so
                    // loudly instead of failing silently, which is what "I saved it
                    // and it disappeared" looks like from the site.
                    this.lastSaveFailed = true;
                    console.error('[db.save] localStorage write failed', e);

            // Address operations
            getAddresses() {
                return this.data.addresses.sort((a, b) => 
                    a.street.localeCompare(b.street)
                );
            }

            getAddress(id) {
                return this.data.addresses.find(a => a.id === id);
            }

            addAddress(address) {
                // Addresses now come from CH Tracker jobs (read-only) so the two
                // apps never double up. Try to match what the user typed to an
                // existing job; otherwise tell them to add it in CH Tracker.
                const q = `${address.street || ''} ${address.suburb || ''} ${address.propertyNumber || ''}`.toLowerCase();
                const tokens = q.split(/\s+/).filter(Boolean);
                const match = this.data.addresses.find(a => {
                    const hay = `${a.street} ${a.suburb} ${a.propertyNumber || ''}`.toLowerCase();
                    return tokens.length && tokens.every(t => hay.includes(t));
                });
                if (match) return match;
                if (typeof showToast === 'function') {
                    showToast('That property isn’t a CH Tracker job — add it there first, then pick it here.', true);
                }
                return null;
            }

            deleteAddress(id) {
                const defectCount = this.data.defects.filter(d => d.addressId === id && !d.completed).length;
                if (defectCount > 0) {
                    return { success: false, message: `Cannot delete. ${defectCount} active defects at this address.` };
                }
                this.data.addresses = this.data.addresses.filter(a => a.id !== id);
                this.save();
                return { success: true };
            }

            // Contractor operations
            getContractors() {
                return this.data.contractors.sort((a, b) =>
                    a.name.localeCompare(b.name)
                );
            }

            // The contractor row for a job's current supervisor, or null. Used so
            // an unselected supplier files under the supervisor instead of
            // "Unassigned". supervisorName arrives as "Last, First" from CH Tracker
            // — try both that and the "First Last" form against the contractor list.
            supervisorContractorIdFor(addressId) {
                const addr = this.getAddress(addressId);
                const rawName = addr && addr.supervisorName;
                if (!rawName) return null;
                const displayName = rawName.includes(',')
                    ? rawName.split(',').reverse().map(s => s.trim()).join(' ')
                    : rawName;
                const lc = (s) => (s || '').toLowerCase();
                const sup = this.getContractors().find(c =>
                    lc(c.name) === lc(displayName) || lc(c.name) === lc(rawName));
                return sup ? sup.id : null;
            }

            getContractor(id) {
                return this.data.contractors.find(c => c.id === id);
            }

            addContractor(contractor) {
                const id = Math.max(0, ...this.data.contractors.map(c => c.id)) + 1;
                
                // Handle tradeIds as array
                const tradeIds = Array.isArray(contractor.tradeIds) ? contractor.tradeIds : 
                                contractor.tradeIds ? [contractor.tradeIds] : [];
                
                // Build trades string
                const trades = tradeIds.map(tid => {
                    const trade = this.data.trades.find(t => t.id === tid);
                    return trade ? trade.name : '';
                }).filter(Boolean).join(', ') || 'No Trade Assigned';
                
                const newContractor = {
                    id,
                    name: contractor.name,
                    email: contractor.email || '',
                    phone: contractor.phone || '',
                    tradeIds,
                    trades,
                    // Sharing: managers create team-wide contractors; supervisors
                    // create ones private to themselves until a manager shares them.
                    isShared: contractor.isShared !== false,
                    addedBy: contractor.addedBy || null
                };
                this.data.contractors.push(newContractor);
                this.save();
                return newContractor;
            }

            deleteContractor(id) {
                const defectCount = this.data.defects.filter(d => d.contractorId === id && !d.completed).length;
                if (defectCount > 0) {
                    return { success: false, message: `Cannot delete. ${defectCount} active defects for this contractor.` };
                }
                this.data.contractors = this.data.contractors.filter(c => c.id !== id);
                this.save();
                return { success: true };
            }

            // Trade operations
            addTrade(trade) {
                const id = Math.max(0, ...this.data.trades.map(t => t.id)) + 1;
                const newTrade = { 
                    id, 
                    name: trade.name, 
                    code: trade.code || '',
                    hidden: trade.hidden || false 
                };
                this.data.trades.push(newTrade);
                this.save();
                return newTrade;
            }

            getTrades(includeHidden = true) {
                if (includeHidden) {
                    return this.data.trades;
                }
                return this.data.trades.filter(t => !t.hidden);
            }

            hideTradeById(id) {
                const trade = this.data.trades.find(t => t.id === id);
                if (trade) {
                    trade.hidden = true;
                    this.save();
                }
                return trade;
            }

            unhideTradeById(id) {
                const trade = this.data.trades.find(t => t.id === id);
                if (trade) {
                    trade.hidden = false;
                    this.save();
                }
                return trade;
            }

            deleteTrade(id) {
                const contractorCount = this.data.contractors.filter(c => c.tradeId === id).length;
                if (contractorCount > 0) {
                    return { success: false, message: `Cannot delete. ${contractorCount} contractors assigned to this trade.` };
                }
                this.data.trades = this.data.trades.filter(t => t.id !== id);
                this.save();
                return { success: true };
            }

            // Defect operations
            getDefects(filters = {}) {
                let defects = this.data.defects.filter(d => !d.completed);
                
                if (filters.addressId) {
                    defects = defects.filter(d => d.addressId === filters.addressId);
                }
                
                if (filters.contractorId) {
                    defects = defects.filter(d => d.contractorId === filters.contractorId);
                }
                
                if (filters.contractorIds && filters.contractorIds.length > 0) {
                    defects = defects.filter(d => filters.contractorIds.includes(d.contractorId));
                }

                // Enrich with address and contractor info
                return defects.map(d => ({
                    ...d,
                    address: this.getAddress(d.addressId),
                    contractor: this.getContractor(d.contractorId)
                }));
            }

            getDefectsByAddress(filters = {}) {
                const defects = this.getDefects(filters);
                const grouped = {};
                
                defects.forEach(defect => {
                    const addressKey = defect.addressId;
                    if (!grouped[addressKey]) {
                        grouped[addressKey] = {
                            address: defect.address,
                            defects: []
                        };
                    }
                    grouped[addressKey].defects.push(defect);
                });

                // Sort by street name
                return Object.values(grouped).sort((a, b) => 
                    a.address.street.localeCompare(b.address.street)
                );
            }

            // Allocate a defect id that is NEVER reused on this device.
            //
            // This used to be max(existing id) + 1, which recycles: delete the
            // highest defect and the next new one inherits its id. That is not a
            // cosmetic problem — the id is the `legacy_id` the cloud upserts on,
            // so a recycled id could (a) match a 60-day delete tombstone and get
            // the brand-new defect purged seconds after it saved, and (b) collide
            // with an existing cloud row and overwrite it.
            //
            // A persisted high-water mark keeps ids moving forward even after
            // deletions. Falls back to the old behaviour if storage is unusable.
            nextDefectId() {
                const maxExisting = (this.data.defects || []).reduce(
                    (m, d) => (Number(d.id) > m ? Number(d.id) : m), 0);
                let hw = 0;
                try { hw = Number(localStorage.getItem('dm_defect_id_hw')) || 0; } catch (e) {}
                const id = Math.max(maxExisting, hw) + 1;
                try { localStorage.setItem('dm_defect_id_hw', String(id)); } catch (e) {}
                return id;
            }

            // opts.matchCompleted — also match COMPLETED defects in the duplicate
            // check below. Off by default (a closed item genuinely can recur and
            // must be re-raisable); on for re-importing a source document, where
            // an identical line is never a new occurrence, only the same line
            // read twice. See the call site in the BPI review save handler.
            addDefect(defect, opts) {
                // Duplicate guard (root-cause fix for items "reappearing"): if a
                // NON-completed defect with the same address + description already
                // exists, return it instead of creating a second copy. A double-
                // tap on Save, or re-importing the same source, used to add the
                // item again under a fresh id — and because each copy had its own
                // legacy id, the cloud's legacy-id upsert never merged them, so the
                // list doubled up. Completed defects are NOT matched, so a genuine
                // re-occurrence of a closed item can still be raised again.
                // The match is scoped to the SUPPLIER as well as the address: the
                // same wording routinely applies to two different trades on one job
                // ("Touch up paint to hallway" for the painter AND the plasterer).
                // Matching on address+description alone swallowed the second one and
                // handed back the first supplier's defect, so the work never reached
                // the trade it was raised against.
                // No supplier picked → file it under the job's current supervisor
                // (their contractor row) rather than leaving it "Unassigned".
                // Resolved BEFORE the duplicate check so both sides of the
                // comparison carry the same contractor — otherwise a double-tap on
                // an unassigned entry would compare null against the supervisor id
                // and slip through as a second copy.
                if (defect.contractorId == null) {
                    const supId = this.supervisorContractorIdFor(defect.addressId);
                    if (supId != null) { defect.contractorId = supId; defect.unassigned = false; }
                }
                const norm = (s) => (s || '').trim().replace(/\s+/g, ' ').toLowerCase();
                const sameContractor = (a, b) =>
                    (a == null ? '' : String(a)) === (b == null ? '' : String(b));
                // Completed rows are skipped UNLESS the caller is re-reading a
                // source document (opts.matchCompleted). That exemption is what
                // doubled Band Street: its 32 items had all been marked complete,
                // so on the next import of the same report NOTHING matched and 32
                // fresh copies were created — each with its own legacy id, which
                // the cloud's legacy-id upsert can never merge back. The guard was
                // strongest exactly when it was needed least, and absent once a
                // list had been worked through (Spiro 2026-07-30).
                const matchCompleted = !!(opts && opts.matchCompleted);
                const dup = (this.data.defects || []).find(d =>
                    d.addressId === defect.addressId &&
                    norm(d.description) === norm(defect.description) &&
                    sameContractor(d.contractorId, defect.contractorId) &&
                    (matchCompleted || (d.status !== 'completed' && !d.completed))
                );
                // Transient flag on the manager (NOT on the defect row) so callers can
                // report "skipped" accurately without it reaching localStorage or the
                // cloud sync diff.
                this.lastAddWasDuplicate = !!dup;
                if (dup) {
                    // opts.quiet: the report review reports the outcome itself —
                    // it distinguishes "skipped" from "re-opened", which this
                    // can't. Two toasts fighting over one item is worse than none.
                    if (!(opts && opts.quiet)) {
                        try { if (typeof showToast === 'function') showToast('Already on the list — duplicate skipped'); } catch (e) {}
                    }
                    return dup;
                }
                const id = this.nextDefectId();
                const newDefect = { id, status: 'open', ...defect, completed: false };
                this.data.defects.push(newDefect);
                this.save();
                return newDefect;
            }

            setDefectStatus(id, status) {
                const defect = this.data.defects.find(d => d.id === id);
                if (defect) {
                    defect.status = status;
                    defect.completed = (status === 'completed');
                    this.save();
                }
            }

            setDefectLocation(id, location) {
                const defect = this.data.defects.find(d => d.id === id);
                if (defect) { defect.location = location; this.save(); }
            }

            // Materials the SUPERVISOR has to source before the trade can finish.
            // '' | 'needed' | 'ordered' | 'done'. Kept ON the defect rather than in
            // a separate list, so it can never drift out of sync with the work it
            // belongs to — completing the defect takes it off the shopping list for
            // free. (Spiro 2026-08-02)
            setDefectOrder(id, orderStatus) {
                const defect = this.data.defects.find(d => d.id === id);
                if (!defect) return null;
                defect.orderStatus = orderStatus || '';
                defect.lastUpdateAt = new Date().toISOString();
                this.save();
                return defect;
            }

            // Edit an existing defect's description and/or supplier. contractorId
            // null clears the assignment (back to Unassigned). The cloud layer wraps
            // this name so the change direct-writes to dm_defects like status edits.
            updateDefect(id, patch) {
                const defect = this.data.defects.find(d => d.id === id);
                if (!defect) return null;
                if (patch.description != null) defect.description = patch.description;
                if ('contractorId' in patch) {
                    defect.contractorId = patch.contractorId;
                    defect.unassigned = patch.contractorId == null;
                }
                defect.lastUpdateAt = new Date().toISOString();
                this.save();
                return defect;
            }

            // One attendance/booking date per supplier at a property: stamp every
            // open item for that contractor+address so it syncs with the defects.
            setContractorBooking(contractorId, addressId, date) {
                (this.data.defects || []).forEach(d => {
                    if (d.contractorId === contractorId && d.addressId === addressId && !d.completed) {
                        d.bookingAt = date || null;
                    }
                });
                this.save();
            }
            getContractorBooking(contractorId, addressId) {
                const d = (this.data.defects || []).find(x =>
                    x.contractorId === contractorId && x.addressId === addressId && !x.completed && x.bookingAt);
                return d ? d.bookingAt : '';
            }

            // Export functions
            exportToText(defects) {
                let text = '';
                const allDefects = defects || this.getDefects();
                
                // Helper for consistent address formatting
                const formatAddr = (addr) => {
                    if (!addr) return '';
                    let result = addr.street || '';
                    if (addr.suburb) result += `, ${addr.suburb}`;
                    if (addr.propertyNumber) result += ` - ${addr.propertyNumber}`;
                    return result;
                };
                
                // Group by address first
                const byAddress = {};
                allDefects.forEach(d => {
                    const address = this.getAddress(d.addressId);
                    const contractor = this.getContractor(d.contractorId);
                    if (!address || !contractor) return;
                    
                    const addressKey = formatAddr(address);
                    if (!byAddress[addressKey]) {
                        byAddress[addressKey] = {
                            address: address,
                            contractors: {}
                        };
                    }
                    
                    const contractorName = contractor.name;
                    if (!byAddress[addressKey].contractors[contractorName]) {
                        byAddress[addressKey].contractors[contractorName] = [];
                    }
                    byAddress[addressKey].contractors[contractorName].push(d);
                });
                
                // Build text output: Address > Contractor > Defects
                Object.keys(byAddress).sort().forEach(addressKey => {
                    text += `${addressKey}\n`;
                    const addressGroup = byAddress[addressKey];
                    
                    Object.keys(addressGroup.contractors).sort().forEach(contractorName => {
                        const ds = addressGroup.contractors[contractorName];
                        const bk = ds[0] ? this.getContractorBooking(ds[0].contractorId, ds[0].addressId) : '';
                        text += `\n${contractorName}${bk ? '  —  Attend: ' + fmtDateNice(bk) : ''}\n`;
                        ds.forEach(defect => {
                            text += `• ${formatDefectEmailLine(defect)}\n`;
                        });
                    });
                    text += '\n';
                });
                
                return text;
            }
        }

        // The SUBURB is left out on purpose. With it, "Lot 905, (11) Woodlawn

        function lotTitleHtml(address, trailer) {

        function renderMultipleContractorsView(contractorIds) {
            const contractors = contractorIds.map(id => db.getContractor(id)).filter(Boolean);
            const contractorNames = contractors.map(c => c.name).join(', ');
            const flt = activeStatusFilter();
            // Pull straight from the store so Completed can be included when the
            // filter selects it (db.getDefects excludes completed).
            const defects = db.data.defects
                .filter(d => contractorIds.includes(d.contractorId) && flt.includes(defectStatusOf(d)))
                .map(d => ({ ...d, address: db.getAddress(d.addressId), contractor: db.getContractor(d.contractorId) }));
            const emptyMsg = flt.length === 0
                ? 'No statuses selected — tap Filter to choose'
                : `No ${flt.length < 3 ? flt.map(s => STATUS_LABELS[s]).join(' / ').toLowerCase() + ' ' : ''}defects for selected contractors`;

            // Reorganize to group by address then by contractor
            const byAddressThenContractor = {};
            defects.forEach(defect => {
                const addressKey = formatAddress(defect.address);
                if (!byAddressThenContractor[addressKey]) {
                    byAddressThenContractor[addressKey] = {
                        address: defect.address,
                        contractors: {}
                    };
                }
                const cName = (defect.contractor && defect.contractor.name) || 'Unassigned';
                if (!byAddressThenContractor[addressKey].contractors[cName]) {
                    byAddressThenContractor[addressKey].contractors[cName] = [];
                }
                byAddressThenContractor[addressKey].contractors[cName].push(defect);
            });

            return `
                <div class="defects-container">
                    <div class="app-header">
                        <a href="#" class="back-link" onclick="event.preventDefault(); showHomeView()">Back</a>

                            <button class="icon-btn" onclick="refreshDefects()" title="Refresh">🔄</button>

                    </div>

                    ${Object.keys(byAddressThenContractor).length === 0 ? `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <p>${emptyMsg}</p>
                        </div>
                    ` : Object.keys(byAddressThenContractor).sort().map(addressKey => `
                        <div class="contractor-section">
                            <div class="contractor-name" style="background: var(--bg-secondary); padding: 10px 12px; margin: -12px -15px 10px -15px; border-radius: 0; font-size: 16px; color: var(--text-primary);">
                                📍 ${addressKey}

                            ${Object.keys(byAddressThenContractor[addressKey].contractors).sort().map(contractorName => `
                                <div style="margin-bottom: 10px;">
                                    <div style="font-size: 14px; font-weight: 600; color: var(--blue); margin-bottom: 4px; padding-left: 8px; border-left: 3px solid var(--blue);">

            );
            // Get only ACTIVE defects (not completed), scoped to this user's jobs
            const activeDefects = db.data.defects.filter(d =>
                !d.completed && (isMgr || !myAddressIds || myAddressIds.has(d.addressId))
            );
            const totalDefects = isMgr
                ? db.data.defects.length
                : db.data.defects.filter(d => !myAddressIds || myAddressIds.has(d.addressId)).length;
            const completedCount = totalDefects - activeDefects.length;
            const pendingCount = activeDefects.filter(d => defectStatusOf(d) === 'pending').length;
            const openCount = activeDefects.length - pendingCount;

            // Which defects to show depends on the "Show completed" toggle
            const defectsToShow = state.showCompleted
                ? db.data.defects.filter(d => isMgr || !myAddressIds || myAddressIds.has(d.addressId))
                : activeDefects;

            // Group by address, then by contractor
            const groupedByAddress = {};
            defectsToShow.forEach(defect => {
                const address = db.getAddress(defect.addressId);
                const contractor = db.getContractor(defect.contractorId);
                
                if (!address || !contractor) return;
                
                const addressKey = formatAddress(address);
                if (!groupedByAddress[addressKey]) {
                    groupedByAddress[addressKey] = {
                        address: address,
                        contractors: {}
                    };
                }
                
                // Group by contractor within address
                const contractorName = contractor.name;
                if (!groupedByAddress[addressKey].contractors[contractorName]) {
                    groupedByAddress[addressKey].contractors[contractorName] = [];
                }
                
                groupedByAddress[addressKey].contractors[contractorName].push({
                    ...defect,
                    contractor: contractor
                });
            });

            // Convert to sorted array
            const addressGroups = Object.keys(groupedByAddress)
                .sort()
                .map(key => ({
                    addressKey: key,
                    address: groupedByAddress[key].address,
                    contractors: groupedByAddress[key].contractors
                }));

            return `

                    <div class="app-header">

                        <div style="width: 60px;"></div>
                    </div>

                                <span class="status-badge status-pending">${pendingCount} Pending</span>${completedCount > 0 ? ` <span class="status-badge status-completed">${completedCount} Completed</span>` : ''}
                            </div>
                        </div>
                        <div class="toolbar">
                            <button class="icon-btn" onclick="toggleShowCompleted()" title="${state.showCompleted ? 'Hide completed' : 'Show completed'}" style="${state.showCompleted ? 'background: var(--blue); color: #fff;' : ''}">👁️</button>
                            <button class="icon-btn" onclick="openReportBuilder()" title="Generate PDF Report">📑</button>
                            <button class="icon-btn" onclick="copyDefectsToClipboard()" title="Copy to Clipboard">📋</button>
                            <button class="icon-btn" onclick="emailDefectList(true)" title="Email List">📧</button><button class="icon-btn" onclick="emailDefectList(true, true)" title="Email a link to the PDF — fills the subject in every mail app">🔗</button>                            <button class="icon-btn" onclick="refreshDefects()" title="Refresh">🔄</button>
                        </div>
                    </div>

                    ${addressGroups.length === 0 ? `
                        <div class="empty-state">
                            <div class="empty-state-icon">✅</div>
                            <p>No active defects!</p>
                            <p style="font-size: 14px; color: var(--text-secondary); margin-top: 10px;">${completedCount > 0 ? `${completedCount} defect(s) completed` : 'Add some defects to get started'}</p>
                        </div>
                    ` : addressGroups.map(addressGroup => `
                        <div class="contractor-section">
                            <div class="contractor-name" style="background: var(--bg-secondary); padding: 10px 12px; margin: -12px -15px 10px -15px; border-radius: 0; font-size: 16px; color: var(--text-primary);">
                                📍 ${addressGroup.addressKey}
                            </div>
                            ${Object.keys(addressGroup.contractors).sort().map(contractorName => `
                                <div style="margin-bottom: 10px;">
                                    <div style="font-size: 14px; font-weight: 600; color: var(--blue); margin-bottom: 4px; padding-left: 8px; border-left: 3px solid var(--blue);">
                                        ${contractorName}
                                    </div>
                                    ${addressGroup.contractors[contractorName].map(defect => `
                                        <div class="defect-item">
                                            ${statusTab(defect)}<span class="defect-text">${defectLineHtml(defect)}</span>
                                            <span class="defect-actions">${editControl(defect)}${locationControl(defect)}${photoIcon(defect)}${orderControl(defect)}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            `).join('')}
                        </div>
                    `).join('')}
                </div>
            `;
        }

                                ${F1_THEMES.map(t => `<option value="${t.id}" ${currentF1Theme() === t.id ? 'selected' : ''}>${t.name} — ${t.sub}</option>`).join('')}
                            </select>

                        <!-- Home sections: Multiple Contractors / Trades (hidden by default) -->
                        <div style="margin-bottom: 20px; padding: 20px; background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 10px;">
                            <div style="font-size: 17px; font-weight: 600; margin-bottom: 5px; color: var(--text-primary);">🏠 Home sections</div>
                            <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 12px;">Show or hide the multi-search blocks on the home screen</div>
                            <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:10px;">

                        <div class="crud-list">

                                    <button class="btn btn-secondary" onclick="openModal('unhide-trade-modal')">Unhide</button>
                                    <button class="btn btn-danger" onclick="openModal('delete-trade-modal')">Delete</button>

                            <div class="crud-item">

        // Action Functions
        function searchByAddress() {
            const input = document.getElementById('search-address').value.trim();
            
            // If empty, show all addresses list
            if (!input) {
                showAllAddressesList();
                return;
            }
            
            const address = scopeAddressesToUser(db.getAddresses()).find(a =>
                a.street.toLowerCase().includes(input.toLowerCase())
            );
            if (address) {
                openAddressGuarded(address.id, () => {
                    state.currentView = 'view-defects-address';
                    state.filters = { addressId: address.id };
                    render();
                });
            } else {
                showToast('Address not found', true);
            }
        }

        function searchByContractor() {
            const input = document.getElementById('search-contractor').value.trim();
            
            // If empty, show all contractors list
            if (!input) {
                showAllContractorsList();
                return;
            }
            
            const contractor = db.getContractors().find(c => 
                c.name.toLowerCase().includes(input.toLowerCase())
            );
            if (contractor) {
                state.currentView = 'view-defects-contractor';
                state.filters = { contractorId: contractor.id };
                render();
            } else {
                showToast('Contractor not found', true);
            }
        }

        function searchByTrade() {
            const input = document.getElementById('search-trade').value.trim();
            
            // If empty, show all trades list
            if (!input) {
                showAllTradesList();
                return;
            }
            
            const trade = db.getTrades().find(t => 
                t.name.toLowerCase().includes(input.toLowerCase())
            );
            if (trade) {
                showDefectsForTrade(trade.id);
            } else {
                showToast('Trade not found', true);
            }
        }

        function showDefectsForTrade(tradeId) {
            const trade = db.getTrades().find(t => t.id === tradeId);
            const contractors = db.getContractors().filter(c => 
                c.tradeIds && c.tradeIds.includes(tradeId)
            );
            
            if (contractors.length === 0) {
                showToast('No contractors found for this trade', true);
                return;
            }
            
            // Get all defects from contractors with this trade
            const contractorIds = contractors.map(c => c.id);
            const defects = db.getDefects().filter(d => 
                contractorIds.includes(d.contractorId)
            );
            
            // Update view state
            state.currentView = 'view-defects-trade';
            state.filters = { 
                tradeId: tradeId,
                tradeName: trade.name,
                contractorIds: contractorIds
            };
            
            render();
        }

        // ── Handover-complete jobs ──────────────────────────────────────────
        // Jobs marked Handover Complete in CH Tracker (jobStatus === 'completed')
        // still sync to the app. When a supervisor opens one, warn them — they may
        // continue (there can be outstanding defects) or dismiss it from their
        // list. Dismissed jobs are hidden locally on this device.
        function getDismissedJobs() {
            try { return new Set((JSON.parse(localStorage.getItem('dm_dismissed_jobs') || '[]') || []).map(Number)); } catch (e) { return new Set(); }
        }
        function saveDismissedJobs(set) { try { localStorage.setItem('dm_dismissed_jobs', JSON.stringify([...set])); } catch (e) {} }
        const _completedAck = new Set();   // acknowledged-this-session via Continue
        let _completedProceed = null;
        function openAddressGuarded(addressId, proceed) {
            addressId = parseInt(addressId);
            const a = db.getAddress(addressId);
            if (a && a.jobStatus === 'completed' && !_completedAck.has(addressId) && !getDismissedJobs().has(addressId)) {
                showCompletedJobPrompt(a, addressId, proceed);
                return;
            }
            proceed();
        }
        function showCompletedJobPrompt(address, addressId, proceed) {
            _completedProceed = proceed;
            closeCompletedPrompt();
            const addr = formatAddress(address);
            const wrap = document.createElement('div');
            wrap.id = 'completed-job-prompt';
            wrap.style.cssText = 'position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px';
            wrap.innerHTML = `
                <div style="background:var(--card-bg,#fff);border-radius:14px;max-width:380px;width:100%;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.4)">
                    <div style="font-size:18px;font-weight:700;color:var(--text-primary);margin-bottom:8px">✅ Handover Complete</div>
                    <div style="font-size:14px;color:var(--text-secondary);line-height:1.5;margin-bottom:18px">
                        <strong style="color:var(--text-primary)">${addr.replace(/</g,'&lt;')}</strong> has been marked <strong>Handover Complete</strong> in CH Tracker.<br><br>
                        Do you wish to continue, or mark it complete here? If you mark it complete you'll no longer see this job in your list.
                    </div>
                    <div style="display:flex;flex-direction:column;gap:8px">
                        <button onclick="completedPromptContinue(${addressId})" style="padding:12px;border:none;border-radius:10px;background:var(--blue,#2563eb);color:#fff;font-weight:600;font-size:15px;cursor:pointer">Continue</button>
                        <button onclick="completedPromptDismiss(${addressId})" style="padding:12px;border:1px solid var(--border-color,#ccc);border-radius:10px;background:transparent;color:var(--text-primary);font-weight:600;font-size:15px;cursor:pointer">Mark handover complete</button>
                        <button onclick="closeCompletedPrompt()" style="padding:10px;border:none;background:transparent;color:var(--text-secondary);font-size:14px;cursor:pointer">Cancel</button>
                    </div>
                </div>`;
            wrap.addEventListener('click', (e) => { if (e.target === wrap) closeCompletedPrompt(); });
            document.body.appendChild(wrap);
        }
        function closeCompletedPrompt() { const el = document.getElementById('completed-job-prompt'); if (el) el.remove(); }
        function completedPromptContinue(addressId) {
            _completedAck.add(parseInt(addressId));
            const p = _completedProceed; _completedProceed = null;
            closeCompletedPrompt();
            if (p) p();
        }
        function completedPromptDismiss(addressId) {
            addressId = parseInt(addressId);
            const set = getDismissedJobs(); set.add(addressId); saveDismissedJobs(set);
            _completedProceed = null;
            closeCompletedPrompt();
            showToast('Job hidden — marked handover complete');
            showHomeView();
        }

        function selectAddressFromList(addressId) {

                c.tradeIds && c.tradeIds.includes(tradeId)

                listContainer.innerHTML = contractors.map(c => `
                    <div class="defect-item" style="cursor: pointer; background: var(--bg-primary); margin-bottom: 5px; padding: 15px; border: 1px solid var(--border-color); border-radius: 8px;" 
                         onclick="selectContractorFromTrade(${c.id})">
                        <div style="font-weight: 600;">${c.name}</div>
                        <div style="font-size: 14px; color: #FF3B30;">⚠️ No Trade Assigned</div>
                    </div>
                `).join('');
            }

        // Restrict a list of jobs (addresses) to the logged-in supervisor's own —
        // managers, or an unresolved session, see all. Every user-facing job
        // search / picker runs through this so a supervisor can only ever reach
        // their own jobs. Only narrows once supervisor data has loaded, so a slow
        // sync never blanks the results.
        function scopeAddressesToUser(addresses) {
            const cj = window.CloudJobs;
            const isMgr = !!(cj && cj.isManager && cj.isManager());
            const uid = (cj && cj.currentUserId) ? cj.currentUserId() : null;
            if (isMgr) return addresses;
            // Identity not known yet (first-ever boot / just signed out): show
            // NOTHING rather than flash every supervisor's jobs. Normal reloads
            // resolve instantly from the persisted identity (cs_identity).
            if (!uid) return [];
            if (!addresses.some(a => a.supervisorId)) return addresses;
            return addresses.filter(a => a.supervisorId === uid);
        }

        // ===========================================================================
        //  SEARCH MATCHING (Spiro 2026-08-02)
        //
        //  Every search box in the app used `word.startsWith(query)` — the WHOLE
        //  query had to prefix a SINGLE word. So any two-word search matched
        //  nothing at all: "vic plaster", "victoria fencing", "auz painting",
        //  "har painter", "roof plumb", "shower screen" all returned an empty
        //  dropdown, which is why finding a supplier was a fight.
        //
        //  Now: every word you type must prefix-match SOME word in the target,
        //  in any order. "vic plaster" finds "Vic Plaster Adam"; "plaster vic"
        //  finds it too; "har painter" finds HaR because the trade is part of the
        //  haystack. Splitting on non-alphanumerics means "&", hyphens, commas
        //  and double spaces stop hiding names ("AUZ PAINTING & DECORATING").
        //
        //  Still a PREFIX match per word, not a substring one — typing "ain"
        //  shouldn't surface every painter. Prefixes are what people expect from
        //  a name field and keep the list short on a phone.
        // ===========================================================================
        // A JS value safe to embed in a double-quoted HTML on* attribute.
        // JSON.stringify alone emits its own double quotes, which terminate the
        // attribute early and silently break the handler — a trade named
        // "Plumber" produced onclick="…label: "Plumber"…" and the button did
        // nothing at all. (Spiro 2026-08-02)
        function jsAttr(v) {
            return JSON.stringify(v == null ? null : v)
                .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '\\u003c');
        }
        function searchWords(s) {
            return String(s == null ? '' : s).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
        }
        // haystack: a string, or an array of strings to search across together.
        function matchesSearch(haystack, query) {
            const toks = searchWords(query);
            if (!toks.length) return true;                       // empty query matches all
            const words = searchWords(Array.isArray(haystack) ? haystack.join(' ') : haystack);
            if (!words.length) return false;
            return toks.every(t => words.some(w => w.startsWith(t)));
        }
        // Rows for a `.rv-combo-list` dropdown (Reassign all, Edit defect, BPI
        // review), RANKED. (Spiro 2026-08-02)
        //
        // These pickers used a bare `label.includes(query)` and then sorted the
        // survivors A-Z. Typing "Har" therefore listed every contractor with
        // those three letters anywhere in the name OR the trade — and put them in
        // alphabetical order, so "HAR Painters" sat a long scroll down its own
        // result list. The filter wasn't the problem; the ordering was.
        //
        // Word-prefix hits come first (rank 0-2, what you almost always mean),
        // then plain substring hits (rank 4) so nothing that used to be findable
        // stops being findable. A-Z within each band.
        function comboRank(label, query) {
            if (matchesSearch(label, query)) return searchRank(label, query);
            return String(label || '').toLowerCase().includes(String(query || '').trim().toLowerCase()) ? 4 : 9;
        }
        function comboItems(options, query, esc) {
            const q = (query || '').trim();
            let hits = options;
            if (q) {
                hits = options
                    .map(o => ({ o, r: comboRank(o.label, q) }))
                    .filter(x => x.r < 9)
                    .sort((a, b) => a.r - b.r || a.o.label.localeCompare(b.o.label))
                    .map(x => x.o);
            }
            hits = hits.slice(0, 40);
            return hits.length
                ? hits.map(o => `<div class="rv-combo-item" data-id="${o.id}">${esc(o.label)}</div>`).join('')
                : '<div class="rv-combo-empty">No matches</div>';
        }
        // A combo list is absolutely positioned INSIDE the modal's scrolling body,
        // and the card clips it — on a short dialog like "Reassign all" that left
        // barely two rows visible. Reserve room underneath while any list is open
        // so the body can scroll into it.
        function syncComboRoom() {
            const body = document.getElementById('imp-body');
            if (body) body.classList.toggle('combo-open', !!document.querySelector('.rv-combo-list.open'));
        }

        // Rank: an exact word hit, then a hit on the FIRST word, then A-Z. Keeps
        // "Painter" above "Roof Plumber" when you type "p".
        function searchRank(haystack, query) {
            const toks = searchWords(query);
            const words = searchWords(Array.isArray(haystack) ? haystack.join(' ') : haystack);
            if (!toks.length || !words.length) return 3;
            if (toks.every(t => words.some(w => w === t))) return 0;
            if (words[0] && words[0].startsWith(toks[0])) return 1;
            return 2;
        }

        // Autocomplete functionality
        function handleAutocomplete(input, type, inputId) {
            const value = input.value.toLowerCase();
            const dropdownId = (inputId || input.id) + '-dropdown';
            const dropdown = document.getElementById(dropdownId);
            
            if (!dropdown) return;
            
            // Determine if this is a "view" field or "add" field
            const isViewField = input.id.startsWith('search-');
            
            let items = [];
            
            if (type === 'address') {
                const isNumeric = /^\d/.test(value); // Check if searching for a number
                
                // Helper function to extract meaningful words (skip "lot", numbers, parentheses content)
                const getMeaningfulWords = (text) => {
                    const words = text.toLowerCase().split(/\s+/);
                    return words.filter(word => {
                        const cleaned = word.replace(/[()]/g, '');
                        return word !== 'lot' && word !== '-' && !/^\d+$/.test(cleaned) && cleaned.length > 0;
                    });
                };
                
                // Helper to get all searchable words from an address
                const getAllWords = (address) => {
                    const streetWords = address.street.toLowerCase().split(/\s+/);
                    const suburbWords = address.suburb.toLowerCase().split(/\s+/);
                    const propWords = address.propertyNumber ? address.propertyNumber.toLowerCase().split(/\s+/) : [];
                    return [...streetWords, ...suburbWords, ...propWords];
                };
                
                const _dismissed = getDismissedJobs();
                // Hide dismissed jobs and not-yet-started ones (admin / pre-planner
                // have no construction = no defects) from the defect search. Jobs
                // with unknown status are kept so nothing legit disappears.
                items = scopeAddressesToUser(db.getAddresses())
                    .filter(a => !_dismissed.has(a.id) && a.jobStatus !== 'admin' && a.jobStatus !== 'pre_planner')
                    .filter(a => {
                    const allWords = getAllWords(a);

                    // If searching for a number, match any number that starts with search
                    if (isNumeric) {
                        return allWords.some(word => {
                            const numMatch = word.match(/\d+/);
                            return numMatch && numMatch[0].startsWith(value);
                        });
                    }
                    
                    // Otherwise every typed word must prefix some word of the
                    // address — so "red fruit" and "woodlawn wollert" both work.
                    return matchesSearch(allWords, value);
                })
                .sort((a, b) => {
                    // Get meaningful words (actual street/suburb names, not "Lot" or numbers)
                    const aMeaningfulStreet = getMeaningfulWords(a.street);
                    const bMeaningfulStreet = getMeaningfulWords(b.street);
                    const aMeaningfulSuburb = getMeaningfulWords(a.suburb);
                    const bMeaningfulSuburb = getMeaningfulWords(b.suburb);
                    
                    if (isNumeric) {
                        // Extract lot numbers for numeric search
                        const aLotMatch = a.street.toLowerCase().match(/lot\s*(\d+)/);
                        const bLotMatch = b.street.toLowerCase().match(/lot\s*(\d+)/);
                        const aLotNum = aLotMatch ? aLotMatch[1] : '';
                        const bLotNum = bLotMatch ? bLotMatch[1] : '';
                        
                        const aLotStarts = aLotNum.startsWith(value);
                        const bLotStarts = bLotNum.startsWith(value);
                        
                        if (aLotStarts && !bLotStarts) return -1;
                        if (!aLotStarts && bLotStarts) return 1;
                        
                        // Sort by lot number numerically
                        if (aLotStarts && bLotStarts) {
                            return parseInt(aLotNum) - parseInt(bLotNum);
                        }
                    } else {
                        // PRIORITY 1: First meaningful word in EITHER street OR suburb starts with search
                        const aFirstMeaningful = aMeaningfulStreet[0] || aMeaningfulSuburb[0] || '';
                        const bFirstMeaningful = bMeaningfulStreet[0] || bMeaningfulSuburb[0] || '';
                        const aFirstMatch = aFirstMeaningful.startsWith(value);
                        const bFirstMatch = bFirstMeaningful.startsWith(value);
                        
                        // PRIORITY 2: Any meaningful word starts with search
                        const allAMeaningful = [...aMeaningfulStreet, ...aMeaningfulSuburb];
                        const allBMeaningful = [...bMeaningfulStreet, ...bMeaningfulSuburb];
                        const aAnyMeaningfulMatch = allAMeaningful.some(w => w.startsWith(value));
                        const bAnyMeaningfulMatch = allBMeaningful.some(w => w.startsWith(value));
                        
                        // Score: 2 = first word match, 1 = any meaningful match, 0 = other match
                        const aScore = aFirstMatch ? 2 : (aAnyMeaningfulMatch ? 1 : 0);
                        const bScore = bFirstMatch ? 2 : (bAnyMeaningfulMatch ? 1 : 0);
                        
                        if (aScore !== bScore) return bScore - aScore;
                        
                        // If same score, sort by the matching word alphabetically
                        const aMatchWord = allAMeaningful.find(w => w.startsWith(value)) || '';
                        const bMatchWord = allBMeaningful.find(w => w.startsWith(value)) || '';
                        if (aMatchWord !== bMatchWord) {
                            return aMatchWord.localeCompare(bMatchWord);
                        }
                    }
                    
                    // Final fallback: alphabetical by street
                    return a.street.localeCompare(b.street);
                })
                .map(a => ({
                    label: `${a.street}, ${a.suburb}${a.propertyNumber ? ' - ' + a.propertyNumber : ''}`,
                    value: a.street,
                    id: a.id,
                    type: 'address',
                    street: a.street,
                    sub: [a.suburb || '', a.propertyNumber || ''].filter(Boolean).join(' · ')
                }));
            } else if (type === 'contractor') {
                // Name AND trade in one haystack, so "har painter" finds HaR the
                // painter even though "painter" is nowhere in the name.
                items = db.getContractors().filter(c => matchesSearch([c.name, c.trades], value))
                .sort((a, b) => {
                    const r = searchRank([a.name, a.trades], value) - searchRank([b.name, b.trades], value);
                    return r || a.name.localeCompare(b.name);
                })
                .map(c => ({
                    label: `${c.name} - ${c.trades || 'No Trade'}`,
                    value: c.name,
                    id: c.id,
                    type: 'contractor'
                }));
            } else if (type === 'trade') {
                items = db.getTrades().filter(t => matchesSearch(t.name, value))
                .sort((a, b) => {
                    const r = searchRank(a.name, value) - searchRank(b.name, value);
                    return r || a.name.localeCompare(b.name);
                })
                .map(t => ({
                    label: t.name,
                    value: t.name,
                    id: t.id,
                    type: 'trade'
                }));
            }
            
            if (items.length === 0 || value === '') {
                dropdown.classList.remove('active');
                return;
            }
            
            // Unified top search: each match on its own row with View (+ Add)
            // icons beside it. Add applies to address/contractor only (you can't
            // "add defects" to a trade). Addresses render two lines.
            // <div>s not <button>s — iOS Safari stacks buttons used as flex items.
            const withIcons = (input.id === 'unified-search');
            // Match the My Jobs list row styling exactly (same padding, text
            // sizes, 40px icons) so search results look identical to the list.
            const ico = 'flex:0 0 auto;width:40px;height:40px;border-radius:8px;border:1px solid var(--brd,rgba(128,128,128,.3));cursor:pointer;font-size:18px;line-height:38px;text-align:center;';
            dropdown.innerHTML = items.slice(0, 5).map(item => {
                if (withIcons) {
                    const canAdd = (item.type === 'address' || item.type === 'contractor');
                    const main = item.type === 'address'
                        ? `<div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.street}</div>${item.sub ? `<div style="font-size:12px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.sub}</div>` : ''}`
                        : `<div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.label}</div>`;
                    return `
                    <div class="autocomplete-item" style="display:flex;flex-wrap:nowrap;align-items:center;gap:8px;padding:10px 12px;font-size:15px;">
                        <div style="flex:1 1 auto;min-width:0;overflow:hidden;cursor:pointer;" onclick="viewDefectsFor('${item.type}', ${item.id})">${main}</div>
                        <div style="flex:0 0 auto;display:flex;gap:6px;">
                            ${item.type === 'address' ? `<div style="${ico}" onclick="event.stopPropagation();copyAddressToClipboard(${item.id})" title="Copy the full address">📋</div>` : ''}
                            <div style="${ico}" onclick="event.stopPropagation();viewDefectsFor('${item.type}', ${item.id})" title="View defects">👁️</div>
                            ${canAdd ? `<div style="${ico}color:var(--acc,#2563eb);font-weight:800;" onclick="event.stopPropagation();addDefectsFor('${item.type}', ${item.id})" title="Add defects">✚</div>` : ''}
                        </div>
                    </div>`;
                }
                return `
                <div class="autocomplete-item" onclick="selectAutocomplete('${input.id}', '${item.value.replace(/'/g, "\\'")}', '${dropdownId}', ${item.id}, '${item.type}', ${isViewField})">
                    ${item.label}
                </div>`;
            }).join('');

            dropdown.classList.add('active');
        }

        function selectAutocomplete(inputId, value, dropdownId, itemId, itemType, isViewField) {

        function handleAddDefectsContractorAutocomplete(input, contractorNum) {
            const value = input.value.toLowerCase();
            const dropdownId = contractorNum ? `add-contractor-${contractorNum}-dropdown` : 'add-defects-contractor-dropdown';
            const dropdown = document.getElementById(dropdownId);

            // surface "Carpenter / Caulker / Cleaner" before "C & E Corp Vic

                .filter(c => matchesSearch([c.name, c.trades], value))
                .sort((a, b) => {
