            // crowd every real company off the list rather than let you
            // scroll to them as intended — the dropdown already scrolls
            // (.autocomplete-dropdown, max-height:200px), so let it.
            dropdown.innerHTML = contractors.slice(0, 60).map(c => `
                <div class="autocomplete-item" onclick="selectAddDefectsContractor(${c.id}, '${c.name.replace(/'/g, "\\'")}', ${contractorNum || 0})">
                    ${c.name} - ${c.trades || 'No Trade'}
                </div>
            `).join('');
            
            dropdown.classList.add('active');
        }

        function selectAddDefectsContractor(id, name, contractorNum) {
            if (contractorNum) {
                document.getElementById(`add-contractor-${contractorNum}-input`).value = name;
                document.getElementById(`add-contractor-${contractorNum}-dropdown`).classList.remove('active');
                if (!state.selectedAddDefectsContractors) state.selectedAddDefectsContractors = {};
                state.selectedAddDefectsContractors[contractorNum] = id;
            } else {
                document.getElementById('add-defects-contractor-input').value = name;
                document.getElementById('add-defects-contractor-dropdown').classList.remove('active');
                state.selectedAddDefectsContractor = id;
            }
        }

        // Resolve the supplier for an Add-Defects block from what is ON SCREEN.
        //
        // The tapped-from-the-dropdown id was previously the ONLY thing consulted,
        // so a supervisor who typed the supplier's full name and went straight to
        // the defect rows (the keyboard usually covers the suggestion list) had
        // their whole block dropped on Save — silently, if any other block did
        // save. This resolves the typed text as well, and deliberately re-checks
        // the tapped id against the text so an edited name can't keep a stale id.
        //
        // Returns { id } on success, or { error } describing why not — never a
        // silent null.
        function resolveTypedContractor(typedRaw) {
            const typed = (typedRaw || '').trim();
            if (!typed) return { error: 'empty' };
            const contractors = db.getContractors();
            const norm = s => (s || '').trim().toLowerCase();
            const exact = contractors.filter(c => norm(c.name) === norm(typed));
            if (exact.length === 1) return { id: exact[0].id };
            if (exact.length > 1) return { id: exact[0].id };   // same name twice — first wins, as before
            const partial = contractors.filter(c => norm(c.name).includes(norm(typed)));
            if (partial.length === 1) return { id: partial[0].id };
            if (partial.length > 1) return { error: 'ambiguous', typed };
            return { error: 'unknown', typed };
        }

        // Resolve block `i` of the address form: prefer the tapped id, but only if
        // it still matches the text in the box.
        function resolveAddDefectsContractor(i) {
            const input = document.getElementById(`add-contractor-${i}-input`);
            const typed = (input && input.value || '').trim();
            if (!typed) return { error: 'empty' };
            const picked = state.selectedAddDefectsContractors && state.selectedAddDefectsContractors[i];
            if (picked != null) {
                const c = db.getContractor(picked);
                if (c && (c.name || '').trim().toLowerCase() === typed.toLowerCase()) return { id: picked };
            }
            return resolveTypedContractor(typed);
        }

        // Close dropdowns when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.matches('input[type="text"]')) {
                document.querySelectorAll('.autocomplete-dropdown').forEach(d => {
                    d.classList.remove('active');
                });
            }
        });

        // Add defects from view screen
        function openAddDefectsForContractor(contractorId) {
            state.currentContractorForAdd = contractorId;
            openModal('quick-add-defects-modal');
        }

        function openAddDefectsForAddress(addressId) {
            // Open the FULL add-defects form (multiple suppliers, 5 blocks),
            // not the single-supplier quick modal.
            startDefectsForJob(addressId);
        }

        function saveQuickDefectsForContractor() {
            const contractorId = state.currentContractorForAdd;
            const addressInput = document.getElementById('quick-address-input');
            const defectInputs = document.querySelectorAll('.quick-defect-input');
            
            const addressId = state.selectedQuickAddress;
            if (!addressId || !addressInput.value.trim()) {
                showToast('Please select an address', true);
                return;
            }

            let savedCount = 0;
            defectInputs.forEach(input => {
                if (input.value.trim()) {
                    const d = db.addDefect({
                        addressId,
                        contractorId,
                        description: input.value.trim()
                    });
                    applyRowExtras(input.closest('.defect-input-row'), d.id);
                    savedCount++;
                }
            });

            if (savedCount > 0) {
                showToast(`${savedCount} defect(s) added successfully`);
                closeModal('quick-add-defects-modal');
                
                // Clear inputs
                addressInput.value = '';
                state.selectedQuickAddress = null;
                defectInputs.forEach(input => input.value = '');
                
                render();
            } else {
                showToast('Please enter at least one defect', true);
            }
        }

        function saveQuickDefectsForAddress() {
            const addressId = state.currentAddressForAdd;
            const contractorInput = document.getElementById('quick-contractor-input');
            const defectInputs = document.querySelectorAll('.quick-defect-input-address');
            
            // Accept a fully-typed supplier name, not just a tapped suggestion —
            // the on-screen keyboard usually hides the dropdown on a phone.
            const typedContractor = (contractorInput && contractorInput.value || '').trim();
            let contractorId = state.selectedQuickContractor;
            if (contractorId != null) {
                const c = db.getContractor(contractorId);
                if (!c || (c.name || '').trim().toLowerCase() !== typedContractor.toLowerCase()) contractorId = null;
            }
            if (contractorId == null) {
                const res = resolveTypedContractor(typedContractor);
                if (res.error === 'empty')     { showToast('Please select a contractor', true); return; }
                if (res.error === 'ambiguous') { showToast(`“${typedContractor}” matches more than one supplier — tap the right one.`, true); return; }
                if (res.error)                 { showToast(`“${typedContractor}” isn’t a known supplier — tap one from the list.`, true); return; }
                contractorId = res.id;
            }

            let savedCount = 0;
            defectInputs.forEach(input => {
                if (input.value.trim()) {
                    const d = db.addDefect({
                        addressId,
                        contractorId,
                        description: input.value.trim()
                    });
                    applyRowExtras(input.closest('.defect-input-row'), d.id);
                    savedCount++;
                }
            });

            if (savedCount > 0) {
                showToast(`${savedCount} defect(s) added successfully`);
                closeModal('quick-add-defects-address-modal');
                
                // Clear inputs
                contractorInput.value = '';
                state.selectedQuickContractor = null;
                defectInputs.forEach(input => input.value = '');
                
                render();
            } else {
                showToast('Please enter at least one defect', true);
            }
        }

        // Add Defects Page Save Functions
        function saveAddDefectsContractor() {
            const contractorId = state.filters.contractorId;
            const addressInput = document.getElementById('add-defects-address-input');
            const defectInputs = document.querySelectorAll('.add-defect-contractor-input');
            
            const addressId = state.selectedAddDefectsAddress;
            if (!addressId || !addressInput.value.trim()) {
                showToast('Please select an address', true);
                return;
            }

            let savedCount = 0;
            defectInputs.forEach(input => {
                if (input.value.trim()) {
                    const d = db.addDefect({
                        addressId,
                        contractorId,
                        description: input.value.trim()
                    });
                    applyRowExtras(input.closest('.defect-input-row'), d.id);
                    savedCount++;
                }
            });

            if (savedCount > 0) {
                showToast(`${savedCount} defect(s) added successfully`);

                // Clear inputs
                addressInput.value = '';
                state.selectedAddDefectsAddress = null;
                defectInputs.forEach(input => input.value = '');
                
                // Stay on page for more entries
                render();
            } else {
                showToast('Please enter at least one defect', true);
            }
        }

        function saveAddDefectsAddress() {
            const addressId = state.filters.addressId;
            let totalSaved = 0;
            const problems = [];         // one message per unusable block

            // PASS 1 — resolve every block that has defects typed in it BEFORE
            // writing anything. A block whose supplier can't be resolved must stop
            // the save outright: silently dropping it (the old behaviour) meant a
            // supervisor saw "✓ 1 defect(s) added successfully" while a second
            // supplier's defects went in the bin.
            const blocks = [];
            for (let i = 1; i <= 5; i++) {
                const contractorInput = document.getElementById(`add-contractor-${i}-input`);
                const typed = (contractorInput && contractorInput.value || '').trim();
                const rows = [...document.querySelectorAll(`.add-defect-${i}`)].filter(r => r.value.trim());
                if (!rows.length) continue;              // nothing typed in this block

                if (!typed) {
                    problems.push(`Block ${i}: ${rows.length} defect(s) have no supplier — pick one.`);
                    continue;
                }
                const res = resolveAddDefectsContractor(i);
                if (res.error) {
                    problems.push(
                        res.error === 'ambiguous'
                            ? `Block ${i}: “${typed}” matches more than one supplier — tap the right one.`
                            : `Block ${i}: “${typed}” isn’t a known supplier — tap one from the list.`
                    );
                    continue;
                }
                blocks.push({ contractorId: res.id, rows });
            }

            // Nothing usable, or something would be lost → tell the user exactly
            // what is wrong and save NOTHING, so the typed text stays on screen.
            if (problems.length) {
                showToast(problems.join('\n'), true);
                return;
            }

            // PASS 2 — everything resolved; write it.
            let dupes = 0;
            blocks.forEach(({ contractorId, rows }) => {
                rows.forEach(input => {
                    const d = db.addDefect({
                        addressId,
                        contractorId,
                        description: input.value.trim()
                    });
                    applyRowExtras(input.closest('.defect-input-row'), d.id);
                    if (db.lastAddWasDuplicate) dupes++; else totalSaved++;
                });
            });

            if (totalSaved > 0) {
                showToast(`✓ ${totalSaved} defect(s) added successfully` +
                          (dupes ? ` · ${dupes} already on the list` : ''));
                
                // Clear all inputs
                for (let i = 1; i <= 5; i++) {
                    const contractorInput = document.getElementById(`add-contractor-${i}-input`);
                    if (contractorInput) contractorInput.value = '';
                    
                    const defectInputs = document.querySelectorAll(`.add-defect-${i}`);
                    defectInputs.forEach(input => input.value = '');
                }
                
                state.selectedAddDefectsContractors = {};
                
                // Stay on page for more entries
                render();
            } else if (dupes > 0) {
                // Everything typed was already on the list — say so, rather than
                // claiming nothing was entered.
                showToast(`${dupes} defect(s) already on the list — nothing new added`, true);
                render();
            } else {
                showToast('Please select at least one contractor and enter at least one defect', true);
            }
        }

        // Attach a photo to a defect input row BEFORE it is saved. Files are
        // held on the row element and uploaded after the defect saves + syncs.
        function pickRowPhoto(btn) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.multiple = true;   // allow selecting several photos at once
            // No `capture` attribute → the OS picker offers BOTH "Take Photo" and
            // "Photo Library", so a photo can be shot now or chosen from the gallery.
            // iOS reliability: a DETACHED file input frequently fails to deliver
            // the photo on the FIRST capture (onchange never fires), so the user
            // has to tap the camera twice. Attach it to the DOM (off-screen)
            // before clicking, and clean it up afterwards.
            input.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;';
            document.body.appendChild(input);
            let done = false;
            const cleanup = () => {
                if (done) return; done = true;
                window.removeEventListener('focus', onFocus);
                setTimeout(() => { try { input.remove(); } catch (e) {} }, 0);
            };
            // Cancelling the camera fires no change event — clean up on return.
            const onFocus = () => setTimeout(() => { if (!input.files || !input.files.length) cleanup(); }, 1500);
            window.addEventListener('focus', onFocus);
            input.onchange = async () => {
                const files = Array.from(input.files || []);
                if (!files.length) { cleanup(); return; }
                const row = btn.closest('.defect-input-row');
                if (!row) { cleanup(); return; }
                row._photos = row._photos || [];
                for (const f of files) {
                    let img = f;
                    // Offer the markup/text editor only for a SINGLE photo; a bulk
                    // gallery import skips it (editing each would be tedious).
                    if (files.length === 1 && window.CloudPhotos && window.CloudPhotos.editPhoto) {
                        const edited = await window.CloudPhotos.editPhoto(f);
                        if (edited === null) { cleanup(); return; }   // cancelled
                        img = edited || f;
                    }
                    row._photos.push(img);
                }
                btn.classList.add('has');
                btn.innerHTML = '📷' + (row._photos.length > 1 ? `<span class="cnt">${row._photos.length}</span>` : '');
                showToast(files.length > 1 ? `${files.length} photos attached` : 'Photo attached — it saves with this defect');
                cleanup();
            };
            input.click();
        }

        // Upload any row photos once the defect exists in the cloud. Prefer the
        // durable queue (persists each photo to IndexedDB so it can't be lost if
        // the app is closed before it finishes uploading); fall back to the
        // in-memory wait-and-upload path if that isn't available.
        function uploadRowPhotos(row, legacyId) {
            if (!row || !row._photos || !row._photos.length) return;
            const cp = window.CloudPhotos;
            if (!(cp && (cp.queueRowPhoto || cp.uploadWhenReady))) {
                showToast('Log in to attach photos', true);
                return;
            }
            row._photos.forEach(file => (cp.queueRowPhoto || cp.uploadWhenReady)(legacyId, file));
        }

        // Apply the row's chosen location + queued photos to the saved defect
        function applyRowExtras(row, legacyId) {
            if (row && row._location) db.setDefectLocation(legacyId, row._location);
            uploadRowPhotos(row, legacyId);
        }

        // ===== Bulk photo import =====================================================
        // "Shoot everything first, do the admin after." Pick many photos from the
        // gallery for a job address, then step through each one filling in
        // Location / Supplier / Description — each becomes a defect with its photo.
        let bulkPhotoState = null;   // { addressId, files:[File], idx:int }
        function _escHtml(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m])); }

        function openBulkPhotoImport(addressId) {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
            input.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;';
            document.body.appendChild(input);
            let done = false;
            const cleanup = () => { if (done) return; done = true; window.removeEventListener('focus', onFocus); setTimeout(() => { try { input.remove(); } catch (e) {} }, 0); };
            const onFocus = () => setTimeout(() => { if (!input.files || !input.files.length) cleanup(); }, 1500);
            window.addEventListener('focus', onFocus);
            input.onchange = () => {
                const files = Array.from(input.files || []);
                cleanup();
                if (!files.length) return;
                bulkPhotoState = { addressId, files, idx: 0 };
                renderBulkPhotoStep();
            };
            input.click();
        }

        function _revokeBulkUrl() { const ov = document.getElementById('bulk-photo-ov'); if (ov && ov._url) { try { URL.revokeObjectURL(ov._url); } catch (e) {} } }

        async function renderBulkPhotoStep() {
            const st = bulkPhotoState;
            if (!st) return;
            if (st.idx >= st.files.length) {   // finished
                const n = st.files.length;
                _revokeBulkUrl();
                const ov = document.getElementById('bulk-photo-ov'); if (ov) ov.remove();
                bulkPhotoState = null;
                showToast(`${n} photo defect(s) added`);
                render();
                return;
            }
            // Mark up / annotate THIS photo first (once), then fill in the details —
            // mirrors the single-photo add, which opens the editor before the form.
            // Cancel in the editor = skip this photo; Save/Use-as-is carries on.
            st.edited = st.edited || [];
            if (!st.edited[st.idx] && window.CloudPhotos && window.CloudPhotos.editPhoto) {
                st.edited[st.idx] = true;   // set before awaiting so it can't re-open
                _revokeBulkUrl();
                const prevOv = document.getElementById('bulk-photo-ov'); if (prevOv) prevOv.remove();
                const edited = await window.CloudPhotos.editPhoto(st.files[st.idx]);
                if (!bulkPhotoState) return;                       // import closed mid-edit
                if (edited === null) { skipBulkPhoto(); return; }  // cancelled → skip this photo
                if (edited) st.files[st.idx] = edited;
            }
            const file = st.files[st.idx];
            const url = URL.createObjectURL(file);
            let ov = document.getElementById('bulk-photo-ov'); if (ov) ov.remove();
            ov = document.createElement('div');
            ov.id = 'bulk-photo-ov';
            ov.style.cssText = 'position:fixed;inset:0;z-index:100000;background:var(--bg-primary,#fff);display:flex;flex-direction:column;box-sizing:border-box;padding-top:env(safe-area-inset-top,24px);';
            ov.innerHTML =
                `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border-color,#eee);">
                    <strong style="font-size:15px;color:var(--text-primary,#111);">Bulk Import — Photo ${st.idx + 1} of ${st.files.length}</strong>
                    <button onclick="closeBulkPhoto(true)" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-secondary,#777);">✕</button>
                </div>
                <div style="flex:1;overflow:auto;padding:12px 14px;">
                    <!-- FIELDS FIRST, PHOTO BELOW (site suggestion 2026-08-15).
                         The photo used to sit here, above the fields, which is
                         why the Supplier suggestions kept ending up under the
                         keyboard: photo + two fields + the chip grid simply do
                         not fit in the ~300px a keyboard leaves, so the chips
                         were always the thing pushed off. Scrolling them back
                         was tried twice and shipped broken twice. With the
                         fields at the top of the scroll area they are above the
                         fold whatever the keyboard does — structural, not
                         dependent on a scroll firing at the right moment. The
                         photo is a scroll away, which is the trade the site
                         explicitly asked for. -->
                    <label style="display:block;font-size:12px;color:var(--text-secondary);margin:8px 0 3px;">Location</label>
                    <div style="position:relative;">
                        <input id="bulk-loc" type="text" autocomplete="off" placeholder="Type to search location…" oninput="bulkComboFilter('loc')" onfocus="bulkComboFilter('loc'); _bulkFieldFocus()" onblur="bulkComboBlur('loc'); _bulkFieldBlur()" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #c6c6c8;border-radius:9px;font-size:16px;">
                        <div id="bulk-loc-list" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:6;max-height:190px;overflow:auto;background:var(--bg-primary,#fff);border:1px solid var(--border-color,#ccc);border-radius:9px;box-shadow:0 8px 20px rgba(0,0,0,.25);margin-top:2px;"></div>
                    </div>
                    <label style="display:block;font-size:12px;color:var(--text-secondary);margin:10px 0 3px;">Supplier / Trade</label>
                    <div style="position:relative;">
                        <input id="bulk-sup" type="text" autocomplete="off" placeholder="Type to search supplier / trade…" oninput="bulkComboFilter('sup')" onfocus="bulkComboFilter('sup'); _bulkFieldFocus()" onblur="bulkComboBlur('sup'); _bulkFieldBlur()" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #c6c6c8;border-radius:9px;font-size:16px;">
                        <div id="bulk-sup-list" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:6;max-height:190px;overflow:auto;background:var(--bg-primary,#fff);border:1px solid var(--border-color,#ccc);border-radius:9px;box-shadow:0 8px 20px rgba(0,0,0,.25);margin-top:2px;"></div>
                    </div>
                    <label style="display:block;font-size:12px;color:var(--text-secondary);margin:10px 0 3px;">Defect description</label>
                    <div style="position:relative;">
                        <input id="bulk-desc" type="text" autocomplete="off" placeholder="Describe the defect" oninput="bulkDescSuggest()" onfocus="bulkDescSuggest(); _bulkFieldFocus()" onblur="bulkDescBlur(); _bulkFieldBlur()" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #c6c6c8;border-radius:9px;font-size:16px;">
                        <div id="bulk-desc-list" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:7;max-height:190px;overflow:auto;background:var(--bg-primary,#fff);border:1px solid var(--border-color,#ccc);border-radius:9px;box-shadow:0 8px 20px rgba(0,0,0,.25);margin-top:2px;"></div>
                    </div>
                    <div class="bulk-photo-wrap" style="text-align:center;margin:14px 0 4px;"><img src="${url}" style="max-width:100%;max-height:38vh;border-radius:10px;object-fit:contain;"></div>
                </div>
                <div style="display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--border-color,#eee);">
                    <button onclick="skipBulkPhoto()" style="flex:1;padding:13px;border:1px solid var(--border-color,#ccc);border-radius:9px;background:var(--bg-secondary,#f2f2f2);color:var(--text-secondary,#777);font-size:15px;cursor:pointer;">Skip</button>
                    <button onclick="saveBulkPhoto()" style="flex:2;padding:13px;border:none;border-radius:9px;background:var(--blue,#2563eb);color:#fff;font-weight:700;font-size:15px;cursor:pointer;">${st.idx === st.files.length - 1 ? 'Save &amp; Finish' : 'Save &amp; Next'}</button>
                </div>`;
            _ensureBulkPhotoStyles();
            document.body.appendChild(ov);
            ov._url = url;
            // No auto-focus here on purpose: it used to pop the keyboard the
            // instant a photo loaded, before the supervisor had even looked at
            // it — one unwanted jump per photo, on top of the ones from tapping
            // fields. Let them choose where to start.
            _bindBulkViewport();
        }

        function closeBulkPhoto(ask) {
            if (ask && bulkPhotoState && bulkPhotoState.idx < bulkPhotoState.files.length) {
                if (!confirm('Stop the bulk import? Photos you haven\'t saved yet are discarded (already-saved ones stay).')) return;
            }
            _revokeBulkUrl();
            const ov = document.getElementById('bulk-photo-ov'); if (ov) ov.remove();
            bulkPhotoState = null;
            render();
        }

        function skipBulkPhoto() { _revokeBulkUrl(); if (bulkPhotoState) bulkPhotoState.idx++; renderBulkPhotoStep(); }

        function saveBulkPhoto() {
            const st = bulkPhotoState; if (!st) return;
            const descEl = document.getElementById('bulk-desc');
            const desc = (descEl && descEl.value || '').trim();
            if (!desc) { showToast('Enter a description', true); if (descEl) descEl.focus(); return; }
            const location = (document.getElementById('bulk-loc').value || '').trim();
            // Resolve the supplier by the name the picker filled in (exact, case-
            // insensitive). Typed-but-not-picked = no supplier (logged unassigned).
            const supName = (document.getElementById('bulk-sup').value || '').trim();
            const contractor = supName ? db.getContractors().find(c => (c.name || '').toLowerCase() === supName.toLowerCase()) : null;
            const contractorId = contractor ? contractor.id : null;
            const file = st.files[st.idx];
            const d = db.addDefect({ addressId: st.addressId, contractorId, description: desc, location: location || undefined, unassigned: !contractorId });
            const cp = window.CloudPhotos;
            if (cp && (cp.queueRowPhoto || cp.uploadWhenReady)) (cp.queueRowPhoto || cp.uploadWhenReady)(d.id, file);
            _revokeBulkUrl();
            st.idx++;
            renderBulkPhotoStep();
        }

        // Type-to-search dropdowns for the bulk wizard (location + supplier/trade).
        // Quick-pick generic trades on the Bulk Import Supplier/Trade field (site
        // feedback 2026-08-15): most photos in a batch aren't for a specific named
        // sub, they're "get the painter to look at this" — typing and matching a
        // real company name for every one of 19 photos costs fingers for no real
        // gain. One tap fills the field with the trade word instead. Exclusive to
        // this list for now, in the order asked for; broaden later if needed.
        const BULK_QUICK_TRADES = ['Painter', 'Carpenter', 'Cleaner', 'Caulker', 'Supervisor', 'Plumber', 'Electrician', 'Brick Cleaner', 'Site Cleaner'];
        // Per-field pending hide timer for bulkComboBlur, keyed so a reopen can
        // cancel a still-pending hide from an earlier blur (see bulkComboBlur).
        const _bulkComboHideTimers = {};
        function bulkComboFilter(field) {
            const input = document.getElementById('bulk-' + field);
            const list = document.getElementById('bulk-' + field + '-list');
            if (!input || !list) return;
            // A blur scheduled a hide 180ms out; if this field is being refocused
            // or filtered again before that fires, the hide is stale — cancel it,
            // or it can close the list out from under a tap that reopened it
            // moments earlier (fast field-to-field taps land well inside 180ms).
            clearTimeout(_bulkComboHideTimers[field]);
            const q = input.value.trim().toLowerCase();
            let filtered;
            if (field === 'loc') {
                const items = DEFECT_LOCATIONS.map(l => ({ label: l }));
                filtered = (q ? items.filter(it => (it.label || '').toLowerCase().includes(q)) : items).slice(0, 60);
            } else {
                // Same word-prefix ranking + trade-first tiering as the regular
                // Add Defects screen's Supplier field (2026-08-15, same day):
                // "minimal finger clicks" means the right name should surface in
                // as few keystrokes as possible, and a trade you already know
                // still beats reading company names once you've typed past the
                // empty-field quick-pick chips above.
                filtered = db.getContractors()
                    .filter(c => matchesSearch([c.name, c.trades], q))
                    .sort((a, b) => {
                        const tier = (b.isTradePlaceholder ? 1 : 0) - (a.isTradePlaceholder ? 1 : 0);
                        if (tier) return tier;
                        const r = searchRank([a.name, a.trades], q) - searchRank([b.name, b.trades], q);
                        return r || a.name.localeCompare(b.name);
                    })
                    .map(c => ({ label: c.name }))
                    .slice(0, 60);
            }
            // Chips only on the empty Supplier/Trade field, before a specific search
            // starts — the moment someone types, they're after a real name and the
            // chips would just be in the way of the results.
            const quickHtml = (field === 'sup' && !q)
                ? `<div id="bulk-sup-quick">${BULK_QUICK_TRADES.map(t => `<button type="button" class="bulk-quick-chip" data-quick="${_escHtml(t)}">${_escHtml(t)}</button>`).join('')}</div>`
                : '';
            if (!filtered.length && !quickHtml) { list.style.display = 'none'; return; }
            list.innerHTML = quickHtml + filtered.map((it, i) => `<div data-i="${i}" style="padding:11px 12px;font-size:15px;cursor:pointer;border-bottom:1px solid var(--border-color,#eee);color:var(--text-primary,#111);">${_escHtml(it.label)}</div>`).join('');
            list._items = filtered;
            list.onclick = (e) => {
                // A trade chip resolves to a real contractor at save time the exact
                // same way a typed-and-matched name does (saveBulkPhoto's existing
                // exact-name lookup) — this is a shortcut for typing the word, not a
                // new assignment path. If that trade isn't a live contractor/trade
                // placeholder, it saves unassigned, same as typing it would today.
                const chip = e.target.closest('[data-quick]');
                if (chip) { input.value = chip.getAttribute('data-quick'); list.style.display = 'none'; return; }
                const el = e.target.closest('[data-i]'); if (!el) return;
                const it = list._items[Number(el.getAttribute('data-i'))];
                input.value = it.label;
                list.style.display = 'none';
            };
            list.style.display = 'block';
            // The dropdown opens BELOW the field, inside the same overflow:auto
            // area as the photo and the other field above it — with a keyboard
            // up there often isn't room left before the Skip/Save row, so the
            // chips need scrolling into view (site feedback 2026-08-15).
            //
            // This call alone is NOT enough and never was: at focus time the
            // keyboard has not opened yet, the overlay is still full height,
            // everything already fits and so this scrolls nowhere. The real
            // work happens in _bulkVvSync when the keyboard actually shrinks
            // the viewport. This is here for the case where there is already
            // no room (a short screen, an external keyboard, a re-open while
            // the keyboard is up).
            _bulkRevealOpenList();
            // Belt and braces for the keyboard animation: iOS fires
            // visualViewport resize as it slides in, but not every browser
            // does, and a missed event means chips stuck below the fold with
            // no second chance. Two cheap retries across the animation window.
            setTimeout(_bulkRevealOpenList, 180);
            setTimeout(_bulkRevealOpenList, 420);
        }

        function bulkComboBlur(field) {
            // Delay so a tap on an option registers before the list hides.
            // Replace any earlier pending hide rather than stacking another —
            // several blurs in quick succession (fast field-to-field taps) used
            // to schedule one independent timer each, and whichever fired LAST
            // would hide the list even if it had been legitimately reopened by a
            // later focus in between. One timer per field, always the latest.
            clearTimeout(_bulkComboHideTimers[field]);
            _bulkComboHideTimers[field] = setTimeout(() => {
                const l = document.getElementById('bulk-' + field + '-list'); if (l) l.style.display = 'none';
            }, 180);
        }

        // Keyboard-jump mitigation for Bulk Import (site feedback 2026-08-15):
        // the photo + all three fields don't fit above the keyboard on a phone,
        // so iOS scrolls the whole fixed overlay to bring the focused field into
        // view — which also drags the header off-screen. Shrinking the photo to
        // a thumbnail while any field is focused frees enough height that the
        // fields fit without the overlay needing to move.
        function _bulkFieldFocus() {
            const ov = document.getElementById('bulk-photo-ov');
            if (ov) ov.classList.add('bulk-typing');
        }
        function _bulkFieldBlur() {
            // Tapping straight from one field to another fires blur-then-focus in
            // the same tick; wait a beat so that doesn't flash the photo back to
            // full size for one frame between fields.
            setTimeout(() => {
                const ov = document.getElementById('bulk-photo-ov');
                if (!ov) return;
                const a = document.activeElement;
                const stillTyping = a && ['bulk-loc', 'bulk-sup', 'bulk-desc'].indexOf(a.id) !== -1;
                if (!stillTyping) ov.classList.remove('bulk-typing');
            }, 120);
        }
        let _bulkStylesInjected = false;
        function _ensureBulkPhotoStyles() {
            if (_bulkStylesInjected) return;
            _bulkStylesInjected = true;
            const s = document.createElement('style');
            s.id = 'bulk-photo-styles';
            s.textContent = `
                #bulk-photo-ov .bulk-photo-wrap img { transition: max-height .18s ease; }
                #bulk-photo-ov.bulk-typing .bulk-photo-wrap img { max-height: 72px !important; }
                #bulk-sup-quick { display:flex; flex-wrap:wrap; gap:6px; padding:9px 10px; border-bottom:1px solid var(--border-color,#eee); }
                .bulk-quick-chip { padding:9px 13px; border-radius:15px; border:1px solid #c6c6c8; background:var(--bg-secondary,#f2f2f2); color:var(--text-primary,#111); font-size:14px; cursor:pointer; }
                .bulk-quick-chip:active { background:var(--blue,#2563eb); border-color:var(--blue,#2563eb); color:#fff; }
            `;
            document.head.appendChild(s);
        }
        // iOS anchors position:fixed to the LAYOUT viewport, which doesn't
        // shrink when the keyboard opens — only the VISUAL viewport does. That
        // mismatch is what was clipping the header off-screen: the overlay
        // itself hadn't moved, but the visible area had scrolled down inside it.
        // Tracking visualViewport keeps the overlay sized to what's actually on
        // screen instead of leaving it to iOS's own scroll heuristic.
        let _bulkVvBound = false;
        // Bring whichever combo list is currently open back into the visible
        // area. Called both when a list first opens AND after the viewport
        // changes size — see _bulkVvSync for why the second one is the load-
        // bearing case.
        function _bulkRevealOpenList() {
            ['sup', 'loc', 'desc'].forEach(f => {
                const list = document.getElementById('bulk-' + f + '-list');
                if (!list || list.style.display === 'none') return;
                // Chips are the fast path, so they are what has to be fully
                // visible; fall back to the list itself when they aren't shown.
                const quick = document.getElementById('bulk-' + f + '-quick');
                const target = quick || list;
                if (target.scrollIntoView) target.scrollIntoView({ block: 'nearest', inline: 'nearest' });
            });
        }
        function _bulkVvSync() {
            const ov = document.getElementById('bulk-photo-ov');
            const vv = window.visualViewport;
            if (!ov || !vv) return;
            ov.style.height = vv.height + 'px';
            ov.style.top = vv.offsetTop + 'px';
            // THE case that matters (site report 2026-08-15, third attempt at
            // this bug). The keyboard opens AFTER the field is focused: the
            // scroll done when the list first rendered ran against a still-
            // full-height overlay where everything already fitted, so it did
            // nothing. Only now — once the keyboard has actually shrunk the
            // visible area — is there anything to scroll past, and without
            // this the chips sit below the fold showing just their top edge.
            _bulkRevealOpenList();
        }
        function _bindBulkViewport() {
            _bulkVvSync();
            if (_bulkVvBound || !window.visualViewport) return;
            _bulkVvBound = true;
            window.visualViewport.addEventListener('resize', _bulkVvSync);
            window.visualViewport.addEventListener('scroll', _bulkVvSync);
        }

        // Handle text file upload for bulk address import
        function handleAddressTextUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split('\n').filter(line => line.trim());
                
                let addedCount = 0;
                let skippedCount = 0;

                lines.forEach(line => {
                    const parts = line.trim().split(',').map(p => p.trim());
                    
                    if (parts.length >= 2) {
                        const street = parts[0];
                        const suburb = parts[1];
                        const propertyNumber = parts[2] || '';

                        // Check for duplicates
                        const exists = db.getAddresses().some(a => 
                            a.street.toLowerCase() === street.toLowerCase() && 
                            a.suburb.toLowerCase() === suburb.toLowerCase()
                        );

                        if (!exists) {
                            db.addAddress({ street, suburb, propertyNumber });
                            addedCount++;
                        } else {
                            skippedCount++;
                        }
                    }
                });

                closeModal('add-address-options-modal');
                
                if (addedCount > 0) {
                    showToast(`Added ${addedCount} address(es)${skippedCount > 0 ? `, skipped ${skippedCount} duplicate(s)` : ''}`);
                } else {
                    showToast('No new addresses added', true);
                }
                
                // Reset file input
                event.target.value = '';
            };
            
            reader.readAsText(file);
        }

        //
        // This was a DOUBLE tap until Spiro used it on site (2026-08-02). Double
        // tap is a gesture you have to be told about; a single tap is the one
        // every thumb tries first. The tap-timing detector it needed is gone, and
        // with it the 450ms window where a slow second tap did nothing.
        //
        // Every button inside a row calls event.stopPropagation(), so only taps on
        // the row background or its description reach this listener: the status
        // tab still advances on one tap, and tapping a revealed icon doesn't shut
        // the row underneath it. Delegated from document because the list is
        // rebuilt wholesale on every render.
        (function bindRowExpand() {
            document.addEventListener('click', function (e) {
                const row = e.target && e.target.closest ? e.target.closest('.defect-item') : null;
                if (!row) return;
                const wasOpen = row.classList.contains('row-open');
                document.querySelectorAll('.defect-item.row-open')
                    .forEach(r => r.classList.remove('row-open'));
                if (!wasOpen) row.classList.add('row-open');
            });
        })();

        function statusTab(defect) {
            const s = defectStatusOf(defect);
            const title = s === 'open' ? 'Logged — tap to book in'
                : (s === 'pending' ? 'Booked in — tap to complete'
                : 'Completed — tap to re-open');
            return `<button class="status-tab status-${s}" title="${title}" onclick="event.stopPropagation(); advanceStatus(${defect.id})"></button>`;
        }
        function advanceStatus(defectId) {
            const d = db.data.defects.find(x => x.id === defectId);
            if (!d) return;
            const s = defectStatusOf(d);
            if (s === 'open') { db.setDefectStatus(defectId, 'pending'); render(); flushStatus(); showToast('Booked in'); }
            else if (s === 'pending') {
                if (confirm('Mark this item as completed? It will be removed from the active list.')) {
                    db.setDefectStatus(defectId, 'completed'); render(); flushStatus(); showToast('Item completed');
                }
            } else { db.setDefectStatus(defectId, 'open'); render(); flushStatus(); showToast('Re-opened'); }
        }
        // The status change itself writes STRAIGHT to the database — db.setDefectStatus
        // is wrapped by the cloud layer to direct-write the defect. This just nudges
        // any other pending (contractor/trade) sync along; harmless if there's none.
        function flushStatus() { try { window.CloudSync && window.CloudSync.flush && window.CloudSync.flush(); } catch (e) {} }

        // Location / area of the house, per defect
        // SUPERSET of BPI_LOCATIONS (the vocabulary the report parser detects), so
        // every location an import can produce is also pickable here. It wasn't:
        // 150 of the 319 imported locations — 47% — had no entry in this list, so
        // tapping the pin on an imported defect showed nothing selected and made a
        // captured location look like a missing one (Spiro 2026-07-30).
        //
        // Where the two lists disagreed on wording the report's wording wins: it's
        // what the supervisor reads off the page, and the data agreed — 'WC / Toilet'
        // and 'WIR / Robe' had never been used once, while the report's 'Toilet' and
        // 'Walk In Robe' were, and 'Bedroom N' outnumbered 'Bed N' 28 to 12. The four
        // elevations sit ALONGSIDE 'Facade / External' rather than folded into it:
        // which elevation a brick or render defect is on is what the trade needs.
        const DEFECT_LOCATIONS = ['Throughout',
            'Entry','Hallway','Stairs',
            'Kitchen','Pantry','Meals','Dining','Living','Lounge','Family',
            'Rumpus','Theatre','Sitting','Retreat','Study',
            'Master Bedroom','Bedroom 1','Bedroom 2','Bedroom 3','Bedroom 4','Bedroom 5',
            'Walk In Robe','Linen Cupboard',
            'Ensuite','Bathroom','Powder Room','Toilet',
            'Laundry',
            'Garage','Garage Internal PA Door','Garage External PA Door',
            'Front Door','Alfresco','Porch','Balcony','Driveway','Backyard',
            'Front Elevation','Left Elevation','Right Elevation','Rear Elevation','Facade / External',
            'Roof','Roof Space',
            'General Internal','General External',
            'Other'];

        // ---------------------------------------------------------------------
        //  THE LOCATION BELONGS ON THE ROW (Spiro 2026-08-12)
        //
        //  A defect list read "BPI #18 (p.7) — Seal gap between garage boundary
        //  wall flashing and brick" and said nothing about WHERE. The location
        //  was captured on import and sat behind the 📍 button, one tap per
        //  item — so going through a job meant opening the BPI report again to
        //  find out which room each item was in.
        //
        //  It now leads the sentence:  ref — location — item.  Same order as
        //  the supplier email (formatDefectEmailLine), so what a supervisor
        //  reads on the phone is what the trade receives.
        //
        //  A SHORT CODE, not a shortened word — the abbreviations already on a
        //  floor plan, which is what a supervisor has been reading all day.
        //  Three or four characters cost a word of the row instead of a line of
        //  the screen.
        //
        //  LOWER CASE, on purpose (Spiro 2026-08-12, second pass). These
        //  shipped upper-case and bold and read as a warning label — "the way
        //  the location is shown bothers me, needs to be less obtrusive, more
        //  natural". They are set lower-case HERE rather than with a CSS
        //  text-transform so the text in the DOM is the text on the glass.
        //
        //  EVERY entry in DEFECT_LOCATIONS has a code here, deliberately: one
        //  that fell through to the fallback would render in a different style
        //  from the row above it. tests/loc.mjs fails if a location is added to
        //  the picker without a code, and fails if two locations share one
        //  outside the documented pair below.
        // ---------------------------------------------------------------------
        const LOCATION_ABBR = {
            'Throughout': 'all',
            'Entry': 'entry', 'Hallway': 'hall', 'Stairs': 'stairs',
            'Kitchen': 'kit', 'Pantry': 'pty', 'Meals': 'meals', 'Dining': 'din',
            // Living and Lounge are separate rooms in the picker, so they get
            // separate codes even though Spiro named LIV for both — a plan with
            // both would otherwise send a trade to whichever one it found first.
            'Living': 'liv', 'Lounge': 'lng', 'Family': 'fam',
            'Rumpus': 'rum', 'Theatre': 'thtr', 'Sitting': 'sit',
            'Retreat': 'rtrt', 'Study': 'study',
            // THE ONE DELIBERATE COLLISION. The master bedroom IS bedroom 1 on
            // an Australian project-home plan, and Spiro asked for it by name
            // ("master bed is to be B1") — it had been its own code, which put
            // two names for one room on one job's list. A BPI report can say
            // either, so both land on b1. Bedrooms 2-5 are unaffected.
            'Master Bedroom': 'b1',
            'Bedroom 1': 'b1', 'Bedroom 2': 'b2', 'Bedroom 3': 'b3',
            'Bedroom 4': 'b4', 'Bedroom 5': 'b5',
            'Walk In Robe': 'wir', 'Linen Cupboard': 'lin',
            'Ensuite': 'ens', 'Bathroom': 'bth', 'Powder Room': 'pdr', 'Toilet': 'wc',
            'Laundry': 'ldry',
            'Garage': 'gar',
            'Garage Internal PA Door': 'gar int pa',
            'Garage External PA Door': 'gar ext pa',
            'Front Door': 'frt door', 'Alfresco': 'alf', 'Porch': 'porch',
            'Balcony': 'balc', 'Driveway': 'd/way', 'Backyard': 'b/yard',
            'Front Elevation': 'frt elev', 'Left Elevation': 'lh elev',
            'Right Elevation': 'rh elev', 'Rear Elevation': 'rear elev',
            'Facade / External': 'facade',
            'Roof': 'roof', 'Roof Space': 'roof sp',
            'General Internal': 'gen int', 'General External': 'gen ext',
            'Other': 'other',
        };
        // Master Bedroom and Bedroom 1 are the same room; every OTHER pair
        // sharing a code is a bug. tests/loc.mjs reads this, so widening it is
        // a deliberate act with a reason attached, not a quiet test edit.
        const LOCATION_ABBR_SHARED = [['Master Bedroom', 'Bedroom 1']];
        // Lookup is case- and space-insensitive: locations also arrive typed by
        // hand (the review screen takes a custom one) and 'walk in robe' has to
        // land on the same entry as 'Walk In Robe'.
        const LOCATION_ABBR_KEYS = (() => {
            const m = {};
            for (const k in LOCATION_ABBR) m[k.toLowerCase().replace(/\s+/g, ' ')] = LOCATION_ABBR[k];
            return m;
        })();
        // Fallback for a location TYPED rather than picked — 'Bedroom 6',
        // 'Store Cupboard'. Word-level, then upper-cased, so a custom one comes
        // out as a code in the same style as the table instead of being the one
        // sentence-case row in a screen full of codes.
        const LOCATION_WORD_ABBR = [
            [/\bwalk[- ]?in robes?\b/gi, 'wir'],
            [/\bbedroom\s*(\d+)\b/gi, 'b$1'],
            [/\bbedrooms?\b/gi, 'bed'],
            [/\bbathrooms?\b/gi, 'bth'],
            [/\bensuites?\b/gi, 'ens'],
            [/\bkitchens?\b/gi, 'kit'],
            [/\blaundry\b/gi, 'ldry'],
            [/\bcupboards?\b/gi, 'cpd'],
            [/\belevations?\b/gi, 'elev'],
            [/\bgeneral\b/gi, 'gen'],
            [/\binternal\b/gi, 'int'],
            [/\bexternal\b/gi, 'ext'],
        ];
        // The fallback does NOT truncate. A code nobody recognises is worth
        // less than a long one they do, and a typed location is rare — the
        // picker covers 48. The full wording is never lost either way: it is on
        // the 📍 button, the preview card, and every email / PDF / clipboard line.
        function abbreviateLocation(loc) {
            const s = String(loc == null ? '' : loc).trim();
            if (!s) return '';
            const hit = LOCATION_ABBR_KEYS[s.toLowerCase().replace(/\s+/g, ' ')];
            if (hit) return hit;
            let out = s;
            for (const [re, to] of LOCATION_WORD_ABBR) out = out.replace(re, to);
            return out.toLowerCase().replace(/\s+/g, ' ');
        }

        // One defect → the parts of the line a supervisor reads:
        //   { ref: 'BPI #18 (p.7)', loc: 'GAR INT PA', body: 'Seal gap …' }
        // ref is '' on a typed defect (no report behind it) and loc is '' when
        // no location was ever set; both drop out of the line rather than
        // leaving a stray dash. `full` is the unabbreviated location, kept so
        // the code on the row can always be turned back into a room name.
        function defectLineParts(d) {
            const ref = splitReportRef(d && d.description);
            const full = String((d && d.location) || '').trim();
            return { ref: ref.label, loc: abbreviateLocation(full), full, body: ref.body.trim() };
        }
        // "BPI #3 (p.3) - kit: Seal gaps to flooring at dishwasher opening"
        //
        // A plain hyphen after the reference and a COLON after the location,
        // not em dashes between all three (Spiro 2026-08-12, second pass): the
        // em dash is wide enough that three of them turned a defect into a list
        // of fragments. A colon makes the code read as what it is — a label on
        // the sentence that follows — and the sentence reads as a sentence.
        // Each separator only appears when the piece before it does, so a typed
        // defect is "ldry: …" and one with no location is "BPI #16 (p.6) - …".
        function defectLineHtml(d) {
            const p = defectLineParts(d);
            // title= is the escape hatch for a code that hasn't been learnt
            // yet: press and hold the row, or hover on a desktop, and the full
            // room name is there without opening the location picker.
            let out = p.ref ? `<span class="defect-line-ref">${_pvEsc(p.ref)}</span>` : '';
            if (p.loc) out += (out ? ' - ' : '')
                + `<span class="defect-line-loc" title="${_pvEsc(p.full)}">${_pvEsc(p.loc)}</span>`;
            if (p.body) out += (p.loc ? ': ' : (out ? ' - ' : '')) + _pvEsc(p.body);
            return out;
        }

        function locationControl(defect) {
            const cur = defect.location || '';
            return `<button class="loc-btn ${cur ? 'has-loc' : ''}" title="${cur || 'Set location'}" onclick="event.stopPropagation(); openLocationPicker(${defect.id})">📍</button>`;
        }
        function openLocationPicker(defectId) {
            const d = db.data.defects.find(x => x.id === defectId); if (!d) return;
            const cur = d.location || '';
            const opt = (val, label) => `<button class="loc-opt ${val === cur ? 'sel' : ''}" onclick="pickLocation(${defectId}, '${String(val).replace(/'/g, "\\'")}')">${label}</button>`;
            const items = opt('', '— None —') + DEFECT_LOCATIONS.map(l => opt(l, l)).join('');
            impOverlay(`<div id="imp-head"><strong>📍 Location</strong><button id="imp-close">✕</button></div>
                <div id="imp-body">${LOC_SEARCH_INPUT}<div class="loc-grid">${items}</div></div>`);
            focusLocSearch();
        }
        // Live filter for the location picker grid (type to narrow, no scrolling).
        const LOC_SEARCH_INPUT = '<input id="loc-search" type="text" placeholder="🔍 Search location…" oninput="filterLocOpts(this.value)" autocomplete="off" style="width:100%;box-sizing:border-box;padding:11px 12px;margin-bottom:10px;border:1px solid var(--border-color,#ccc);border-radius:10px;font-size:16px;">';
        function filterLocOpts(q) {
            q = (q || '').trim().toLowerCase();
            document.querySelectorAll('#imp-ov .loc-opt').forEach(b => {
                const t = (b.textContent || '').toLowerCase();
                const isNone = t.indexOf('none') !== -1;
                b.style.display = (!q ? true : (!isNone && t.indexOf(q) !== -1)) ? '' : 'none';
            });
        }
        function focusLocSearch() { const el = document.getElementById('loc-search'); if (el) setTimeout(() => el.focus(), 50); }
        function pickLocation(defectId, loc) {
            db.setDefectLocation(defectId, loc);
            impClose(); render();
            showToast(loc ? ('Location: ' + loc) : 'Location cleared');
        }

        function setDefectStatus(defectId, status) {
            db.setDefectStatus(defectId, status);
            render();
            const labels = { open: 'Open', pending: 'Pending', completed: 'Completed' };
            showToast('Status set to ' + (labels[status] || status));
        }

        // ===========================================================================
        //  SHOPPING LIST — parts and materials the SUPERVISOR has to order
        //  (Spiro 2026-08-02)
        //
        //  A defect can be assigned to a trade and still be blocked on the
        //  supervisor: a part to order, materials to pick up. Those used to live in
        //  emails and phone notes and got lost. Flagging the defect puts it on a
        //  shopping list — per job, and across every job the supervisor holds — so
        //  a trip to the hardware store is one screen instead of a search through
        //  three apps.
        //
        //  The flag lives ON the defect, so the two can't drift: completing the
        //  work takes the item off the list with no extra step.
        // ===========================================================================
        const ORDER_STATES = ['needed', 'ordered', 'done'];
        const ORDER_META = {
            needed:  { icon: '🛒', label: 'To order', next: 'ordered', toast: '🛒 To order' },
            ordered: { icon: '📦', label: 'Ordered',  next: 'done',    toast: '📦 Marked as ordered' },
            // 'done' = the PART is in hand. The defect itself stays open — the
            // trade still has to fit it. That's the whole point of tracking the
            // two separately.
            done:    { icon: '✅', label: 'Got it',   next: '',        toast: '✅ Got it — off the shopping list' },
        };
        function orderStatusOf(d) {
            const s = d && d.orderStatus;
            return ORDER_STATES.indexOf(s) >= 0 ? s : '';
        }
        // On the shopping list until the part is in hand OR the defect is completed.
        function onShoppingList(d) {
            const s = orderStatusOf(d);
            return (s === 'needed' || s === 'ordered') && defectStatusOf(d) !== 'completed';
        }
        function shoppingItems(addressId) {
            return (db.data.defects || []).filter(d =>
                onShoppingList(d) && (addressId == null || d.addressId === addressId));
        }

        // Fourth control on an expanded defect row, beside ✏️ 📍 📸.
        function orderControl(defect) {
            const s = orderStatusOf(defect);
            const meta = ORDER_META[s];
            const title = s
                ? meta.label + ' — tap to take it off the shopping list'
                : 'Order a part or materials for this item — puts it on the job shopping list';
            return `<button class="order-btn ${s ? 'is-' + s : ''}" title="${title}"
                        onclick="event.stopPropagation(); toggleDefectOrder(${defect.id})">${s ? meta.icon : '🛒'}</button>`;
        }
        // The row icon is a plain on/off switch. Advancing through ordered → got it
        // happens on the shopping list itself, which is where the supervisor is
        // standing when that changes.
        function toggleDefectOrder(defectId) {
            const d = db.data.defects.find(x => x.id === defectId);
            if (!d) return;
            const was = orderStatusOf(d);
            db.setDefectOrder(defectId, was ? '' : 'needed');
            render(); flushStatus();
            showToast(was ? 'Taken off the shopping list' : '🛒 Added to the shopping list');
        }
        // Advance on the list: To order → Ordered → Got it (leaves the list).
        function advanceOrder(defectId) {
            const d = db.data.defects.find(x => x.id === defectId);
            if (!d) return;
            const cur = orderStatusOf(d) || 'needed';
            const next = ORDER_META[cur].next;
            db.setDefectOrder(defectId, next);
            render(); flushStatus();
            showToast(next ? ORDER_META[next].toast : ORDER_META.done.toast);
        }
        function clearOrder(defectId) {
            db.setDefectOrder(defectId, '');
            render(); flushStatus();
            showToast('Taken off the shopping list');
        }

        // Camera button + photo count, shown beside every defect.
        function photoIcon(defect) {
            const count = (window.CloudPhotos ? window.CloudPhotos.count(defect.id) : 0) || 0;
            const onclick = window.CloudPhotos
                ? `window.CloudPhotos.openGallery(${defect.id})`
                : `showToast('Log in to use photos')`;
            return `<button class="photo-btn ${count ? 'has-photos' : ''}" title="Photos"
                        onclick="event.stopPropagation(); ${onclick}">📸${count ? `<span class="photo-count">${count}</span>` : ''}</button>`;
        }

        // Pencil beside every defect — edit its description / supplier after entry.
        function editControl(defect) {
            return `<button class="edit-btn" title="Edit description / supplier"
                        onclick="event.stopPropagation(); openDefectEdit(${defect.id})">✏️</button>`;
        }
        // Edit modal: change the wording and reassign the supplier via the same
        // predictive dropdown used in BPI review. Leaving the supplier blank sets
        // it back to Unassigned.
        function openDefectEdit(defectId) {
            const d = db.data.defects.find(x => x.id === defectId);
            if (!d) return;
            const esc = s => (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
            const cObj = d.contractorId != null ? db.getContractor(d.contractorId) : null;
            impOverlay(`
                <div id="imp-head"><strong>✏️ Edit defect</strong><button id="imp-close">✕</button></div>
                <div id="imp-body">
                    <div class="imp-field" style="margin-bottom:14px">
                        <label>Description</label>
                        <textarea id="de-desc" style="width:100%;box-sizing:border-box;min-height:84px;padding:11px;border:1px solid var(--border-color,#ccc);border-radius:10px;font-size:16px;font-family:inherit;">${esc(d.description)}</textarea>
                    </div>
                    <div class="imp-field" style="margin-bottom:16px">
                        <label>Supplier</label>
                        <div class="rv-combo">
                            <input type="text" id="de-contractor-input" class="rv-combo-input" placeholder="Type to search, or leave blank…" autocomplete="off" value="${esc(cObj ? cObj.name : '')}">
                            <input type="hidden" id="de-contractor" value="${d.contractorId != null ? d.contractorId : ''}">
                            <div class="rv-combo-list" id="de-contractor-list"></div>
                        </div>
                    </div>
                    <button class="imp-btn" id="de-save">Save changes</button>
                </div>`);
            defectEditCombo();
            document.getElementById('de-save').onclick = () => {
                const desc = (document.getElementById('de-desc').value || '').trim();
                if (!desc) { showToast('Description can’t be empty', true); return; }
                const cidRaw = document.getElementById('de-contractor').value;
                // Blank supplier → fall back to the job's supervisor (same as adding),
                // so an edit can never leave a defect "Unassigned".
                const contractorId = cidRaw === ''
                    ? db.supervisorContractorIdFor(d.addressId)
                    : parseInt(cidRaw, 10);
                db.updateDefect(defectId, { description: desc, contractorId });
                // "Assign all <Trade> tasks to <Supplier>?" (Spiro 2026-07-14, parity
                // with CH Tracker): a real-sub pick offers to also assign every other
                // not-yet-really-assigned defect of the same trade at this job.
                let bulkN = 0;
                const newC = (cidRaw !== '' && contractorId != null) ? db.getContractor(contractorId) : null;
                const isRealSub = c => c && !c.isTradePlaceholder && !/\bsupervisor\b/i.test(c.trades || '');
                if (newC && isRealSub(newC)) {
                    const trade = resolveTrade((d.location || '') + ' ' + stripReportRef(desc)).trade || contractorToBpiTrade(newC);
                    if (trade) {
                        const others = db.getDefects({ addressId: d.addressId }).filter(x =>
                            x.id !== d.id &&
                            !isRealSub(x.contractorId != null ? db.getContractor(x.contractorId) : null) &&
                            resolveTrade((x.location || '') + ' ' + stripReportRef(x.description)).trade === trade);
                        if (others.length && confirm('Assign all ' + (others.length + 1) + ' ' + trade + ' task' + (others.length ? 's' : '') + ' at this job to ' + newC.name + '?\n\n(Cancel assigns only this one.)')) {
                            for (const x of others) db.updateDefect(x.id, { contractorId });
                            bulkN = others.length;
                        }
                        // The pick is a confirmation — teach the shared learner.
                        const phrase = normalizePhrase((d.location || '') + ' ' + stripReportRef(desc));
                        if (phrase && window.CloudLearning) { try { window.CloudLearning.record(phrase, contractorToBpiTrade(newC) || trade, null,
                            { observation: (d.location ? d.location + ' ' : '') + stripReportRef(desc), source: 'edit', jobId: window.CloudLearning.jobUuidForAddress(d.addressId) }); } catch (e) {} }
                    }
                }
                impClose(); render(); flushStatus();
                const sup = (contractorId != null && (db.getContractor(contractorId) || {}).name) || '';
                showToast(bulkN ? ((bulkN + 1) + ' defects assigned to ' + (newC ? newC.name : sup)) : (cidRaw === '' && sup ? ('Supplier set to ' + sup) : 'Defect updated'));
            };
        }
        // ── Bulk reassign: move EVERY open defect in a contractor group (at one
        // address) to another contractor or trade (Spiro 2026-07-11 — the ✏️ on
        // the group header). Uses the same predictive picker as the edit modal
        // (real subs + active trade placeholders). Each move also teaches the
        // learner the NEW contractor's trade for each defect's wording.
        function openReassignGroup(contractorId, addressId) {
            const groupDefects = db.getDefects({ addressId }).filter(d =>
                contractorId == null ? (d.contractorId == null) : d.contractorId === contractorId);
            if (!groupDefects.length) { showToast('No active defects in this group'); return; }
            const fromName = contractorId != null ? ((db.getContractor(contractorId) || {}).name || 'Unknown') : 'Unassigned';
            const esc = s => (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
            impOverlay(`
                <div id="imp-head"><strong>✏️ Reassign all — ${esc(fromName)}</strong><button id="imp-close">✕</button></div>
                <div id="imp-body">
                    <div style="font-size:13px;color:var(--text-secondary,#888);margin-bottom:12px">
                        Move <strong>${groupDefects.length}</strong> defect${groupDefects.length === 1 ? '' : 's'} at this job to another contractor or trade.
                    </div>
                    <div class="imp-field" style="margin-bottom:16px">
                        <label>New contractor / trade</label>
                        <div class="rv-combo">
                            <input type="text" id="de-contractor-input" class="rv-combo-input" placeholder="Type to search…" autocomplete="off" value="">
                            <input type="hidden" id="de-contractor" value="">
                            <div class="rv-combo-list" id="de-contractor-list"></div>
                        </div>
                    </div>
                    <button class="imp-btn" id="rg-save">Reassign ${groupDefects.length} defect${groupDefects.length === 1 ? '' : 's'}</button>
                </div>`);
            defectEditCombo();
            document.getElementById('rg-save').onclick = () => {
                const cidRaw = document.getElementById('de-contractor').value;
                const newId = cidRaw === '' ? null : parseInt(cidRaw, 10);
                if (newId == null) { showToast('Pick a contractor or trade first', true); return; }
                if (newId === contractorId) { showToast('That’s the same contractor'); return; }
                const newC = db.getContractor(newId);
                if (!newC) { showToast('Contractor not found', true); return; }
                // The reassignment is a supervisor confirmation: teach the learner
                // the NEW contractor's TRADE for each defect's wording (clean desc,
                // without the "BPI #N (p.X) — " report reference).
                const learnedTrade = contractorToBpiTrade(newC);
                for (const d of groupDefects) {
                    db.updateDefect(d.id, { contractorId: newId });
                    if (learnedTrade && window.CloudLearning) {
                        const cleanDesc = stripReportRef(d.description);
                        const phrase = normalizePhrase((d.location || '') + ' ' + cleanDesc);
                        if (phrase) { try { window.CloudLearning.record(phrase, learnedTrade, null,
                            { observation: (d.location ? d.location + ' ' : '') + cleanDesc, source: 'reassign', jobId: window.CloudLearning.jobUuidForAddress(d.addressId) }); } catch (e) {} }
                    }
                }
                // Reassigning from the TRADE view can move items off the very list
                // being looked at — the new supplier may not carry this trade — and
                // they then just disappear as the screen re-renders. Say so, or it
                // reads as the move having gone wrong.
                let gone = '';
                try {
                    if (state.currentView === 'view-defects-trade' && state.filters
                        && Array.isArray(state.filters.contractorIds)
                        && !state.filters.contractorIds.includes(newId)) {
                        gone = ` — no longer on the ${state.filters.tradeName || 'this'} list`;
                    }
                } catch (e) {}
                impClose(); render(); flushStatus();
                showToast(`Moved ${groupDefects.length} defect${groupDefects.length === 1 ? '' : 's'} to ${newC.name}${gone}`);
            };
        }
        // Self-contained predictive supplier dropdown for the edit modal (mirrors
        // rvCombo but writes to #de-contractor and isn't tied to BPI review state).
        function defectEditCombo() {
            const input = document.getElementById('de-contractor-input');
            const hidden = document.getElementById('de-contractor');
            const list = document.getElementById('de-contractor-list');
            if (!input || !hidden || !list) return;
            const options = db.getContractors()
                .filter(c => !c.isTradePlaceholder || c.isActive !== false)
                .slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''))
                .map(c => ({ id: c.id, label: c.name + (!c.isTradePlaceholder && c.trades && c.trades !== 'No Trade Assigned' ? ' — ' + c.trades.split(',')[0] : '') }));
            const esc = s => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
            const currentLabel = () => { const o = options.find(x => String(x.id) === String(hidden.value)); return o ? o.label : ''; };
            const draw = (q) => {
                list.innerHTML = comboItems(options, q, esc);
                list.classList.add('open');
                syncComboRoom();
            };
            input.addEventListener('focus', () => {
                if (input.value && input.value === currentLabel()) input.value = '';
                draw(input.value);
                setTimeout(() => { try { input.setSelectionRange(0, input.value.length); } catch (e) {} }, 0);
            });
            input.addEventListener('input', () => { if (!input.value.trim()) hidden.value = ''; draw(input.value); });
            input.addEventListener('blur', () => setTimeout(() => {
                list.classList.remove('open'); syncComboRoom();
                if (!input.value.trim() && hidden.value) input.value = currentLabel();
            }, 150));
            list.addEventListener('mousedown', (e) => {
                const it = e.target.closest('.rv-combo-item'); if (!it) return;
                e.preventDefault();
                const id = parseInt(it.getAttribute('data-id'));
                const o = options.find(x => x.id === id);
                input.value = o ? o.label : '';
                hidden.value = id;
                list.classList.remove('open'); syncComboRoom();
            });
        }

        // Friendly DD/MM/YYYY for display + reports
        function fmtDateNice(v) {
            if (!v) return '';
            const s = String(v).slice(0, 10);
            const p = s.split('-');
            return (p.length === 3) ? `${p[2]}/${p[1]}/${p[0]}` : s;
        }

        // DD/MM for the supplier heading only — the year costs 5 characters on the
        // one line the supplier's name is fighting for, and a booking is always
        // days away, never years (Spiro 2026-08-02). Reports and emails keep
        // fmtDateNice and its year; the button's tooltip carries the full date.
        function fmtDateShort(v) {
            if (!v) return '';
            const p = String(v).slice(0, 10).split('-');
            return (p.length === 3) ? `${p[2]}/${p[1]}` : String(v).slice(0, 10);
        }

            // already says (Spiro 2026-08-02). With no date there's nothing to
            // show, so the icon stays as the thing you tap to add one. Tapping

            return `<button class="supplier-book-btn ${dt ? 'has-booking date-only' : ''}"

        // The single 📤 in a supplier heading expands into ✉️ / 🔗 / 📑. Only one

        // Per-job (address) defects view: expand/collapse the completed list.

        // The toolbar pill. Coloured dots show which statuses are on; a dimmed dot

        // ── PREVIEW MODE ────────────────────────────────────────────────────
        // Walk-the-house mode (Spiro 2026-07-31). The compact list is built for
        // scanning; this is built for DOING. Each defect becomes a card with its
        // description at readable size and the report photo directly underneath,
        // so you scroll thumb-first and tick items off as you find them —

        function previewMode() { try { return localStorage.getItem('dm_preview') === '1'; } catch (e) { return false; } }

        // Toolbar glyphs. Drawn rather than picked from the emoji set so they

        // with the emoji already used for the actions (📋 📑 📧 🔗 ➕ 🔄).
        // Traffic light for the filter: the three statuses it selects ARE red,
        // amber and green, so the glyph says what the control does (Spiro
        // 2026-08-02). ☰ and 📺 carry the list/preview toggle — 🖼️ read as a

        const ICON_FUNNEL = '🚦';

        // One button, two states, showing the view you'll GET when you tap it —

        // 🛒 in the toolbar, beside the list/preview toggle. Job-scoped when an

        // The shopping list itself. ONE renderer for both entry points: a job's
        // list is the global list filtered to that job, so the two can't drift.
        // Grouped by address either way — that's the order a supervisor works in,
        // and on the global list it's what makes a hardware run plannable.
        function renderShoppingView(addressId) {
            const scoped = addressId != null;
            const address = scoped ? db.getAddress(addressId) : null;
            if (scoped && !address) { state.currentView = 'home'; return renderHomeView(); }
            const items = shoppingItems(scoped ? addressId : null);
            // Global list respects the same job scoping as the rest of the app —
            // a supervisor sees their own jobs, a manager sees everything.
            const visible = new Set(scopeAddressesToUser(db.getAddresses() || []).map(a => a.id));
            const list = scoped ? items : items.filter(d => visible.has(d.addressId));

            const byAddress = new Map();
            for (const d of list) {
                const arr = byAddress.get(d.addressId);
                if (arr) arr.push(d); else byAddress.set(d.addressId, [d]);
            }
            const groups = [...byAddress.entries()]
                .map(([aid, defects]) => ({ address: db.getAddress(aid), defects }))
                .filter(g => g.address)
                .sort((a, b) => formatAddress(a.address).localeCompare(formatAddress(b.address)));

            const row = (d) => {
                const s = orderStatusOf(d) || 'needed';
                const meta = ORDER_META[s];
                const c = d.contractorId != null ? db.getContractor(d.contractorId) : null;
                const sub = [d.location || '', (c && c.name) || 'Unassigned'].filter(Boolean).join(' · ');
                return `<div class="shop-item ${s === 'ordered' ? 'is-ordered' : ''}">
                    <button class="shop-state" onclick="advanceOrder(${d.id})"

            const total = list.length;
            const heading = scoped ? lotTitleHtml(address) : `<span class="lot-addr">Shopping List</span>`;
            return `
                <div class="defects-container">
                    <div class="app-header">
